# Local, self-hosted stack: PostgreSQL plus the app.
#
#   cp .env.example .env      # fill in AUTH_SECRET at minimum
#   docker compose up --build
#   docker compose exec app npx prisma migrate deploy
#   docker compose exec app npm run db:seed        # optional
#
# Then open http://localhost:3000/mosh and register the first account.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mosh}
      POSTGRES_DB: ${POSTGRES_DB:-mosh}
    volumes:
      - mosh-db:/var/lib/postgresql/data
    ports:
      # Exposed for local tooling (psql, Prisma Studio). Drop this line on a
      # server: the app reaches the database over the compose network.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosh} -d ${POSTGRES_DB:-mosh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mosh}:${POSTGRES_PASSWORD:-mosh}@db:5432/${POSTGRES_DB:-mosh}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — generate with: openssl rand -base64 32}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Optional. Without it, The Billionaire Self answers from its written
      # playbook and every other module is unaffected.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MOSH_SEED_DEMO: ${MOSH_SEED_DEMO:-false}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  mosh-db:
