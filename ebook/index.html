<meta name="color-scheme" content="light dark">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --bg:#faf8f5; --surface:#ffffff; --surface-2:#f4f1ec; --text:#1d1b18; --muted:#6d6862;
  --accent:#b0521c; --accent-soft:#f6e7db; --rule:#e6e1d8; --mark:#ffe9a8; --mark-edge:#e8c25f;
  --ok:#1d7a4c; --ok-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(28,24,18,.05), 0 8px 24px rgba(28,24,18,.06);
  --radius:14px; --maxw:44rem; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --reader-font:var(--serif); --reader-size:1.075rem; --reader-leading:1.75;
}
html[data-theme="sepia"]{
  --bg:#f3e9d6; --surface:#fbf4e4; --surface-2:#eee1c8; --text:#3a3125; --muted:#7b6c55;
  --accent:#8f4a15; --accent-soft:#f0e0c6; --rule:#e0d0b0; --mark:#f7dd97; --mark-edge:#d9b25c;
  --ok:#1c6b45; --ok-soft:#e2eeda; --bad:#a12f22; --bad-soft:#f6e0d8;
  --shadow:0 1px 2px rgba(60,45,20,.06), 0 8px 24px rgba(60,45,20,.07);
}
html[data-theme="night"]{
  --bg:#131519; --surface:#1a1d23; --surface-2:#22262e; --text:#e7e6e3; --muted:#9aa1ab;
  --accent:#f0a468; --accent-soft:#33261c; --rule:#2c313a; --mark:#5c4a1f; --mark-edge:#8c7433;
  --ok:#5fcf9b; --ok-soft:#16301f; --bad:#f08a80; --bad-soft:#331b19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
html[data-font="sans"]{ --reader-font:var(--sans); }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:none; }
a{ color:var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }

/* ============================================================
   Shell
   ============================================================ */
#app{ display:flex; flex-direction:column; height:100dvh; }

.topbar{
  display:flex; align-items:center; gap:.5rem; padding:.55rem .75rem;
  background:var(--surface); border-bottom:1px solid var(--rule); position:relative; z-index:40; flex:0 0 auto;
}
.topbar .brand{ display:flex; align-items:center; gap:.55rem; min-width:0; margin-right:auto; }
.brand-mark{
  width:1.9rem; height:1.9rem; border-radius:8px; flex:0 0 auto; display:grid; place-items:center;
  background:linear-gradient(145deg,var(--accent),#7a3410); color:#fff; font-weight:700; font-size:.78rem; letter-spacing:.02em;
}
html[data-theme="night"] .brand-mark{ background:linear-gradient(145deg,#c9743c,#7a3410); color:#fff; }
.brand-text{ min-width:0; }
.brand-title{ font-size:.86rem; font-weight:650; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-sub{ font-size:.7rem; color:var(--muted); line-height:1.2; }

.iconbtn{
  width:2.15rem; height:2.15rem; border-radius:9px; display:grid; place-items:center; color:var(--muted);
  border:1px solid transparent; transition:background .15s, color .15s, border-color .15s;
}
.iconbtn:hover{ background:var(--surface-2); color:var(--text); }
.iconbtn[aria-pressed="true"],.iconbtn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--rule); }
.iconbtn svg{ width:1.15rem; height:1.15rem; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

.progress-pill{
  display:inline-flex; align-items:center; gap:.45rem; padding:.3rem .6rem; border-radius:999px;
  background:var(--surface-2); font-size:.74rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.progress-pill b{ color:var(--text); font-weight:650; }
.ring{ width:1.1rem; height:1.1rem; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:3.2; }
.ring .bg{ stroke:var(--rule); }
.ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .4s ease; }

.scrollprogress{ position:absolute; left:0; bottom:-1px; height:2px; background:var(--accent); width:0; transition:width .1s linear; z-index:41; }

.layout{ flex:1 1 auto; display:flex; min-height:0; position:relative; }

/* ---------- Sidebar ---------- */
#sidebar{
  width:19.5rem; flex:0 0 19.5rem; background:var(--surface); border-right:1px solid var(--rule);
  display:flex; flex-direction:column; min-height:0;
}
#sidebar[hidden]{ display:none; }
.side-head{ padding:.7rem .8rem; border-bottom:1px solid var(--rule); }
.search-wrap{ position:relative; }
.search-wrap svg{ position:absolute; left:.6rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; fill:none; stroke:var(--muted); stroke-width:1.8; }
#search{
  width:100%; padding:.5rem .6rem .5rem 2rem; border-radius:9px; border:1px solid var(--rule);
  background:var(--bg); font-size:.85rem;
}
#search::placeholder{ color:var(--muted); }
.side-scroll{ overflow-y:auto; padding:.5rem .55rem 1.5rem; flex:1 1 auto; overscroll-behavior:contain; }
.side-scroll::-webkit-scrollbar{ width:9px; }
.side-scroll::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:9px; }

.toc-cover{
  display:flex; align-items:center; gap:.5rem; width:100%; text-align:left; padding:.5rem .55rem; border-radius:9px;
  font-size:.83rem; color:var(--muted); font-weight:550;
}
.toc-cover:hover{ background:var(--surface-2); color:var(--text); }
.toc-part{ margin-top:.9rem; }
.toc-part-title{
  font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  padding:.35rem .55rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem;
}
.toc-part-count{ font-weight:600; letter-spacing:0; text-transform:none; opacity:.8; font-variant-numeric:tabular-nums; }
.toc-item{
  display:flex; gap:.55rem; align-items:flex-start; width:100%; text-align:left; padding:.45rem .55rem;
  border-radius:9px; font-size:.83rem; line-height:1.35; color:var(--text); position:relative;
}
.toc-item:hover{ background:var(--surface-2); }
.toc-item.current{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.toc-item .dot{
  width:.95rem; height:.95rem; flex:0 0 auto; margin-top:.12rem; border-radius:50%;
  border:1.6px solid var(--rule); display:grid; place-items:center;
}
.toc-item.done .dot{ background:var(--ok); border-color:var(--ok); }
.toc-item.done .dot::after{ content:""; width:.28rem; height:.5rem; border:solid #fff; border-width:0 1.8px 1.8px 0; transform:rotate(42deg) translate(-.5px,-1px); }
.toc-item .num{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:.75rem; }
.toc-item.current .num{ color:var(--accent); }
.toc-min{ margin-left:auto; font-size:.7rem; color:var(--muted); flex:0 0 auto; padding-left:.3rem; }

.search-result{ display:block; width:100%; text-align:left; padding:.5rem .55rem; border-radius:9px; font-size:.8rem; line-height:1.4; }
.search-result:hover{ background:var(--surface-2); }
.search-result .sr-title{ font-weight:600; display:block; margin-bottom:.15rem; }
.search-result .sr-snip{ color:var(--muted); }
.search-result mark{ background:var(--mark); color:inherit; border-radius:2px; padding:0 .1em; }
.side-empty{ padding:1rem .6rem; font-size:.82rem; color:var(--muted); }

/* ---------- Main ---------- */
#main{ flex:1 1 auto; overflow-y:auto; min-width:0; scroll-behavior:smooth; overscroll-behavior:contain; }
.reader{ max-width:var(--maxw); margin:0 auto; padding:2.5rem 1.5rem 6rem; }

/* ---------- Cover ---------- */
.cover{ max-width:52rem; margin:0 auto; padding:2rem 1.5rem 5rem; }
.cover-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:20px; box-shadow:var(--shadow);
  padding:clamp(1.5rem,4vw,3rem); position:relative; overflow:hidden;
}
.cover-card::before{
  content:""; position:absolute; inset:0 auto 0 0; width:6px;
  background:linear-gradient(180deg,var(--accent),#7a3410);
}
.cover-eyebrow{ font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.cover h1{ font-family:var(--serif); font-size:clamp(1.9rem,5vw,3rem); line-height:1.1; margin:.6rem 0 .5rem; letter-spacing:-.015em; }
.cover .sub{ font-size:1rem; color:var(--muted); line-height:1.55; max-width:38rem; margin:0 0 .35rem; }
.cover .byline{ font-size:.85rem; color:var(--muted); margin:1rem 0 0; }
.cover-stats{ display:flex; flex-wrap:wrap; gap:.5rem; margin:1.4rem 0 1.6rem; }
.stat{ background:var(--surface-2); border-radius:11px; padding:.55rem .8rem; min-width:5.5rem; }
.stat b{ display:block; font-size:1.15rem; line-height:1.2; font-variant-numeric:tabular-nums; }
.stat span{ font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.cover-actions{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
.btn{
  display:inline-flex; align-items:center; gap:.45rem; padding:.6rem 1rem; border-radius:10px;
  background:var(--accent); color:#fff; font-size:.88rem; font-weight:600; border:1px solid transparent;
  transition:filter .15s, transform .05s;
}
html[data-theme="night"] .btn{ color:#1a1207; }
.btn:hover{ filter:brightness(1.07); }
.btn:active{ transform:translateY(1px); }
.btn.ghost{ background:var(--surface-2); color:var(--text); border-color:var(--rule); }
.btn.ghost:hover{ background:var(--rule); filter:none; }
.btn.small{ padding:.4rem .7rem; font-size:.8rem; }
.btn svg{ width:1rem; height:1rem; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

.cover-bar{ height:.4rem; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:1.4rem 0 .5rem; }
.cover-bar i{ display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease; }
.cover-bar-label{ font-size:.76rem; color:var(--muted); }

.parts-grid{ display:grid; gap:.9rem; margin-top:2rem; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); }
.part-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); padding:1rem 1.1rem; text-align:left;
  display:flex; flex-direction:column; gap:.4rem; transition:border-color .15s, transform .1s, box-shadow .15s; width:100%;
}
.part-card:hover{ border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px); }
.part-card h3{ margin:0; font-size:.95rem; font-family:var(--serif); }
.part-card p{ margin:0; font-size:.82rem; color:var(--muted); line-height:1.5; }
.part-card .meta{ font-size:.72rem; color:var(--muted); display:flex; gap:.5rem; align-items:center; margin-top:.2rem; }
.part-card .meta i{ font-style:normal; color:var(--ok); font-weight:600; }

/* ---------- Chapter ---------- */
.ch-head{ margin-bottom:1.8rem; }
.ch-eyebrow{ font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.ch-head h1{
  font-family:var(--serif); font-size:clamp(1.6rem,4.2vw,2.3rem); line-height:1.18; margin:.5rem 0 .55rem; letter-spacing:-.012em;
}
.ch-summary{ color:var(--muted); font-size:.98rem; line-height:1.6; margin:0; }
.ch-meta{ display:flex; flex-wrap:wrap; gap:.4rem .9rem; margin-top:.9rem; font-size:.76rem; color:var(--muted); align-items:center; }
.ch-meta .chip{ display:inline-flex; align-items:center; gap:.3rem; background:var(--surface-2); padding:.25rem .55rem; border-radius:999px; }
.ch-meta .chip.done{ background:var(--ok-soft); color:var(--ok); font-weight:600; }
hr.rule{ border:none; border-top:1px solid var(--rule); margin:1.8rem 0; }

.prose{ font-family:var(--reader-font); font-size:var(--reader-size); line-height:var(--reader-leading); }
.prose p{ margin:0 0 1.15em; }
.prose h2{ font-size:1.15em; margin:1.8em 0 .6em; font-weight:650; }
.prose strong{ font-weight:680; }
.prose ul,.prose ol{ margin:0 0 1.15em; padding-left:1.4em; }
.prose li{ margin:0 0 .5em; }
.prose li::marker{ color:var(--accent); }
.prose code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88em; background:var(--surface-2); padding:.1em .3em; border-radius:4px; }
.prose ::selection{ background:var(--mark); color:var(--text); }
.hl{
  background:var(--mark); box-shadow:inset 0 -1px 0 var(--mark-edge); border-radius:3px; cursor:pointer; padding:.05em 0;
}
.hl.has-note{ box-shadow:inset 0 -2px 0 var(--accent); }
.hl:hover{ filter:brightness(.96); }

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); padding:1.1rem 1.2rem;
  margin:1.6rem 0; box-shadow:var(--shadow);
}
.card > h2{
  margin:0 0 .8rem; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  font-weight:700; display:flex; align-items:center; gap:.45rem;
}
.card > h2 svg{ width:.95rem; height:.95rem; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.takeaways{ margin:0; padding:0; list-style:none; display:grid; gap:.6rem; }
.takeaways li{ display:flex; gap:.6rem; font-size:.92rem; line-height:1.55; }
.takeaways li::before{
  content:""; width:.42rem; height:.42rem; border-radius:50%; background:var(--accent); flex:0 0 auto; margin-top:.55rem;
}
.case-study{ margin:0; font-size:.92rem; line-height:1.6; color:var(--text); font-style:italic; }

/* action step */
.action-row{ display:flex; gap:.7rem; align-items:flex-start; }
.check{
  width:1.35rem; height:1.35rem; flex:0 0 auto; border-radius:7px; border:1.8px solid var(--rule);
  background:var(--bg); display:grid; place-items:center; margin-top:.05rem; transition:background .15s, border-color .15s;
}
.check[aria-pressed="true"]{ background:var(--ok); border-color:var(--ok); }
.check svg{ width:.85rem; height:.85rem; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
.check[aria-pressed="true"] svg{ opacity:1; }
.action-text{ font-size:.94rem; line-height:1.55; }
.action-row.done .action-text{ color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px; }
textarea.note{
  width:100%; margin-top:.8rem; min-height:4.5rem; resize:vertical; padding:.6rem .7rem; border-radius:10px;
  border:1px solid var(--rule); background:var(--bg); font-size:.88rem; line-height:1.55; font-family:var(--sans);
}
textarea.note::placeholder{ color:var(--muted); }
.saved-flag{ font-size:.7rem; color:var(--ok); opacity:0; transition:opacity .3s; margin-left:auto; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.saved-flag.show{ opacity:1; }

/* quiz */
.q{ margin:0 0 1.3rem; }
.q:last-of-type{ margin-bottom:1rem; }
.q-prompt{ font-size:.94rem; font-weight:600; line-height:1.5; margin:0 0 .6rem; display:flex; gap:.5rem; }
.q-prompt .qn{ color:var(--muted); font-weight:600; flex:0 0 auto; font-variant-numeric:tabular-nums; }
.choices{ display:grid; gap:.4rem; }
.choice{
  display:flex; gap:.6rem; align-items:flex-start; padding:.55rem .7rem; border-radius:10px; border:1px solid var(--rule);
  background:var(--bg); font-size:.9rem; line-height:1.45; text-align:left; width:100%; transition:border-color .15s, background .15s;
}
.choice:hover:not([disabled]){ border-color:var(--accent); }
.choice .box{
  width:1.15rem; height:1.15rem; border-radius:50%; border:1.7px solid var(--rule); flex:0 0 auto; margin-top:.1rem;
  display:grid; place-items:center; font-size:.65rem; font-weight:700; color:var(--muted);
}
.choice.selected{ border-color:var(--accent); background:var(--accent-soft); }
.choice.selected .box{ border-color:var(--accent); color:var(--accent); }
.choice.correct{ border-color:var(--ok); background:var(--ok-soft); }
.choice.correct .box{ border-color:var(--ok); background:var(--ok); color:#fff; }
.choice.wrong{ border-color:var(--bad); background:var(--bad-soft); }
.choice.wrong .box{ border-color:var(--bad); background:var(--bad); color:#fff; }
.choice[disabled]{ cursor:default; }
.quiz-foot{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; padding-top:.4rem; border-top:1px solid var(--rule); margin-top:.2rem; }
.score{ font-size:.85rem; font-weight:600; }
.score.pass{ color:var(--ok); }
.score.fail{ color:var(--bad); }

/* footer nav */
.ch-foot{ display:flex; flex-direction:column; gap:1rem; margin-top:2.2rem; }
.complete-row{
  display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; padding:1rem 1.1rem; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--rule);
}
.complete-row.done{ background:var(--ok-soft); border-color:transparent; }
.complete-label{ font-size:.9rem; font-weight:600; }
.complete-row.done .complete-label{ color:var(--ok); }
.nav-row{ display:flex; gap:.7rem; }
.navbtn{
  flex:1 1 0; display:flex; flex-direction:column; gap:.2rem; padding:.8rem 1rem; border-radius:var(--radius);
  border:1px solid var(--rule); background:var(--surface); text-align:left; min-width:0; transition:border-color .15s;
}
.navbtn:hover{ border-color:var(--accent); }
.navbtn.next{ text-align:right; align-items:flex-end; }
.navbtn span{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.navbtn b{ font-size:.85rem; font-weight:600; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.navbtn[disabled]{ opacity:.4; cursor:not-allowed; border-color:var(--rule); }

/* ---------- Right panel (notes / settings) ---------- */
#panel{
  width:21rem; flex:0 0 21rem; background:var(--surface); border-left:1px solid var(--rule);
  display:flex; flex-direction:column; min-height:0;
}
#panel[hidden]{ display:none; }
.panel-head{ display:flex; align-items:center; gap:.4rem; padding:.6rem .5rem .6rem .9rem; border-bottom:1px solid var(--rule); }
.panel-head h2{ margin:0; font-size:.9rem; font-weight:650; margin-right:auto; }
.panel-body{ overflow-y:auto; padding:.9rem; flex:1 1 auto; overscroll-behavior:contain; }
.panel-body::-webkit-scrollbar{ width:9px; }
.panel-body::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:9px; }

.field{ margin-bottom:1.2rem; }
.field > label{ display:block; font-size:.73rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:.45rem; }
.seg{ display:flex; gap:.3rem; background:var(--surface-2); padding:.25rem; border-radius:10px; }
.seg button{
  flex:1 1 0; padding:.42rem .3rem; border-radius:8px; font-size:.79rem; font-weight:600; color:var(--muted); white-space:nowrap;
}
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
.stepper{ display:flex; align-items:center; gap:.5rem; }
.stepper output{ font-size:.82rem; font-variant-numeric:tabular-nums; min-width:3.2rem; text-align:center; color:var(--muted); }
.stepper .iconbtn{ border:1px solid var(--rule); }

.note-item{
  border:1px solid var(--rule); border-radius:12px; padding:.7rem .8rem; margin-bottom:.7rem; background:var(--bg);
}
.note-item .ni-ch{
  font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); font-weight:700;
  display:block; margin-bottom:.35rem; text-align:left; width:100%;
}
.note-item .ni-ch:hover{ text-decoration:underline; }
.note-item blockquote{
  margin:0 0 .5rem; padding-left:.6rem; border-left:3px solid var(--mark-edge); font-family:var(--serif);
  font-size:.88rem; line-height:1.55;
}
.note-item .ni-note{ font-size:.82rem; color:var(--muted); line-height:1.5; white-space:pre-wrap; margin:0 0 .5rem; }
.note-item .ni-actions{ display:flex; gap:.4rem; }
.linkbtn{ font-size:.75rem; color:var(--muted); font-weight:600; padding:.15rem .3rem; border-radius:6px; }
.linkbtn:hover{ color:var(--accent); background:var(--surface-2); }
.linkbtn.danger:hover{ color:var(--bad); }
.panel-empty{ text-align:center; color:var(--muted); font-size:.85rem; line-height:1.6; padding:2rem 1rem; }
.panel-empty svg{ width:2rem; height:2rem; stroke:var(--rule); fill:none; stroke-width:1.5; margin-bottom:.6rem; }

/* ---------- Selection popover ---------- */
#selpop{
  position:fixed; z-index:60; display:none; gap:.15rem; padding:.25rem; background:var(--surface);
  border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow);
}
#selpop.show{ display:flex; }
#selpop button{ display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; border-radius:7px; font-size:.78rem; font-weight:600; }
#selpop button:hover{ background:var(--surface-2); }
#selpop svg{ width:.9rem; height:.9rem; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- Dialog ---------- */
.backdrop{ position:fixed; inset:0; background:rgba(20,16,10,.45); z-index:80; display:none; }
.backdrop.show{ display:block; }
.modal{
  position:fixed; z-index:81; left:50%; top:50%; transform:translate(-50%,-50%); width:min(28rem,calc(100vw - 2rem));
  background:var(--surface); border:1px solid var(--rule); border-radius:16px; box-shadow:var(--shadow); padding:1.2rem; display:none;
}
.modal.show{ display:block; }
.modal h2{ margin:0 0 .3rem; font-size:1rem; }
.modal p{ margin:0 0 .9rem; font-size:.85rem; color:var(--muted); line-height:1.55; }
.modal blockquote{
  margin:0 0 .8rem; padding-left:.7rem; border-left:3px solid var(--mark-edge); font-family:var(--serif); font-size:.9rem;
  line-height:1.55; max-height:7rem; overflow:auto;
}
.modal textarea{ width:100%; min-height:6rem; }
.modal-actions{ display:flex; gap:.5rem; justify-content:flex-end; margin-top:.9rem; flex-wrap:wrap; }
.modal-actions .spacer{ margin-right:auto; }

/* ---------- Toast ---------- */
#toast{
  position:fixed; bottom:1.2rem; left:50%; transform:translate(-50%,1rem); background:var(--text); color:var(--bg);
  padding:.6rem 1rem; border-radius:999px; font-size:.83rem; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s; z-index:90; box-shadow:var(--shadow);
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- Responsive ---------- */
.scrim{ position:fixed; inset:0; background:rgba(20,16,10,.4); z-index:29; display:none; }
@media (max-width:1180px){
  #panel{ position:fixed; right:0; top:0; bottom:0; z-index:35; box-shadow:var(--shadow); width:min(21rem,88vw); flex-basis:auto; }
  #panel:not([hidden]) ~ .scrim, .scrim.show{ display:block; }
}
@media (max-width:900px){
  #sidebar{ position:fixed; left:0; top:0; bottom:0; z-index:35; box-shadow:var(--shadow); width:min(19.5rem,86vw); flex-basis:auto; }
  .reader{ padding:1.8rem 1.15rem 5rem; }
  .brand-sub{ display:none; }
  .cover{ padding:1.2rem 1rem 4rem; }
}
@media (max-width:560px){
  .progress-pill span.pl{ display:none; }
  .nav-row{ flex-direction:column; }
  .navbtn.next{ text-align:left; align-items:flex-start; }
}

/* ---------- Print ---------- */
@media print{
  body{ overflow:visible; background:#fff; color:#000; }
  #sidebar,#panel,.topbar,#selpop,#toast,.scrim,.ch-foot,.quiz-foot,.check,.saved-flag{ display:none !important; }
  #app,#main{ display:block; height:auto; overflow:visible; }
  .reader,.cover{ max-width:none; padding:0; }
  .card{ box-shadow:none; break-inside:avoid; border-color:#ccc; }
  .prose{ font-size:11pt; }
}
</style>

const BOOK = {"title":"The AI Income Blueprint","subtitle":"How Non-Tech Professionals Are Earning $1,000–$5,000 Per Month With Simple AI Tools","description":"A 17-lesson course adapted from Hassan Mohammed's book The AI Income Blueprint. You'll move through five parts — Mindset, The Toolkit, The Income Streams, The Launch Plan, and Scaling & Sustainability — learning the exact frameworks, tools, and step-by-step plans non-technical professionals are using to build real AI-powered income.","author":"Hassan Mohammed","parts":[{"slug":"part-1-mindset","title":"Part One: Mindset","description":"Before the tools and the tactics, the book tackles the beliefs that keep capable people from starting.","chapters":[{"slug":"ch1-not-behind-right-on-time","number":1,"title":"Chapter 1: You Are Not Behind — You Are Right On Time","shortTitle":"You Are Not Behind — You Are Right On Time","partTitle":"Part One: Mindset","summary":"Why the fear of having 'missed the wave' on AI is misplaced, and how ordinary professionals are already earning with it.","body":"Chapter 1 opens with the case of **Sandra Mensah**, a non-technical professional who started earning with AI tools despite feeling like she'd \"missed the boat.\" Her story sets up the chapter's central argument: most people equate the AI opportunity with a closing window, when in fact adoption is still early relative to where it's headed.\n\nThe chapter names the **\"Myth of the Tech Person\"** — the false belief that you need a technical or programming background to earn money with AI. It argues the opposite: the people best positioned to profit from AI are often *subject-matter experts* who know a specific industry, workflow, or audience, and who can point AI tools at that expertise.\n\nIt introduces the **AI Leverage Loop** — a repeating cycle where a person uses AI to produce more output, uses that output to earn or learn faster, and reinvests the gains into sharper use of the tools, compounding their advantage over time.\n\nThe chapter also names the **Preparation Trap**: the tendency to keep \"getting ready\" — more courses, more research, more tool comparisons — instead of shipping a first paid offer. A short case study of **Marcus Thompson** illustrates someone who escaped the trap by taking action on an imperfect first offer rather than waiting to feel fully ready.\n\n**Mindset Shift #1** frames the shift as moving from \"I need to catch up\" to \"I am early enough to build a real advantage right now.\"","minutes":12,"takeaways":["You don't need a coding background — subject-matter expertise plus AI tools is a legitimate income path.","The AI Leverage Loop: use AI to produce more → earn/learn faster → reinvest into sharper tool use.","The Preparation Trap keeps people endlessly researching instead of shipping a first paid offer.","Being 'early' is a mindset choice, not a fact about the calendar."],"caseStudy":"Sandra Mensah, who worried she'd missed the AI wave, and Marcus Thompson, who escaped the Preparation Trap by shipping an imperfect first offer.","actionStep":"Write your own 'AI Income Declaration' — a short, specific statement of what you intend to build and by when.","quiz":[{"prompt":"What does Chapter 1 call the false belief that you need to be technical to profit from AI?","choices":["The Coding Requirement","The Myth of the Tech Person","The Programmer's Paradox","The Developer Trap"],"answer":1},{"prompt":"What is the 'Preparation Trap'?","choices":["Spending money on AI tools you don't need","Endlessly researching and preparing instead of shipping a first paid offer","Preparing a portfolio before applying for jobs","Over-automating a workflow before testing it"],"answer":1},{"prompt":"The AI Leverage Loop describes a cycle of:","choices":["Learning to code, then teaching others to code","Producing more with AI, earning/learning faster, and reinvesting into sharper tool use","Buying tools, cancelling them, then buying new ones","Outsourcing work, then automating the outsourcing"],"answer":1}]},{"slug":"ch2-five-lies","number":2,"title":"Chapter 2: The 5 Lies Keeping You Broke and Confused","shortTitle":"The 5 Lies Keeping You Broke and Confused","partTitle":"Part One: Mindset","summary":"Five specific, disempowering beliefs about AI income — named and dismantled one by one.","body":"Chapter 2 identifies five specific lies that stop capable people from starting an AI-powered income stream:\n\n1. **The coding requirement lie** — that you must be able to program to use AI professionally.\n2. **The replacement fear** — the belief that AI will make your skills worthless, rather than amplify them.\n3. **The saturation myth** — the idea that \"everyone is already doing this\" and the opportunity is gone.\n4. **The audience requirement** — the assumption you need an existing following before you can earn.\n5. **The cost/complexity lie** — that profiting from AI requires expensive tools or complicated technical setups.\n\nFor each lie, the chapter pairs the false belief with a more accurate reframe, grounded in the reality that most paying clients care about outcomes, not your tool stack or follower count.\n\nThe chapter includes a **Belief Audit** exercise: readers list which of the five lies they personally hold most strongly, rate how much each one is currently costing them, and write a one-sentence counter-belief to replace it.\n\n**Mindset Shift #2** reframes the work ahead: your job isn't to become a technologist — it's to become someone who reliably turns AI output into a result a client or customer will pay for.","minutes":12,"takeaways":["The 5 lies: coding requirement, replacement fear, saturation myth, audience requirement, cost/complexity.","Clients pay for outcomes, not your tool stack or your follower count.","Saturation is a myth at the level of 'AI users' — it is not a myth at the level of a specific, well-served niche.","You do not need an existing audience to land your first paying client."],"caseStudy":null,"actionStep":"Complete the Belief Audit: identify your strongest limiting belief among the 5 lies and write a one-sentence counter-belief.","quiz":[{"prompt":"Which of these is NOT one of the '5 Lies' in Chapter 2?","choices":["The replacement fear","The saturation myth","The audience requirement","The certification requirement"],"answer":3},{"prompt":"According to the chapter, what do most paying clients actually care about?","choices":["Which AI tools you use","How many followers you have","Outcomes and results","Your formal credentials"],"answer":2}]},{"slug":"ch3-ai-income-mindset-framework","number":3,"title":"Chapter 3: The AI Income Mindset Framework","shortTitle":"The AI Income Mindset Framework","partTitle":"Part One: Mindset","summary":"The 3P Framework (Position → Produce → Profit), a skills inventory, and the concept of the Hybrid Professional.","body":"Chapter 3 introduces the book's core strategic framework: **Position → Produce → Profit (the 3P Framework)**.\n\n- **Position** — get clear on the specific niche, audience, and problem you're best suited to serve, using your existing knowledge plus AI leverage.\n- **Produce** — use AI tools to create the deliverables, content, or services that solve that problem, faster and at higher quality than you could unaided.\n- **Profit** — package and price that output into an offer someone will actually pay for.\n\nTo find a Position, the chapter walks through a **Skills Inventory** across four categories: professional/career skills, hobbies and personal interests, life experience (including things like parenting, caregiving, or managing a household budget), and \"boring\" institutional knowledge (compliance, admin, scheduling, local business operations).\n\nThe **Skills Amplifier** exercise has readers cross their existing skills against AI capabilities to find where the two multiply each other — for example, someone with bookkeeping experience amplified by AI-assisted automation tools becomes able to serve far more small-business clients per month than they could manually.\n\nThe chapter names the **Hybrid Professional** as the winning identity: not \"AI expert,\" but a domain expert who has fused their real-world experience with AI leverage. A table of \"boring\" niches (local services, professional trades, admin-heavy industries) makes the point that unglamorous, overlooked niches are often the least saturated and most profitable.\n\n**Mindset Shift #3** and the chapter's Action Step ask readers to draft a **Position Statement** — a specific sentence naming who they serve, what problem they solve, and how AI helps them solve it better or faster.","minutes":15,"takeaways":["The 3P Framework: Position (who/what) → Produce (use AI to create) → Profit (package and price).","Skills Inventory has four categories: professional skills, hobbies/interests, life experience, 'boring' institutional knowledge.","The Skills Amplifier exercise finds where your existing skills and AI capabilities multiply each other.","'Boring,' unglamorous niches are often the least saturated and most profitable.","The winning identity is the 'Hybrid Professional': a domain expert fused with AI leverage — not a generic 'AI expert.'"],"caseStudy":null,"actionStep":"Write your Position Statement: who you serve, what problem you solve, and how AI helps you solve it better or faster.","quiz":[{"prompt":"What are the three stages of the 3P Framework, in order?","choices":["Plan → Prototype → Publish","Position → Produce → Profit","Prepare → Practice → Profit","Pitch → Produce → Promote"],"answer":1},{"prompt":"What does the chapter call the ideal identity for someone monetizing AI skills?","choices":["The AI Specialist","The Prompt Engineer","The Hybrid Professional","The Tech Generalist"],"answer":2},{"prompt":"According to the chapter, 'boring' niches tend to be:","choices":["Oversaturated and low-margin","The least saturated and often the most profitable","Impossible to serve with AI tools","Only viable for large agencies"],"answer":1}]}]},{"slug":"part-2-toolkit","title":"Part Two: The Toolkit","description":"A curated, deliberately small set of tools, plus the single most important skill for using them well: prompting.","chapters":[{"slug":"ch4-only-ai-tools-you-need","number":4,"title":"Chapter 4: The Only AI Tools You Need (And the Ones to Ignore)","shortTitle":"The Only AI Tools You Need (And the Ones to Ignore)","partTitle":"Part Two: The Toolkit","summary":"A tiered tool list — the Core Four, the Income Boosters, and the tools to deliberately ignore for now.","body":"Chapter 4 pushes back on \"tool overwhelm\" by organizing the AI landscape into three deliberate tiers.\n\n**Tier 1 — The Core Four**: a small, non-negotiable starter stack — ChatGPT and Claude (general-purpose reasoning and writing), Canva AI (design), and Midjourney or Adobe Firefly (image generation) — with Notion AI and Gemini mentioned as optional additions depending on workflow.\n\n**Tier 2 — Income Boosters**: tools worth adding once you have a working income stream and a specific bottleneck to solve — Jasper (marketing copy at scale), ElevenLabs (AI voice), Descript (audio/video editing), and Zapier AI (automation).\n\n**Tier 3 — Ignore for now**: tools that are trendy, technically impressive, or frequently recommended online, but that add complexity without adding income for a beginner — the chapter argues these should be avoided until a specific, proven need for them appears.\n\nThe chapter gives an **upgrade decision framework**: only add a new tool when an existing bottleneck is costing you time or money that the tool would clearly resolve — never \"because it's new.\"\n\nA **starter setup checklist** walks through getting the Core Four tools installed and configured in under an hour, and the chapter closes with three common tool mistakes: tool-hopping instead of mastering one tool, subscribing to tools before validating you need them, and choosing tools based on hype rather than the specific task at hand.\n\n**Mindset Shift #4**: fewer tools, used deeply, beat many tools used shallowly.","minutes":14,"takeaways":["Tier 1 Core Four: ChatGPT, Claude, Canva AI, and Midjourney/Firefly (Notion AI, Gemini optional).","Tier 2 Income Boosters: Jasper, ElevenLabs, Descript, Zapier AI — add only once you hit a real bottleneck.","Tier 3: deliberately ignore trendy tools until you have a proven, specific need.","Upgrade decision rule: add a tool only when it clearly resolves a bottleneck costing you time or money.","The 3 common tool mistakes: tool-hopping, subscribing before validating, and choosing tools by hype."],"caseStudy":null,"actionStep":"Complete the starter setup checklist: install and configure the Core Four tools.","quiz":[{"prompt":"Which four tools make up the book's 'Core Four' (Tier 1)?","choices":["Jasper, ElevenLabs, Descript, Zapier AI","ChatGPT, Claude, Canva AI, and Midjourney/Firefly","Notion AI, Gemini, Zapier, Descript","ChatGPT, Jasper, Firefly, Zapier AI"],"answer":1},{"prompt":"According to the chapter's upgrade decision framework, when should you add a new tool?","choices":["As soon as it's released","When it's trending on social media","Only when it clearly resolves a specific, proven bottleneck","Whenever a competitor uses it"],"answer":2}]},{"slug":"ch5-art-of-the-prompt","number":5,"title":"Chapter 5: The Art of the Prompt — How to Get Extraordinary Output","shortTitle":"The Art of the Prompt — How to Get Extraordinary Output","partTitle":"Part Two: The Toolkit","summary":"The CLEAR Formula, the 3-Pass Method, and a library of 50 starter prompt templates.","body":"Chapter 5 is the book's most tactical chapter on the single highest-leverage skill in the toolkit: prompting.\n\nIt introduces the **CLEAR Formula**, a five-part structure for any high-quality prompt:\n- **C — Context**: background the model needs (who you are, the situation, constraints).\n- **L — Length**: how long the output should be.\n- **E — Examples**: sample input/output or reference material to anchor tone and format.\n- **A — Audience**: who the output is ultimately for.\n- **R — Role**: what persona or expertise you want the model to adopt.\n\nThe chapter walks through a fully assembled CLEAR prompt and shows five before/after comparisons across different tasks (an email, a social caption, a product description, a client proposal, a blog outline), demonstrating how a vague one-line request produces generic output while a CLEAR-structured prompt produces something close to publish-ready.\n\nIt then introduces the **3-Pass Method** for refining output instead of accepting the first draft:\n1. **Draft pass** — generate the initial version.\n2. **Accuracy/Depth pass** — check facts, add missing detail, correct errors.\n3. **Voice/Polish pass** — rewrite for tone, style, and the specific audience.\n\nThe chapter recommends building a **Prompt Library** — a personal, organized archive of prompts that worked, tagged by task type, so you never start from a blank page. It includes **50 starter prompt templates** across five sections (also reproduced in Appendix B), and closes with five common prompting mistakes: being too vague, over-stuffing a single prompt with unrelated requests, skipping the Audience component, accepting the first draft without a Depth or Polish pass, and never saving prompts that worked.\n\n**Mindset Shift #5**: prompting is a skill you build through iteration, not a trick you either know or don't.","minutes":18,"takeaways":["The CLEAR Formula: Context, Length, Examples, Audience, Role.","The 3-Pass Method: Draft → Accuracy/Depth → Voice/Polish — never stop at the first draft.","Build a personal Prompt Library so you never start from a blank page.","50 starter prompt templates are provided across five categories (see Appendix B).","Common mistakes: vagueness, stuffing unrelated requests into one prompt, skipping Audience, and not saving working prompts."],"caseStudy":null,"actionStep":"Take one real task you need done this week and write a full CLEAR-structured prompt for it, then run it through all 3 passes.","quiz":[{"prompt":"What does the 'A' in the CLEAR Formula stand for?","choices":["Accuracy","Audience","Assumptions","Automation"],"answer":1},{"prompt":"What are the three passes in the 3-Pass Method, in order?","choices":["Draft → Accuracy/Depth → Voice/Polish","Outline → Draft → Publish","Research → Write → Edit","Context → Content → Conversion"],"answer":0},{"prompt":"What is a 'Prompt Library' as described in the chapter?","choices":["A paid database of prompts sold online","A personal, organized archive of prompts that worked, tagged by task","A built-in ChatGPT feature","A community forum for sharing prompts"],"answer":1}]}]},{"slug":"part-3-income-streams","title":"Part Three: The Income Streams","description":"Seven fully-scoped income streams, each with positioning, pricing, workflow, and a real case study.","chapters":[{"slug":"ch6-freelance-writing-content","number":6,"title":"Chapter 6: AI-Assisted Freelance Writing & Content Creation","shortTitle":"AI-Assisted Freelance Writing & Content Creation","partTitle":"Part Three: The Income Streams","summary":"Using AI to deliver freelance writing and content services faster and at higher margin.","body":"Chapter 6 opens Part Three's stream-by-stream breakdown, each following the same consistent structure: a snapshot table, what the stream is and why it works, who it's best suited for, a menu of sellable services, positioning advice, a table of platforms to find clients on, a pricing framework, a production workflow, red flags to avoid, an earnings table, scripts for handling common client objections, a case study, a Mindset Shift, an Action Step, and a chapter summary.\n\nFor freelance writing, AI is positioned as a force multiplier for research, first drafts, and editing — not a replacement for a writer's judgment, voice, or client relationship. The services menu spans blog posts, email sequences, website copy, case studies, and ghostwriting, with the CLEAR Formula and 3-Pass Method from Chapter 5 applied directly to production.\n\nThe case study follows **Priya Nair**, who used AI-assisted workflows to increase both her writing throughput and her effective hourly rate without lowering quality.","minutes":16,"takeaways":["AI acts as a force multiplier for research, drafting, and editing — not a replacement for a writer's judgment or voice.","Every income-stream chapter follows the same structure: services menu, platforms, pricing, workflow, red flags, case study.","Applying the CLEAR Formula and 3-Pass Method directly increases both throughput and effective hourly rate."],"caseStudy":"Priya Nair, who increased her freelance writing throughput and effective hourly rate using AI-assisted drafting and editing.","actionStep":"Pick one writing service from the chapter's menu and draft a one-paragraph service description you could post today.","quiz":[{"prompt":"In Chapter 6, AI is positioned as:","choices":["A replacement for a writer's judgment and voice","A force multiplier for research, drafting, and editing","Only useful for grammar checking","Unsuitable for professional freelance writing"],"answer":1}]},{"slug":"ch7-selling-ai-digital-products","number":7,"title":"Chapter 7: Selling AI-Generated Digital Products","shortTitle":"Selling AI-Generated Digital Products","partTitle":"Part Three: The Income Streams","summary":"Eight product types, a 3-criteria test for winning products, and a 30-minute validation method.","body":"Chapter 7 covers building and selling digital products created with AI assistance — templates, guides, planners, courses, and similar formats across eight product types identified in the chapter.\n\nIt gives **3 Criteria** for judging whether a product idea is worth building: it solves a specific, recurring problem; the target buyer is easy to reach; and it can be produced quickly enough with AI tools to test before investing significant time.\n\nThe **30-Minute Validation Method** has readers test demand for a product idea in half an hour — using quick searches, community posts, or direct outreach — before committing to full production. This is followed by an **8-step creation workflow** taking an idea from concept through AI-assisted drafting, design, and launch.\n\nThe case study follows **Denise Okafor**, who used the validation method to avoid building an unwanted product and pivoted to one with confirmed demand.","minutes":16,"takeaways":["8 digital product types are covered as viable formats.","3 Criteria for a winning product: solves a specific recurring problem, easy-to-reach buyer, fast-enough to produce and test.","The 30-Minute Validation Method tests demand before you invest real production time.","An 8-step workflow takes a validated idea from concept to launch."],"caseStudy":"Denise Okafor, who used the 30-Minute Validation Method to avoid building an unwanted product and pivoted to one with confirmed demand.","actionStep":"Run the 30-Minute Validation Method on one digital product idea before building anything.","quiz":[{"prompt":"What is the purpose of the 30-Minute Validation Method?","choices":["To design a product's cover art quickly","To test demand for a product idea before investing real production time","To write 30 minutes of ad copy","To speed-run customer support responses"],"answer":1}]},{"slug":"ch8-ai-social-media-management","number":8,"title":"Chapter 8: AI-Powered Social Media Management","shortTitle":"AI-Powered Social Media Management","partTitle":"Part Three: The Income Streams","summary":"Platform-by-platform playbooks and a production workflow for running social media services with AI.","body":"Chapter 8 breaks down running a social media management service accelerated by AI tools, with platform-specific deep-dives covering Instagram, LinkedIn, Facebook, Google Business Profile, and TikTok/Shorts — including format norms and posting cadence for each.\n\nA production workflow shows how to batch-plan, draft, and schedule a month of content using AI for captions, hooks, and repurposing, and the chapter lays out service packages (e.g., a base posting package vs. a full-management package with strategy and community response) that can be sold to local businesses and small brands.\n\nThe case study follows **Jerome Williams**, who packaged this stream into a recurring monthly service for small business clients.","minutes":16,"takeaways":["Platform playbooks cover Instagram, LinkedIn, Facebook, Google Business Profile, and TikTok/Shorts.","A batching workflow lets you plan, draft, and schedule a month of content in a fraction of the usual time.","Service packages typically range from a base posting tier to a full-management tier with strategy included."],"caseStudy":"Jerome Williams, who packaged AI-accelerated social media management into a recurring monthly service.","actionStep":null,"quiz":[{"prompt":"Which of these platforms does Chapter 8 NOT specifically deep-dive?","choices":["Instagram","LinkedIn","Pinterest","TikTok/Shorts"],"answer":2}]},{"slug":"ch9-ai-automation-local-businesses","number":9,"title":"Chapter 9: AI Automation Services for Local Businesses","shortTitle":"AI Automation Services for Local Businesses","partTitle":"Part Three: The Income Streams","summary":"Selling automation built with tools like Zapier and Make, using 10 proven templates and a Business Efficiency Audit.","body":"Chapter 9 covers a higher-ticket service: building automations for local businesses using no-code tools like Zapier and Make. The chapter provides **10 proven automation templates** — recurring, repeatable workflows (such as automated lead follow-up, review requests, appointment reminders, and intake-form routing) that solve common small-business pain points.\n\nThe **Business Efficiency Audit** is the chapter's core sales tool: a structured set of questions a provider asks a prospective client to surface manual, repetitive tasks eating s readers can adapt directly (e.g., a pack for real estate agents, one for coaches, one for small e-commerce sellers).\n\nThe case study follows **Terri Nakamura**, who built a prompt pack business targeting a specific professional niche.","minutes":14,"takeaways":["Prompt packs are curated, tested collections of prompts sold as a standalone digital product.","50 niche ideas are provided to seed pack topics.","6 fully-scoped sample packs are included as adaptable templates."],"caseStudy":"Terri Nakamura, who built a prompt pack business around a specific professional niche.","actionStep":null,"quiz":[{"prompt":"How many fully-scoped sample prompt packs does Chapter 10 provide?","choices":["3","6","10","50"],"answer":1}]},{"slug":"ch11-ai-enhanced-coaching-consulting","number":11,"title":"Chapter 11: AI-Enhanced Coaching & Consulting Services","shortTitle":"AI-Enhanced Coaching & Consulting Services","partTitle":"Part Three: The Income Streams","summary":"Using AI to scale coaching delivery, across 8 niches and 3 programme structures, with outcome-anchored pricing.","body":"Chapter 11 applies the book's framework to coaching and consulting, an income stream built on expertise rather than deliverables. It surveys **8 coaching niches** and **3 programme structures** (e.g., a self-paced track supported by AI-assisted resources, a hybrid group + AI-tools track, and a high-touch 1:1 track), showing how AI tools can support session prep, custom resource generation, and progress tracking without replacing the human relationship at the center of coaching.\n\nPricing is anchored to **outcomes** rather than time — the chapter argues coaches should price around the transformation or result delivered, not hours spent, and shows how AI-assisted efficiency supports higher-margin, outcome-based pricing.\n\nThe case study follows **David Osei**, who restructured his consulting offer around outcome-anchored pricing supported by AI-assisted delivery.","minutes":15,"takeaways":["AI supports coaching delivery (session prep, custom resources, progress tracking) without replacing the human relationship.","8 coaching niches and 3 programme structures are covered.","Pricing should be anchored to outcomes/transformation delivered, not hours spent."],"caseStudy":"David Osei, who restructured his consulting pricing around outcomes rather than hours.","actionStep":null,"quiz":[{"prompt":"What does Chapter 11 recommend anchoring coaching/consulting pricing to?","choices":["Hours spent in session","Number of AI tools used","The outcome or transformation delivered","Competitor pricing alone"],"answer":2}]},{"slug":"ch12-content-at-scale","number":12,"title":"Chapter 12: Content Creation at Scale: YouTube, Newsletters, Blogs","shortTitle":"Content Creation at Scale: YouTube, Newsletters, Blogs","partTitle":"Part Three: The Income Streams","summary":"Building durable, monetizable media properties across three formats, with monetization stacking.","body":"Chapter 12 covers building longer-term media assets — YouTube channels, newsletters, and blogs — accelerated by AI tools for research, scripting, drafting, and repurposing across formats. Each of the three formats gets its own deep-dive covering format-specific production workflows.\n\nThe chapter introduces **monetization stacking**: layering multiple revenue sources (ads, sponsorships, affiliate links, digital products, and services) on top of a single content property, rather than relying on one channel of income.\n\nThe case study follows **Aiko Tanaka**, who used AI-assisted production to grow and monetize a content property across more than one format.","minutes":15,"takeaways":["Three format deep-dives: YouTube, newsletters, and blogs.","AI accelerates research, scripting, drafting, and cross-format repurposing.","Monetization stacking layers multiple revenue sources on a single content property."],"caseStudy":"Aiko Tanaka, who grew and monetized a content property using AI-assisted production.","action ncome Fit Matrix and pick one stream (or combination) to commit to for the next 30 days.","quiz":[{"prompt":"What does the AI Income Fit Matrix score a stream against?","choices":["Only your available budget","Your skills, available time, risk tolerance, and income goals","The number of competitors in that niche","How trendy the stream currently is"],"answer":1}]},{"slug":"ch14-30-day-launch-plan","number":14,"title":"Chapter 14: Your 30-Day AI Income Launch Plan","shortTitle":"Your 30-Day AI Income Launch Plan","partTitle":"Part Four: The Launch Plan","summary":"A full day-by-day plan across four weeks: Foundation, Outreach, Convert, Deliver & Systematise.","body":"Chapter 14 lays out a day-by-day, 30-day launch plan organized into four weekly phases:\n\n- **Week 1 — Foundation**: finalize positioning, set up tools, prepare a portfolio or samples, and define the initial offer.\n- **Week 2 — Outreach**: begin reaching prospective clients or customers directly, using the scripts provided in Appendix C.\n- **Week 3 — Convert**: turn conversations and leads into the first paid engagements.\n- **Week 4 — Deliver & Systematise**: deliver the first paid work at a high standard and begin turning the process into repeatable systems (templates, SOP notes) for the next round of clients.\n\nA **progress tracker** lets readers check off each day's task, and a **troubleshooting table** addresses common stalls (no responses to outreach, freezing on pricing, second-guessing the offer). The chapter closes with adaptations of the 30-day plan for product-based and content-based streams, which follow a different cadence than service-based streams.","minutes":18,"takeaways":["The 30-day plan has four weekly phases: Foundation, Outreach, Convert, Deliver & Systematise.","Week 2 outreach uses the scripts provided in Appendix C.","Week 4 focuses on systematizing delivery, not just completing the first project.","Product- and content-based streams follow adapted versions of the same 30-day nutes":16,"takeaways":["Three growth stages: Hustler → Operator → Owner.","The Value Pricing System prices based on value delivered, not hours worked.","An SOP framework documents repeatable work so it can be delegated.","Growth levers include email list building, hiring a VA, productising services, and moving toward MRR."],"caseStudy":null,"actionStep":null,"quiz":[{"prompt":"What are the three growth stages in Chapter 15?","choices":["Beginner → Intermediate → Expert","Hustler → Operator → Owner","Freelancer → Agency → Enterprise","Solo → Team → Franchise"],"answer":1},{"prompt":"The Value Pricing System prices work based on:","choices":["Hours worked","Competitor rates","The value delivered to the client","The number of AI tools used on the project"],"answer":2}]},{"slug":"ch16-staying-ahead-as-ai-evolves","number":16,"title":"Chapter 16: Staying Ahead as AI Evolves","shortTitle":"Staying Ahead as AI Evolves","partTitle":"Part Five: Scaling & Sustainability","summary":"A 10-minute daily briefing system, five permanently valuable skills, and a framework for evaluating new tools.","body":"Chapter 16 addresses a real risk in an AI-based business: the tools themselves change fast. It proposes a **10-Minute Daily AI Briefing System** — a short, consistent daily habit of scanning curated sources to stay current without falling into constant tool-chasing, backed by a table of recommended information sources.\n\nIt names **5 permanently valuable skills** that remain useful regardless of which specific tools rise or fall: things like client communication, taste/judgment in evaluating AI output, structured problem-solving, positioning, and adaptability itself.\n\nThe chapter also covers building a **personal brand** around a set of core pillars (rather than around any single tool), the importance of **diversification** across income streams and tools, a **tool evaluation framework** for deciding whether a new tool is worth adopting, and a **weekly learning system** for deeper, less time-pressured skill development beyond the daily briefing.\n\n**Mindset Shift #14** reframes constant AI change from a threat into the actual terrain of the opportunity.","minutes":14,"takeaways":["The 10-Minute Daily AI Briefing System keeps you current without constant tool-chasing.","5 permanently valuable skills stay useful no matter which tools change.","Build a personal brand around durable pillars, not around any single AI tool.","Diversify both income streams and tools; use the tool evaluation framework before adopting anything new."],"caseStudy":null,"actionStep":null,"quiz":[{"prompt":"What is the purpose of the 10-Minute Daily AI Briefing System?","choices":["To learn a new tool every day","To stay current on AI developments without constant tool-chasing","To write ten prompts per day","To review client feedback daily"],"answer":1}]},{"slug":"ch17-money-mindset-of-digital-earner","number":17,"title":"Chapter 17: The Money Mindset of a Digital Earner","shortTitle":"The Money Mindset of a Digital Earner","partTitle":"Part Five: Scaling & Sustainability","summary":"The psychological terrain of building income: the Trough of Disillusionment, the 90-Day Rule, and the Two-Goal System.","body":"The book's closing chapter turns to the psychology of sustaining an income built this way. It names the **Trough of Disillusionment** — the predictable dip in motivation after the initial excitement of starting fades and before real traction shows up — and pairs it with the **90-Day Rule**: committing to a minimum 90-day runway before judging whether a stream is working.\n\nIt covers **3 pricing psychology patterns** that cause new earners to underprice their work, an **identity shift exercise** for internalizing \"I am someone who gets paid for this\" rather than treating it as a side experiment, and the **Two-Goal System** — setting both a **Survival Number** (the minimum needed to sustain the effort) and a **Freedom Number** (the number that would represent real financial change) as two distinct, motivating targets.\n\nThe chapter also introduces an **Anti-Comparison Protocol** for handling the discouragement of watching others' visible wins online, a **Celebration Practice** for acknowledging small progress, and a **6-Month Vision Letter** template — a letter to your future self used to anchor motivation through the inevitable slow stretches.\n\n**Mindset Shift #15** closes the book: sustainable income comes from identity change and consistency, not from finding one more perfect tool or tactic.","minutes":15,"takeaways":["The Trough of Disillusionment is the predictable motivation dip after the initial excitement fades.","The 90-Day Rule: commit to a minimum runway before judging whether a stream is working.","The Two-Goal System sets both a Survival Number and a Freedom Number as separate targets.","The Anti-Comparison Protocol and Celebration Practice protect motivation through slow stretches."],"caseStudy":null,"actionStep":"Write your own 6-Month Vision Letter to your future self, and set your Survival Number and Freedom Number.","quiz":[{"prompt":"What is the '90-Day Rule'?","choices":["A 90-day money-back guarantee for clients","Committing to a minimum 90-day runway before judging whether a stream is working","A rule limiting you to 90 days per project","A 90-day free trial period for AI tools"],"answer":1},{"prompt":"In the Two-Goal System, what are the two targets called?","choices":["Minimum Number and Maximum Number","Survival Number and Freedom Number","Base Rate and Stretch Rate","Starter Goal and Stretch Goal"],"answer":1}]}]}]};
const CHAPTERS = BOOK.parts.flatMap(p => p.chapters);
const BY_SLUG = Object.fromEntries(CHAPTERS.map(c => [c.slug, c]));
const TOTAL_MINUTES = CHAPTERS.reduce((n, c) => n + c.minutes, 0);

/* =============================================================
   Persistence
   ============================================================= */
const KEY = "ai-income-blueprint-ebook-v1";
const DEFAULTS = {
  completed: {},      // slug -> true
  quiz: {},           // slug -> { answers:[], checked:bool }
  actions: {},        // slug -> { done:bool, note:string }
  highlights: [],     // { id, slug, start, text, note }
  settings: { theme: null, font: "serif", size: 3, leading: 3, width: 3 },
  last: null,
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULTS);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULTS), ...parsed,
      settings: { ...DEFAULTS.settings, ...(parsed.settings || {}) },
    };
  } catch { return structuredClone(DEFAULTS); }
}
let state = load();

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch { toast("Couldn't save — storage is unavailable"); }
  }, 200);
}

   Small helpers
   ============================================================= */
const $ = sel => document.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function svgIcon(path, cls = "") {
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
}

/* Minimal markdown → HTML. The source uses paragraphs, bullets,
   numbered lists, bold, italics and inline code — nothing else. */
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");

  const BULLET = /^\s*[-*]\s+/, NUMBER = /^\s*\d+[.)]\s+/, HEADING = /^#{2,6}\s+/;
  const out = [];
  let para = [];   // buffered paragraph lines
  let list = null; // { tag, items }

  const flushPara = () => {
    if (!para.length) return;
    out.push(`<p>${inline(para.join(" "))}</p>`);
    para = [];
  };
  const flushList = () => {
    if (!list) return;
    out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`);
    list = null;
  };
  const flush = () => { flushPara(); flushList(); };

  /* Lists often follow a lead-in line with no blank line between, so parse
     line by line rather than treating blank-line blocks as homogeneous. */
  for (const line of src.trim().split("\n")) {
    if (!line.trim()) { flush(); continue; }
    if (HEADING.test(line)) {
      flush();
      out.push(`<h2>${inline(line.replace(HEADING, ""))}</h2>`);
    } else if (BULLET.test(line) || NUMBER.test(line)) {
      const tag = BULLET.test(line) ? "ul" : "ol";
      flushPara();
      if (list && list.tag !== tag) flushList();
      list ??= { tag, items: [] };
      list.items.push(line.replace(BULLET.test(line) ? BULLET : NUMBER, ""));
    } else if (list) {
      list.items[list.items.length - 1] += " " + line.trim(); // wrapped list item
    } else {
      para.push(line.trim());
    }
  }
  flush();
  return out.join("");
}

const doneCount = () => CHAPTERS.filter(c => state.completed[c.slug]).length;

function paintProgress() {
  const pct = Math.round((doneCount() / CHAPTERS.length) * 100);
  $("#pct").textContent = pct + "%";
  const circ = 2 * Math.PI * 10;
  $("#ring-fg").setAttribute("stroke-dasharray", `${(circ * pct) / 100} ${circ}`);
  const bar = $("#cover-bar-fill");
  if (bar) {
    bar.style.width = pct + "%";
    $("#cover-bar-label").textContent =
      pct === 100 ? "Finished — every chapter complete 🎉"
                  : `${doneCount()} of ${CHAPTERS.length} chapters complete`;
  }
}

const SIZES = ["0.95rem", "1.01rem", "1.075rem", "1.16rem", "1.26rem", "1.4rem"];
const LEADINGS = ["1.5", "1.62", "1.75", "1.9", "2.05"];
const WIDTHS = ["34rem", "39rem", "44rem", "50rem", "58rem"];

function applySettings() {
  const s = state.settings;
  const theme = s.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "light");
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.font = s.font;
  const r = document.documentElement.style;
  r.setProperty("--reader-size", SIZES[s.size]);
  r.setProperty("--reader-leading", LEADINGS[s.leading]);
  r.setProperty("--maxw", WIDTHS[s.width]);
}

function renderTOC() {
  const q = $("#search").value.trim();
  const toc = $("#toc");
  toc.textContent = "";
  if (q.length >= 2) return renderSearch(q, toc);

  const cover = el("button", { className: "toc-cover" });
  cover.innerHTML = svgIcon('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/>') + "<span>Cover &amp; overview</span>";
  cover.style.cssText = "align-items:center";
  cover.querySelector("svg").style.cssText = "width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.7";
  cover.onclick = () => go(null);
  toc.append(cover);

  for (const part of BOOK.parts) {
    const done = part.chapters.filter(c => state.completed[c.slug]).length;
    const wrap = el("div", { className: "toc-part" });
    wrap.append(el("div", { className: "toc-part-title" }, [
      el("span", { textContent: part.title }),
      el("span", { className: "toc-part-count", textContent: `${done}/${part.chapters.length}` }),
    ]));
    for (const c of part.chapters) {
      const b = el("button", {
        className: "toc-item" + (state.completed[c.slug] ? " done" : "") + (c.slug === current ? " current" : ""),
      });
      b.setAttribute("aria-current", c.slug === current ? "page" : "false");
      b.append(
        el("span", { className: "dot" }),
        el("span", { className: "num", textContent: c.number }),
        el("span", { textContent: c.shortTitle, style: "min-width:0" }),
        el("span", { className: "toc-min", textContent: c.minutes + "m" }),
      );
      b.onclick = () => go(c.slug);
      wrap.append(b);
    }
    toc.append(wrap);
  }
}

function renderSearch(q, toc) {
  const needle = q.toLowerCase();
  const hits = [];
  for (const c of CHAPTERS) {
    const hay = [c.title, c.summary, c.body, (c.takeaways || []).join(" "), c.caseStudy || "", c.actionStep || ""].join("\n");
    const i = hay.toLowerCase().indexOf(needle);
    if (i === -1) continue;
    const from = Math.max(0, i - 45);
    const snip = (from > 0 ? "…" : "") + hay.slice(from, i + needle.length + 70).replace(/\s+/g, " ") + "…";
    hits.push({ c, snip });
  }
  if (!hits.length) {
    toc.append(el("p", { className: "side-empty", textContent: `No matches for “${q}”.` }));
    return;
  }
  toc.append(el("p", { className: "side-empty", style: "padding:.5rem .6rem", textContent: `${hits.length} chapter${hits.length > 1 ? "s" : ""} match “${q}”` }));
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
  for (const { c, snip } of hits) {
    const b = el("button", { className: "search-result" });
    b.innerHTML = `<span class="sr-title">${esc(c.number)}. ${esc(c.shortTitle)}</span><span class="sr-snip">${esc(snip).replace(re, "<mark>$1</mark>")}</span>`;
    b.onclick = () => go(c.slug);
    toc.append(b);
  }
}

/* =============================================================
   Views
   ============================================================= */
let current = null; // slug or null for cover

function renderCover() {
  const main = $("#main");
  const pct = Math.round((doneCount() / CHAPTERS.length) * 100);
  const resume = state.last && BY_SLUG[state.last] ? BY_SLUG[state.last] : CHAPTERS.find(c => !state.completed[c.slug]);

  primary.onclick = () => go((resume || CHAPTERS[0]).slug);
  actions.append(primary);

  if (resume && (state.last || doneCount())) {
    actions.append(el("span", {
      style: "font-size:.8rem;color:var(--muted)",
      textContent: `${resume.number}. ${resume.shortTitle}`,

  wrap.append(card);

      </div>`;

    grid.append(b);

  wrap.append(grid);

  main.textContent = "";
