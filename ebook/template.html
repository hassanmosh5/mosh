<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Income Blueprint — Interactive Edition</title>
<meta name="description" content="An offline, interactive edition of The AI Income Blueprint: read, highlight, annotate, quiz yourself and track your progress.">
<meta name="color-scheme" content="light dark">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --bg:#faf8f5; --surface:#ffffff; --surface-2:#f4f1ec; --text:#1d1b18; --muted:#6d6862;
  --accent:#b0521c; --accent-soft:#f6e7db; --rule:#e6e1d8; --mark:#ffe9a8; --mark-edge:#e8c25f;
  --ok:#1d7a4c; --ok-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(28,24,18,.05), 0 8px 24px rgba(28,24,18,.06);
  --radius:14px; --maxw:44rem; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --reader-font:var(--serif); --reader-size:1.075rem; --reader-leading:1.75;
}
html[data-theme="sepia"]{
  --bg:#f3e9d6; --surface:#fbf4e4; --surface-2:#eee1c8; --text:#3a3125; --muted:#7b6c55;
  --accent:#8f4a15; --accent-soft:#f0e0c6; --rule:#e0d0b0; --mark:#f7dd97; --mark-edge:#d9b25c;
  --ok:#1c6b45; --ok-soft:#e2eeda; --bad:#a12f22; --bad-soft:#f6e0d8;
  --shadow:0 1px 2px rgba(60,45,20,.06), 0 8px 24px rgba(60,45,20,.07);
}
html[data-theme="night"]{
  --bg:#131519; --surface:#1a1d23; --surface-2:#22262e; --text:#e7e6e3; --muted:#9aa1ab;
  --accent:#f0a468; --accent-soft:#33261c; --rule:#2c313a; --mark:#5c4a1f; --mark-edge:#8c7433;
  --ok:#5fcf9b; --ok-soft:#16301f; --bad:#f08a80; --bad-soft:#331b19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
html[data-font="sans"]{ --reader-font:var(--sans); }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:none; }
a{ color:var(--accent); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }

/* ============================================================
   Shell
   ============================================================ */
#app{ display:flex; flex-direction:column; height:100dvh; }

.topbar{
  display:flex; align-items:center; gap:.5rem; padding:.55rem .75rem;
  background:var(--surface); border-bottom:1px solid var(--rule); position:relative; z-index:40; flex:0 0 auto;
}
.topbar .brand{ display:flex; align-items:center; gap:.55rem; min-width:0; margin-right:auto; }
.brand-mark{
  width:1.9rem; height:1.9rem; border-radius:8px; flex:0 0 auto; display:grid; place-items:center;
  background:linear-gradient(145deg,var(--accent),#7a3410); color:#fff; font-weight:700; font-size:.78rem; letter-spacing:.02em;
}
html[data-theme="night"] .brand-mark{ background:linear-gradient(145deg,#c9743c,#7a3410); color:#fff; }
.brand-text{ min-width:0; }
.brand-title{ font-size:.86rem; font-weight:650; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-sub{ font-size:.7rem; color:var(--muted); line-height:1.2; }

.iconbtn{
  width:2.15rem; height:2.15rem; border-radius:9px; display:grid; place-items:center; color:var(--muted);
  border:1px solid transparent; transition:background .15s, color .15s, border-color .15s;
}
.iconbtn:hover{ background:var(--surface-2); color:var(--text); }
.iconbtn[aria-pressed="true"],.iconbtn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--rule); }
.iconbtn svg{ width:1.15rem; height:1.15rem; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

.progress-pill{
  display:inline-flex; align-items:center; gap:.45rem; padding:.3rem .6rem; border-radius:999px;
  background:var(--surface-2); font-size:.74rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.progress-pill b{ color:var(--text); font-weight:650; }
.ring{ width:1.1rem; height:1.1rem; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:3.2; }
.ring .bg{ stroke:var(--rule); }
.ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .4s ease; }

.scrollprogress{ position:absolute; left:0; bottom:-1px; height:2px; background:var(--accent); width:0; transition:width .1s linear; z-index:41; }

.layout{ flex:1 1 auto; display:flex; min-height:0; position:relative; }

/* ---------- Sidebar ---------- */
#sidebar{
  width:19.5rem; flex:0 0 19.5rem; background:var(--surface); border-right:1px solid var(--rule);
  display:flex; flex-direction:column; min-height:0;
}
#sidebar[hidden]{ display:none; }
.side-head{ padding:.7rem .8rem; border-bottom:1px solid var(--rule); }
.search-wrap{ position:relative; }
.search-wrap svg{ position:absolute; left:.6rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; fill:none; stroke:var(--muted); stroke-width:1.8; }
#search{
  width:100%; padding:.5rem .6rem .5rem 2rem; border-radius:9px; border:1px solid var(--rule);
  background:var(--bg); font-size:.85rem;
}
#search::placeholder{ color:var(--muted); }
.side-scroll{ overflow-y:auto; padding:.5rem .55rem 1.5rem; flex:1 1 auto; overscroll-behavior:contain; }
.side-scroll::-webkit-scrollbar{ width:9px; }
.side-scroll::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:9px; }

.toc-cover{
  display:flex; align-items:center; gap:.5rem; width:100%; text-align:left; padding:.5rem .55rem; border-radius:9px;
  font-size:.83rem; color:var(--muted); font-weight:550;
}
.toc-cover:hover{ background:var(--surface-2); color:var(--text); }
.toc-part{ margin-top:.9rem; }
.toc-part-title{
  font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  padding:.35rem .55rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem;
}
.toc-part-count{ font-weight:600; letter-spacing:0; text-transform:none; opacity:.8; font-variant-numeric:tabular-nums; }
.toc-item{
  display:flex; gap:.55rem; align-items:flex-start; width:100%; text-align:left; padding:.45rem .55rem;
  border-radius:9px; font-size:.83rem; line-height:1.35; color:var(--text); position:relative;
}
.toc-item:hover{ background:var(--surface-2); }
.toc-item.current{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.toc-item .dot{
  width:.95rem; height:.95rem; flex:0 0 auto; margin-top:.12rem; border-radius:50%;
  border:1.6px solid var(--rule); display:grid; place-items:center;
}
.toc-item.done .dot{ background:var(--ok); border-color:var(--ok); }
.toc-item.done .dot::after{ content:""; width:.28rem; height:.5rem; border:solid #fff; border-width:0 1.8px 1.8px 0; transform:rotate(42deg) translate(-.5px,-1px); }
.toc-item .num{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:.75rem; }
.toc-item.current .num{ color:var(--accent); }
.toc-min{ margin-left:auto; font-size:.7rem; color:var(--muted); flex:0 0 auto; padding-left:.3rem; }

.search-result{ display:block; width:100%; text-align:left; padding:.5rem .55rem; border-radius:9px; font-size:.8rem; line-height:1.4; }
.search-result:hover{ background:var(--surface-2); }
.search-result .sr-title{ font-weight:600; display:block; margin-bottom:.15rem; }
.search-result .sr-snip{ color:var(--muted); }
.search-result mark{ background:var(--mark); color:inherit; border-radius:2px; padding:0 .1em; }
.side-empty{ padding:1rem .6rem; font-size:.82rem; color:var(--muted); }

/* ---------- Main ---------- */
#main{ flex:1 1 auto; overflow-y:auto; min-width:0; scroll-behavior:smooth; overscroll-behavior:contain; }
.reader{ max-width:var(--maxw); margin:0 auto; padding:2.5rem 1.5rem 6rem; }

/* ---------- Cover ---------- */
.cover{ max-width:52rem; margin:0 auto; padding:2rem 1.5rem 5rem; }
.cover-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:20px; box-shadow:var(--shadow);
  padding:clamp(1.5rem,4vw,3rem); position:relative; overflow:hidden;
}
.cover-card::before{
  content:""; position:absolute; inset:0 auto 0 0; width:6px;
  background:linear-gradient(180deg,var(--accent),#7a3410);
}
.cover-eyebrow{ font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.cover h1{ font-family:var(--serif); font-size:clamp(1.9rem,5vw,3rem); line-height:1.1; margin:.6rem 0 .5rem; letter-spacing:-.015em; }
.cover .sub{ font-size:1rem; color:var(--muted); line-height:1.55; max-width:38rem; margin:0 0 .35rem; }
.cover .byline{ font-size:.85rem; color:var(--muted); margin:1rem 0 0; }
.cover-stats{ display:flex; flex-wrap:wrap; gap:.5rem; margin:1.4rem 0 1.6rem; }
.stat{ background:var(--surface-2); border-radius:11px; padding:.55rem .8rem; min-width:5.5rem; }
.stat b{ display:block; font-size:1.15rem; line-height:1.2; font-variant-numeric:tabular-nums; }
.stat span{ font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.cover-actions{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
.btn{
  display:inline-flex; align-items:center; gap:.45rem; padding:.6rem 1rem; border-radius:10px;
  background:var(--accent); color:#fff; font-size:.88rem; font-weight:600; border:1px solid transparent;
  transition:filter .15s, transform .05s;
}
html[data-theme="night"] .btn{ color:#1a1207; }
.btn:hover{ filter:brightness(1.07); }
.btn:active{ transform:translateY(1px); }
.btn.ghost{ background:var(--surface-2); color:var(--text); border-color:var(--rule); }
.btn.ghost:hover{ background:var(--rule); filter:none; }
.btn.small{ padding:.4rem .7rem; font-size:.8rem; }
.btn svg{ width:1rem; height:1rem; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

.cover-bar{ height:.4rem; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:1.4rem 0 .5rem; }
.cover-bar i{ display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease; }
.cover-bar-label{ font-size:.76rem; color:var(--muted); }

.parts-grid{ display:grid; gap:.9rem; margin-top:2rem; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); }
.part-card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); padding:1rem 1.1rem; text-align:left;
  display:flex; flex-direction:column; gap:.4rem; transition:border-color .15s, transform .1s, box-shadow .15s; width:100%;
}
.part-card:hover{ border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px); }
.part-card h3{ margin:0; font-size:.95rem; font-family:var(--serif); }
.part-card p{ margin:0; font-size:.82rem; color:var(--muted); line-height:1.5; }
.part-card .meta{ font-size:.72rem; color:var(--muted); display:flex; gap:.5rem; align-items:center; margin-top:.2rem; }
.part-card .meta i{ font-style:normal; color:var(--ok); font-weight:600; }

/* ---------- Chapter ---------- */
.ch-head{ margin-bottom:1.8rem; }
.ch-eyebrow{ font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.ch-head h1{
  font-family:var(--serif); font-size:clamp(1.6rem,4.2vw,2.3rem); line-height:1.18; margin:.5rem 0 .55rem; letter-spacing:-.012em;
}
.ch-summary{ color:var(--muted); font-size:.98rem; line-height:1.6; margin:0; }
.ch-meta{ display:flex; flex-wrap:wrap; gap:.4rem .9rem; margin-top:.9rem; font-size:.76rem; color:var(--muted); align-items:center; }
.ch-meta .chip{ display:inline-flex; align-items:center; gap:.3rem; background:var(--surface-2); padding:.25rem .55rem; border-radius:999px; }
.ch-meta .chip.done{ background:var(--ok-soft); color:var(--ok); font-weight:600; }
hr.rule{ border:none; border-top:1px solid var(--rule); margin:1.8rem 0; }

.prose{ font-family:var(--reader-font); font-size:var(--reader-size); line-height:var(--reader-leading); }
.prose p{ margin:0 0 1.15em; }
.prose h2{ font-size:1.15em; margin:1.8em 0 .6em; font-weight:650; }
.prose strong{ font-weight:680; }
.prose ul,.prose ol{ margin:0 0 1.15em; padding-left:1.4em; }
.prose li{ margin:0 0 .5em; }
.prose li::marker{ color:var(--accent); }
.prose code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88em; background:var(--surface-2); padding:.1em .3em; border-radius:4px; }
.prose ::selection{ background:var(--mark); color:var(--text); }
.hl{
  background:var(--mark); box-shadow:inset 0 -1px 0 var(--mark-edge); border-radius:3px; cursor:pointer; padding:.05em 0;
}
.hl.has-note{ box-shadow:inset 0 -2px 0 var(--accent); }
.hl:hover{ filter:brightness(.96); }

/* ---------- Cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); padding:1.1rem 1.2rem;
  margin:1.6rem 0; box-shadow:var(--shadow);
}
.card > h2{
  margin:0 0 .8rem; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  font-weight:700; display:flex; align-items:center; gap:.45rem;
}
.card > h2 svg{ width:.95rem; height:.95rem; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.takeaways{ margin:0; padding:0; list-style:none; display:grid; gap:.6rem; }
.takeaways li{ display:flex; gap:.6rem; font-size:.92rem; line-height:1.55; }
.takeaways li::before{
  content:""; width:.42rem; height:.42rem; border-radius:50%; background:var(--accent); flex:0 0 auto; margin-top:.55rem;
}
.case-study{ margin:0; font-size:.92rem; line-height:1.6; color:var(--text); font-style:italic; }

/* action step */
.action-row{ display:flex; gap:.7rem; align-items:flex-start; }
.check{
  width:1.35rem; height:1.35rem; flex:0 0 auto; border-radius:7px; border:1.8px solid var(--rule);
  background:var(--bg); display:grid; place-items:center; margin-top:.05rem; transition:background .15s, border-color .15s;
}
.check[aria-pressed="true"]{ background:var(--ok); border-color:var(--ok); }
.check svg{ width:.85rem; height:.85rem; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
.check[aria-pressed="true"] svg{ opacity:1; }
.action-text{ font-size:.94rem; line-height:1.55; }
.action-row.done .action-text{ color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px; }
textarea.note{
  width:100%; margin-top:.8rem; min-height:4.5rem; resize:vertical; padding:.6rem .7rem; border-radius:10px;
  border:1px solid var(--rule); background:var(--bg); font-size:.88rem; line-height:1.55; font-family:var(--sans);
}
textarea.note::placeholder{ color:var(--muted); }
.saved-flag{ font-size:.7rem; color:var(--ok); opacity:0; transition:opacity .3s; margin-left:auto; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.saved-flag.show{ opacity:1; }

/* quiz */
.q{ margin:0 0 1.3rem; }
.q:last-of-type{ margin-bottom:1rem; }
.q-prompt{ font-size:.94rem; font-weight:600; line-height:1.5; margin:0 0 .6rem; display:flex; gap:.5rem; }
.q-prompt .qn{ color:var(--muted); font-weight:600; flex:0 0 auto; font-variant-numeric:tabular-nums; }
.choices{ display:grid; gap:.4rem; }
.choice{
  display:flex; gap:.6rem; align-items:flex-start; padding:.55rem .7rem; border-radius:10px; border:1px solid var(--rule);
  background:var(--bg); font-size:.9rem; line-height:1.45; text-align:left; width:100%; transition:border-color .15s, background .15s;
}
.choice:hover:not([disabled]){ border-color:var(--accent); }
.choice .box{
  width:1.15rem; height:1.15rem; border-radius:50%; border:1.7px solid var(--rule); flex:0 0 auto; margin-top:.1rem;
  display:grid; place-items:center; font-size:.65rem; font-weight:700; color:var(--muted);
}
.choice.selected{ border-color:var(--accent); background:var(--accent-soft); }
.choice.selected .box{ border-color:var(--accent); color:var(--accent); }
.choice.correct{ border-color:var(--ok); background:var(--ok-soft); }
.choice.correct .box{ border-color:var(--ok); background:var(--ok); color:#fff; }
.choice.wrong{ border-color:var(--bad); background:var(--bad-soft); }
.choice.wrong .box{ border-color:var(--bad); background:var(--bad); color:#fff; }
.choice[disabled]{ cursor:default; }
.quiz-foot{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; padding-top:.4rem; border-top:1px solid var(--rule); margin-top:.2rem; }
.score{ font-size:.85rem; font-weight:600; }
.score.pass{ color:var(--ok); }
.score.fail{ color:var(--bad); }

/* footer nav */
.ch-foot{ display:flex; flex-direction:column; gap:1rem; margin-top:2.2rem; }
.complete-row{
  display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; padding:1rem 1.1rem; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--rule);
}
.complete-row.done{ background:var(--ok-soft); border-color:transparent; }
.complete-label{ font-size:.9rem; font-weight:600; }
.complete-row.done .complete-label{ color:var(--ok); }
.nav-row{ display:flex; gap:.7rem; }
.navbtn{
  flex:1 1 0; display:flex; flex-direction:column; gap:.2rem; padding:.8rem 1rem; border-radius:var(--radius);
  border:1px solid var(--rule); background:var(--surface); text-align:left; min-width:0; transition:border-color .15s;
}
.navbtn:hover{ border-color:var(--accent); }
.navbtn.next{ text-align:right; align-items:flex-end; }
.navbtn span{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.navbtn b{ font-size:.85rem; font-weight:600; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.navbtn[disabled]{ opacity:.4; cursor:not-allowed; border-color:var(--rule); }

/* ---------- Right panel (notes / settings) ---------- */
#panel{
  width:21rem; flex:0 0 21rem; background:var(--surface); border-left:1px solid var(--rule);
  display:flex; flex-direction:column; min-height:0;
}
#panel[hidden]{ display:none; }
.panel-head{ display:flex; align-items:center; gap:.4rem; padding:.6rem .5rem .6rem .9rem; border-bottom:1px solid var(--rule); }
.panel-head h2{ margin:0; font-size:.9rem; font-weight:650; margin-right:auto; }
.panel-body{ overflow-y:auto; padding:.9rem; flex:1 1 auto; overscroll-behavior:contain; }
.panel-body::-webkit-scrollbar{ width:9px; }
.panel-body::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:9px; }

.field{ margin-bottom:1.2rem; }
.field > label{ display:block; font-size:.73rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:.45rem; }
.seg{ display:flex; gap:.3rem; background:var(--surface-2); padding:.25rem; border-radius:10px; }
.seg button{
  flex:1 1 0; padding:.42rem .3rem; border-radius:8px; font-size:.79rem; font-weight:600; color:var(--muted); white-space:nowrap;
}
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
.stepper{ display:flex; align-items:center; gap:.5rem; }
.stepper output{ font-size:.82rem; font-variant-numeric:tabular-nums; min-width:3.2rem; text-align:center; color:var(--muted); }
.stepper .iconbtn{ border:1px solid var(--rule); }

.note-item{
  border:1px solid var(--rule); border-radius:12px; padding:.7rem .8rem; margin-bottom:.7rem; background:var(--bg);
}
.note-item .ni-ch{
  font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); font-weight:700;
  display:block; margin-bottom:.35rem; text-align:left; width:100%;
}
.note-item .ni-ch:hover{ text-decoration:underline; }
.note-item blockquote{
  margin:0 0 .5rem; padding-left:.6rem; border-left:3px solid var(--mark-edge); font-family:var(--serif);
  font-size:.88rem; line-height:1.55;
}
.note-item .ni-note{ font-size:.82rem; color:var(--muted); line-height:1.5; white-space:pre-wrap; margin:0 0 .5rem; }
.note-item .ni-actions{ display:flex; gap:.4rem; }
.linkbtn{ font-size:.75rem; color:var(--muted); font-weight:600; padding:.15rem .3rem; border-radius:6px; }
.linkbtn:hover{ color:var(--accent); background:var(--surface-2); }
.linkbtn.danger:hover{ color:var(--bad); }
.panel-empty{ text-align:center; color:var(--muted); font-size:.85rem; line-height:1.6; padding:2rem 1rem; }
.panel-empty svg{ width:2rem; height:2rem; stroke:var(--rule); fill:none; stroke-width:1.5; margin-bottom:.6rem; }

/* ---------- Selection popover ---------- */
#selpop{
  position:fixed; z-index:60; display:none; gap:.15rem; padding:.25rem; background:var(--surface);
  border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow);
}
#selpop.show{ display:flex; }
#selpop button{ display:flex; align-items:center; gap:.35rem; padding:.35rem .55rem; border-radius:7px; font-size:.78rem; font-weight:600; }
#selpop button:hover{ background:var(--surface-2); }
#selpop svg{ width:.9rem; height:.9rem; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- Dialog ---------- */
.backdrop{ position:fixed; inset:0; background:rgba(20,16,10,.45); z-index:80; display:none; }
.backdrop.show{ display:block; }
.modal{
  position:fixed; z-index:81; left:50%; top:50%; transform:translate(-50%,-50%); width:min(28rem,calc(100vw - 2rem));
  background:var(--surface); border:1px solid var(--rule); border-radius:16px; box-shadow:var(--shadow); padding:1.2rem; display:none;
}
.modal.show{ display:block; }
.modal h2{ margin:0 0 .3rem; font-size:1rem; }
.modal p{ margin:0 0 .9rem; font-size:.85rem; color:var(--muted); line-height:1.55; }
.modal blockquote{
  margin:0 0 .8rem; padding-left:.7rem; border-left:3px solid var(--mark-edge); font-family:var(--serif); font-size:.9rem;
  line-height:1.55; max-height:7rem; overflow:auto;
}
.modal textarea{ width:100%; min-height:6rem; }
.modal-actions{ display:flex; gap:.5rem; justify-content:flex-end; margin-top:.9rem; flex-wrap:wrap; }
.modal-actions .spacer{ margin-right:auto; }

/* ---------- Toast ---------- */
#toast{
  position:fixed; bottom:1.2rem; left:50%; transform:translate(-50%,1rem); background:var(--text); color:var(--bg);
  padding:.6rem 1rem; border-radius:999px; font-size:.83rem; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s; z-index:90; box-shadow:var(--shadow);
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

/* ---------- Responsive ---------- */
.scrim{ position:fixed; inset:0; background:rgba(20,16,10,.4); z-index:29; display:none; }
@media (max-width:1180px){
  #panel{ position:fixed; right:0; top:0; bottom:0; z-index:35; box-shadow:var(--shadow); width:min(21rem,88vw); flex-basis:auto; }
  #panel:not([hidden]) ~ .scrim, .scrim.show{ display:block; }
}
@media (max-width:900px){
  #sidebar{ position:fixed; left:0; top:0; bottom:0; z-index:35; box-shadow:var(--shadow); width:min(19.5rem,86vw); flex-basis:auto; }
  .reader{ padding:1.8rem 1.15rem 5rem; }
  .brand-sub{ display:none; }
  .cover{ padding:1.2rem 1rem 4rem; }
}
@media (max-width:560px){
  .progress-pill span.pl{ display:none; }
  .nav-row{ flex-direction:column; }
  .navbtn.next{ text-align:left; align-items:flex-start; }
}

/* ---------- Print ---------- */
@media print{
  body{ overflow:visible; background:#fff; color:#000; }
  #sidebar,#panel,.topbar,#selpop,#toast,.scrim,.ch-foot,.quiz-foot,.check,.saved-flag{ display:none !important; }
  #app,#main{ display:block; height:auto; overflow:visible; }
  .reader,.cover{ max-width:none; padding:0; }
  .card{ box-shadow:none; break-inside:avoid; border-color:#ccc; }
  .prose{ font-size:11pt; }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="iconbtn" id="btn-toc" aria-label="Toggle contents" aria-pressed="true" title="Contents (c)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <button class="brand-mark" id="btn-home" title="Cover" aria-label="Go to cover">AI</button>

    </button>
    <button class="iconbtn" id="btn-settings" aria-label="Reading settings" title="Reading settings (s)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
    </button>
  </header>
  <div class="scrollprogress" id="scrollprogress"></div>

  <div class="layout">
    <aside id="sidebar" aria-label="Table of contents">
      <div class="side-head">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="search" type="search" placeholder="Search the book…  (/)" aria-label="Search the book" autocomplete="off">
        </div>
      </div>

    <main id="main" tabindex="-1"></main>

    <aside id="panel" hidden aria-label="Side panel">
      <div class="panel-head">
        <h2 id="panel-title">Notes &amp; highlights</h2>
        <button class="iconbtn" id="btn-export" title="Export as Markdown" aria-label="Export notes as Markdown">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </button>
        <button class="iconbtn" id="btn-panel-close" aria-label="Close panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="panel-body" id="panel-body"></div>

    <div class="scrim" id="scrim"></div>
  </div>
</div>

<div id="selpop" role="toolbar" aria-label="Selection actions">
  <button id="sel-hl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 16l8.5-8.5a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L9.5 19.5 5 20z"/></svg>Highlight</button>
  <button id="sel-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v9l-4 5H5z"/><path d="M8 9h8M8 12.5h5"/></svg>Note</button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <h2 id="modal-title">Add a note</h2>
  <p id="modal-desc"></p>
  <blockquote id="modal-quote" hidden></blockquote>
  <textarea class="note" id="modal-note" placeholder="Your thoughts on this passage…"></textarea>
  <div class="modal-actions">
    <button class="btn ghost small spacer" id="modal-delete" hidden>Remove highlight</button>
    <button class="btn ghost small" id="modal-cancel">Cancel</button>
    <button class="btn small" id="modal-save">Save</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =============================================================
   Data — generated from prisma/seed-data.ts by ebook/build.mjs
   ============================================================= */
const BOOK = /*__BOOK_DATA__*/null/*__END_BOOK_DATA__*/;
const CHAPTERS = BOOK.parts.flatMap(p => p.chapters);
const BY_SLUG = Object.fromEntries(CHAPTERS.map(c => [c.slug, c]));
const TOTAL_MINUTES = CHAPTERS.reduce((n, c) => n + c.minutes, 0);

/* =============================================================
   Persistence
   ============================================================= */
const KEY = "ai-income-blueprint-ebook-v1";
const DEFAULTS = {
  completed: {},      // slug -> true
  quiz: {},           // slug -> { answers:[], checked:bool }
  actions: {},        // slug -> { done:bool, note:string }
  highlights: [],     // { id, slug, start, text, note }
  settings: { theme: null, font: "serif", size: 3, leading: 3, width: 3 },
  last: null,
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULTS);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULTS), ...parsed,
      settings: { ...DEFAULTS.settings, ...(parsed.settings || {}) },
    };
  } catch { return structuredClone(DEFAULTS); }
}
let state = load();

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch { toast("Couldn't save — storage is unavailable"); }
  }, 200);
}

/* =============================================================
   Small helpers
   ============================================================= */
const $ = sel => document.querySelector(sel);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function svgIcon(path, cls = "") {
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
}

/* Minimal markdown → HTML. The source uses paragraphs, bullets,
   numbered lists, bold, italics and inline code — nothing else. */
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");

  const BULLET = /^\s*[-*]\s+/, NUMBER = /^\s*\d+[.)]\s+/, HEADING = /^#{2,6}\s+/;
  const out = [];
  let para = [];   // buffered paragraph lines
  let list = null; // { tag, items }

  const flushPara = () => {
    if (!para.length) return;
    out.push(`<p>${inline(para.join(" "))}</p>`);
    para = [];
  };
  const flushList = () => {
    if (!list) return;
    out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`);
    list = null;
  };
  const flush = () => { flushPara(); flushList(); };

  /* Lists often follow a lead-in line with no blank line between, so parse
     line by line rather than treating blank-line blocks as homogeneous. */
  for (const line of src.trim().split("\n")) {
    if (!line.trim()) { flush(); continue; }
    if (HEADING.test(line)) {
      flush();
      out.push(`<h2>${inline(line.replace(HEADING, ""))}</h2>`);
    } else if (BULLET.test(line) || NUMBER.test(line)) {
      const tag = BULLET.test(line) ? "ul" : "ol";
      flushPara();
      if (list && list.tag !== tag) flushList();
      list ??= { tag, items: [] };
      list.items.push(line.replace(BULLET.test(line) ? BULLET : NUMBER, ""));
    } else if (list) {
      list.items[list.items.length - 1] += " " + line.trim(); // wrapped list item
    } else {
      para.push(line.trim());
    }
  }
  flush();
  return out.join("");
}

/* =============================================================
   Progress
   ============================================================= */
const doneCount = () => CHAPTERS.filter(c => state.completed[c.slug]).length;

function paintProgress() {
  const pct = Math.round((doneCount() / CHAPTERS.length) * 100);
  $("#pct").textContent = pct + "%";
  const circ = 2 * Math.PI * 10;
  $("#ring-fg").setAttribute("stroke-dasharray", `${(circ * pct) / 100} ${circ}`);
  const bar = $("#cover-bar-fill");
  if (bar) {
    bar.style.width = pct + "%";
    $("#cover-bar-label").textContent =
      pct === 100 ? "Finished — every chapter complete 🎉"
                  : `${doneCount()} of ${CHAPTERS.length} chapters complete`;
  }
}

/* =============================================================
   Settings
   ============================================================= */
const SIZES = ["0.95rem", "1.01rem", "1.075rem", "1.16rem", "1.26rem", "1.4rem"];
const LEADINGS = ["1.5", "1.62", "1.75", "1.9", "2.05"];
const WIDTHS = ["34rem", "39rem", "44rem", "50rem", "58rem"];

function applySettings() {
  const s = state.settings;
  const theme = s.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "light");
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.font = s.font;
  const r = document.documentElement.style;
  r.setProperty("--reader-size", SIZES[s.size]);
  r.setProperty("--reader-leading", LEADINGS[s.leading]);
  r.setProperty("--maxw", WIDTHS[s.width]);
}

/* =============================================================
   Sidebar — contents & search
   ============================================================= */
function renderTOC() {
  const q = $("#search").value.trim();
  const toc = $("#toc");
  toc.textContent = "";
  if (q.length >= 2) return renderSearch(q, toc);

  const cover = el("button", { className: "toc-cover" });
  cover.innerHTML = svgIcon('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/>') + "<span>Cover &amp; overview</span>";
  cover.style.cssText = "align-items:center";
  cover.querySelector("svg").style.cssText = "width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.7";
  cover.onclick = () => go(null);
  toc.append(cover);

  for (const part of BOOK.parts) {
    const done = part.chapters.filter(c => state.completed[c.slug]).length;
    const wrap = el("div", { className: "toc-part" });
    wrap.append(el("div", { className: "toc-part-title" }, [
      el("span", { textContent: part.title }),
      el("span", { className: "toc-part-count", textContent: `${done}/${part.chapters.length}` }),
    ]));
    for (const c of part.chapters) {
      const b = el("button", {
        className: "toc-item" + (state.completed[c.slug] ? " done" : "") + (c.slug === current ? " current" : ""),
      });
      b.setAttribute("aria-current", c.slug === current ? "page" : "false");
      b.append(
        el("span", { className: "dot" }),
        el("span", { className: "num", textContent: c.number }),
        el("span", { textContent: c.shortTitle, style: "min-width:0" }),
        el("span", { className: "toc-min", textContent: c.minutes + "m" }),
      );
      b.onclick = () => go(c.slug);
      wrap.append(b);
    }
    toc.append(wrap);
  }
}

function renderSearch(q, toc) {
  const needle = q.toLowerCase();
  const hits = [];
  for (const c of CHAPTERS) {
    const hay = [c.title, c.summary, c.body, (c.takeaways || []).join(" "), c.caseStudy || "", c.actionStep || ""].join("\n");
    const i = hay.toLowerCase().indexOf(needle);
    if (i === -1) continue;
    const from = Math.max(0, i - 45);
    const snip = (from > 0 ? "…" : "") + hay.slice(from, i + needle.length + 70).replace(/\s+/g, " ") + "…";
    hits.push({ c, snip });
  }
  if (!hits.length) {
    toc.append(el("p", { className: "side-empty", textContent: `No matches for “${q}”.` }));
    return;
  }
  toc.append(el("p", { className: "side-empty", style: "padding:.5rem .6rem", textContent: `${hits.length} chapter${hits.length > 1 ? "s" : ""} match “${q}”` }));
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
  for (const { c, snip } of hits) {
    const b = el("button", { className: "search-result" });
    b.innerHTML = `<span class="sr-title">${esc(c.number)}. ${esc(c.shortTitle)}</span><span class="sr-snip">${esc(snip).replace(re, "<mark>$1</mark>")}</span>`;
    b.onclick = () => go(c.slug);
    toc.append(b);
  }
}

/* =============================================================
   Views
   ============================================================= */
let current = null; // slug or null for cover

function renderCover() {
  const main = $("#main");
  const pct = Math.round((doneCount() / CHAPTERS.length) * 100);
  const resume = state.last && BY_SLUG[state.last] ? BY_SLUG[state.last] : CHAPTERS.find(c => !state.completed[c.slug]);
  const wrap = el("div", { className: "cover" });

  const card = el("div", { className: "cover-card" });
  card.innerHTML = `
    <div class="cover-eyebrow">Interactive Edition</div>
    <h1>${esc(BOOK.title)}</h1>
    <p class="sub">${esc(BOOK.subtitle)}</p>
    <p class="byline">by ${esc(BOOK.author)}</p>
    <div class="cover-stats">
      <div class="stat"><b>${BOOK.parts.length}</b><span>Parts</span></div>
      <div class="stat"><b>${CHAPTERS.length}</b><span>Chapters</span></div>
      <div class="stat"><b>${Math.round(TOTAL_MINUTES / 60)}h ${TOTAL_MINUTES % 60}m</b><span>Reading</span></div>
      <div class="stat"><b>${CHAPTERS.reduce((n, c) => n + c.quiz.length, 0)}</b><span>Questions</span></div>
    </div>
    <div class="cover-bar"><i id="cover-bar-fill" style="width:${pct}%"></i></div>
    <div class="cover-bar-label" id="cover-bar-label"></div>
    <div class="cover-actions" style="margin-top:1.2rem"></div>
  `;
  const actions = card.querySelector(".cover-actions");
  const primary = el("button", { className: "btn" });
  primary.innerHTML = svgIcon('<path d="M5 12h14m-6-6 6 6-6 6"/>') + (resume && (state.last || doneCount()) ? "Continue reading" : "Start reading");
  primary.onclick = () => go((resume || CHAPTERS[0]).slug);
  actions.append(primary);

  if (resume && (state.last || doneCount())) {
    actions.append(el("span", {
      style: "font-size:.8rem;color:var(--muted)",
      textContent: `${resume.number}. ${resume.shortTitle}`,
    }));
  }
  wrap.append(card);

  wrap.append(el("p", {
    style: "font-size:.85rem;color:var(--muted);line-height:1.6;margin:2rem 0 .3rem;max-width:40rem",
    textContent: BOOK.description,
  }));

  const grid = el("div", { className: "parts-grid" });
  for (const part of BOOK.parts) {
    const done = part.chapters.filter(c => state.completed[c.slug]).length;
    const b = el("button", { className: "part-card" });
    b.innerHTML = `
      <h3>${esc(part.title)}</h3>
      <p>${esc(part.description)}</p>
      <div class="meta"><span>${part.chapters.length} chapters</span><span>·</span>
        ${done ? `<i>${done} done</i>` : `<span>${part.chapters.reduce((n, c) => n + c.minutes, 0)} min</span>`}
      </div>`;
    b.onclick = () => go(part.chapters[0].slug);
    grid.append(b);
  }
  wrap.append(grid);

  main.textContent = "";
  main.append(wrap);
  paintProgress();
}

function renderChapter(slug) {
  const c = BY_SLUG[slug];
  const idx = CHAPTERS.indexOf(c);
  const prev = CHAPTERS[idx - 1], next = CHAPTERS[idx + 1];
  const done = !!state.completed[slug];
  const main = $("#main");
  const art = el("article", { className: "reader" });

  /* --- head --- */
  const head = el("div", { className: "ch-head" });
  head.innerHTML = `
    <div class="ch-eyebrow">${esc(c.partTitle)}</div>
    <h1>${esc(c.title)}</h1>
    <p class="ch-summary">${esc(c.summary)}</p>
    <div class="ch-meta">
      <span class="chip">${svgIcon('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>')} ${c.minutes} min read</span>
      <span class="chip">Chapter ${c.number} of ${CHAPTERS.length}</span>
      ${c.quiz.length ? `<span class="chip">${c.quiz.length} knowledge check${c.quiz.length > 1 ? "s" : ""}</span>` : ""}
      ${done ? `<span class="chip done">${svgIcon('<path d="m5 12.5 4.5 4.5L19 7.5"/>')} Complete</span>` : ""}
    </div>`;
  head.querySelectorAll(".chip svg").forEach(s => {
    s.style.cssText = "width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round";
  });
  art.append(head, el("hr", { className: "rule" }));

  /* --- prose --- */
  const prose = el("div", { className: "prose", id: "prose" });
  prose.innerHTML = md(c.body);
  art.append(prose);

  /* --- takeaways --- */
  if (c.takeaways?.length) {
    const card = el("div", { className: "card" });
    card.innerHTML = `<h2>${svgIcon('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 3.6 10.8c-.6.5-.9 1.1-1 1.7H9.4c-.1-.6-.4-1.2-1-1.7A6 6 0 0 1 12 3z"/>')}Key takeaways</h2>`;
    const ul = el("ul", { className: "takeaways" });
    for (const t of c.takeaways) ul.append(el("li", { innerHTML: md(t).replace(/^<p>|<\/p>$/g, "") }));
    card.append(ul);
    art.append(card);
  }

  /* --- case study --- */
  if (c.caseStudy) {
    const card = el("div", { className: "card" });
    card.innerHTML = `<h2>${svgIcon('<circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.2a3 3 0 0 1 0 5.6M18 19a5.6 5.6 0 0 0-2.2-4.4"/>')}From the book</h2>
      <p class="case-study">${esc(c.caseStudy)}</p>`;
    art.append(card);
  }

  /* --- action step --- */
  if (c.actionStep) art.append(actionCard(c));

  /* --- quiz --- */
  if (c.quiz.length) art.append(quizCard(c));

  /* --- footer --- */
  const foot = el("div", { className: "ch-foot" });
  const row = el("div", { className: "complete-row" + (done ? " done" : "") });
  const cbtn = el("button", { className: "btn" + (done ? " ghost" : "") });
  const setRow = () => {
    const d = !!state.completed[slug];
    row.classList.toggle("done", d);
    cbtn.className = "btn" + (d ? " ghost" : "");
    cbtn.innerHTML = d ? "Mark as unread" : svgIcon('<path d="m5 12.5 4.5 4.5L19 7.5"/>') + "Mark chapter complete";
    row.querySelector(".complete-label").textContent = d
      ? "You've completed this chapter."
      : "Finished reading? Mark it complete to track your progress.";
  };
  cbtn.onclick = () => {
    if (state.completed[slug]) delete state.completed[slug]; else state.completed[slug] = true;
    save(); setRow(); paintProgress(); renderTOC();
    if (state.completed[slug]) {
      toast(doneCount() === CHAPTERS.length ? "That's the whole book — well done." : "Chapter complete");
    }
  };
  row.append(el("span", { className: "complete-label" }), cbtn);
  setRow();
  foot.append(row);

  const nav = el("div", { className: "nav-row" });
  const mk = (ch, dir) => {
    const b = el("button", { className: "navbtn" + (dir === "next" ? " next" : "") });
    b.append(el("span", { textContent: dir === "next" ? "Next" : "Previous" }),
             el("b", { textContent: ch ? `${ch.number}. ${ch.shortTitle}` : "—" }));
    if (ch) b.onclick = () => go(ch.slug); else b.disabled = true;
    return b;
  };
  nav.append(mk(prev, "prev"), mk(next, "next"));
  foot.append(nav);
  art.append(foot);

  main.textContent = "";
  main.append(art);
  paintHighlights();
}

function actionCard(c) {
  const st = state.actions[c.slug] || (state.actions[c.slug] = { done: false, note: "" });
  const card = el("div", { className: "card" });
  card.innerHTML = `<h2>${svgIcon('<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3.5"/>')}Your action step<span class="saved-flag" id="af-action">Saved</span></h2>`;
  const row = el("div", { className: "action-row" + (st.done ? " done" : "") });
  const check = el("button", { className: "check" });
  check.setAttribute("aria-pressed", String(!!st.done));
  check.setAttribute("aria-label", "Mark action step as done");
  check.innerHTML = svgIcon('<path d="m5 12.5 4.5 4.5L19 7.5"/>');
  check.onclick = () => {
    st.done = !st.done;
    check.setAttribute("aria-pressed", String(st.done));
    row.classList.toggle("done", st.done);
    save();
  };
  row.append(check, el("div", { className: "action-text", textContent: c.actionStep }));
  card.append(row);

  const ta = el("textarea", { className: "note", value: st.note || "", placeholder: "Write your answer, plan or notes here — saved on this device." });

let flagTimers = {};
function flag(sel) {
  const n = $(sel);
  if (!n) return;
  n.classList.add("show");
  clearTimeout(flagTimers[sel]);
  flagTimers[sel] = setTimeout(() => n.classList.remove("show"), 1400);

function quizCard(c) {
  const st = state.quiz[c.slug] || (state.quiz[c.slug] = { answers: [], checked: false });
  const card = el("div", { className: "card" });
  card.innerHTML = `<h2>${svgIcon('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2A2.6 2.6 0 0 1 14.5 10c0 1.7-2.5 2-2.5 3.5M12 17h.01"/>')}Knowledge check</h2>`;
  const body = el("div");
  card.append(body);

  const foot = el("div", { className: "quiz-foot" });
  const scoreEl = el("span", { className: "score" });
  const checkBtn = el("button", { className: "btn small", textContent: "Check answers" });
  const resetBtn = el("button", { className: "btn ghost small", textContent: "Try again" });
  foot.append(scoreEl, el("span", { style: "margin-left:auto" }), checkBtn, resetBtn);
  card.append(foot);

  function paint() {
    body.textContent = "";
    c.quiz.forEach((q, qi) => {
      const box = el("div", { className: "q" });
      box.innerHTML = `<p class="q-prompt"><span class="qn">${qi + 1}.</span><span>${esc(q.prompt)}</span></p>`;
      const list = el("div", { className: "choices" });
      q.choices.forEach((choice, ci) => {
        const picked = st.answers[qi] === ci;
        let cls = "choice";
        if (st.checked) {
          if (ci === q.answer) cls += " correct";
          else if (picked) cls += " wrong";
        } else if (picked) cls += " selected";
        const b = el("button", { className: cls });
        b.setAttribute("aria-pressed", String(picked));
        b.append(el("span", { className: "box", textContent: "ABCD"[ci] || String(ci + 1) }),
                 el("span", { textContent: choice }));
        if (st.checked) b.disabled = true;
        else b.onclick = () => { st.answers[qi] = ci; save(); paint(); };
        list.append(b);
      });
      box.append(list);
      body.append(box);
    });

    const answered = c.quiz.filter((_, i) => st.answers[i] != null).length;
    checkBtn.disabled = st.checked || answered < c.quiz.length;
    checkBtn.textContent = st.checked ? "Checked" : answered < c.quiz.length
      ? `Answer all ${c.quiz.length}` : "Check answers";
    resetBtn.hidden = !st.checked;
    if (st.checked) {
      const right = c.quiz.filter((q, i) => st.answers[i] === q.answer).length;
      scoreEl.textContent = `${right} / ${c.quiz.length} correct`;
      scoreEl.className = "score " + (right === c.quiz.length ? "pass" : "fail");
    } else {
      scoreEl.textContent = answered ? `${answered} of ${c.quiz.length} answered` : "";
      scoreEl.className = "score";
      scoreEl.style.color = "var(--muted)";
      scoreEl.style.fontWeight = "500";
    }
  }
  checkBtn.onclick = () => {
    st.checked = true; save(); paint();
    const right = c.quiz.filter((q, i) => st.answers[i] === q.answer).length;
    toast(right === c.quiz.length ? "Perfect score" : `${right} of ${c.quiz.length} correct`);
  };
  resetBtn.onclick = () => { st.answers = []; st.checked = false; save(); paint(); };
  paint();
  return card;
}

/* =============================================================
   Highlights
   ============================================================= */
/* Highlights are stored as a character offset into the chapter's
   plain text plus the exact text, so they survive re-renders. */
function textOffsetOf(container, node, offset) {
  const r = document.createRange();
  r.selectNodeContents(container);
  r.setEnd(node, offset);
  return r.toString().length;
}

function wrapRange(container, start, end, id, hasNote) {
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let pos = 0, node, made = false;
  const targets = [];
  while ((node = walker.nextNode())) {
    const len = node.nodeValue.length;
    const s = Math.max(start, pos), e = Math.min(end, pos + len);
    if (s < e) targets.push({ node, from: s - pos, to: e - pos });
    pos += len;
    if (pos >= end) break;
  }
  for (const t of targets) {
    const range = document.createRange();
    range.setStart(t.node, t.from);
    range.setEnd(t.node, t.to);
    const span = document.createElement("span");
    span.className = "hl" + (hasNote ? " has-note" : "");
    span.dataset.hl = id;
    span.tabIndex = 0;
    span.setAttribute("role", "button");
    span.title = hasNote ? "Highlight with a note — click to edit" : "Highlight — click to add a note or remove";
    try { range.surroundContents(span); made = true; } catch { /* crosses element bounds; skip fragment */ }
  }
  return made;
}

function paintHighlights() {
  const prose = $("#prose");
  if (!prose || !current) return;
  const list = state.highlights
    .filter(h => h.slug === current)
    .sort((a, b) => b.start - a.start); // back-to-front keeps earlier offsets valid
  for (const h of list) {
    if (!wrapRange(prose, h.start, h.start + h.text.length, h.id, !!h.note)) continue;
  }
  prose.querySelectorAll(".hl").forEach(n => {
    n.onclick = () => openNoteModal(n.dataset.hl);
    n.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openNoteModal(n.dataset.hl); } };
  });
}

const selpop = $("#selpop");
function hideSelPop() { selpop.classList.remove("show"); }

function currentSelectionRange() {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const prose = $("#prose");
  if (!prose) return null;
  const range = sel.getRangeAt(0);
  if (!prose.contains(range.commonAncestorContainer)) return null;
  const text = range.toString().trim();
  if (text.length < 3) return null;
  const start = textOffsetOf(prose, range.startContainer, range.startOffset);
  const raw = range.toString();
  const lead = raw.length - raw.trimStart().length;
  return { start: start + lead, text, rect: range.getBoundingClientRect() };
}

document.addEventListener("selectionchange", () => {
  const info = currentSelectionRange();
  if (!info) return hideSelPop();
  const r = info.rect;
  selpop.classList.add("show");
  /* #selpop is position:fixed, so these are viewport coordinates. Prefer just
     above the selection, fall back to just below, and always stay on screen —
     the selection may be partly scrolled out of view. */
  const w = selpop.offsetWidth, h = selpop.offsetHeight;
  const clamp = (v, min, max) => Math.max(min, Math.min(v, max));
  const left = clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8);
  const above = r.top - h - 8;
  const top = clamp(above >= 8 ? above : r.bottom + 8, 8, innerHeight - h - 8);
  selpop.style.left = left + "px";
  selpop.style.top = top + "px";
});

function addHighlight(withNote) {
  const info = currentSelectionRange();
  if (!info) return;
  const h = { id: "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              slug: current, start: info.start, text: info.text, note: "" };
  state.highlights.push(h);
  save();
  getSelection().removeAllRanges();
  hideSelPop();
  renderChapter(current);
  renderPanel();
  if (withNote) openNoteModal(h.id);
  else toast("Highlighted");
}
$("#sel-hl").onclick = () => addHighlight(false);
$("#sel-note").onclick = () => addHighlight(true);

/* ---------- note modal ---------- */
let modalId = null;
function openNoteModal(id) {
  const h = state.highlights.find(x => x.id === id);
  if (!h) return;
  modalId = id;
  $("#modal-title").textContent = h.note ? "Edit note" : "Add a note";
  $("#modal-desc").textContent = BY_SLUG[h.slug] ? `${BY_SLUG[h.slug].number}. ${BY_SLUG[h.slug].shortTitle}` : "";
  const q = $("#modal-quote");
  q.hidden = false;
  q.textContent = h.text;
  $("#modal-note").value = h.note || "";
  $("#modal-delete").hidden = false;
  $("#backdrop").classList.add("show");
  $("#modal").classList.add("show");
  setTimeout(() => $("#modal-note").focus(), 30);
}
function closeModal() {
  modalId = null;
  $("#backdrop").classList.remove("show");
  $("#modal").classList.remove("show");
}
$("#modal-cancel").onclick = closeModal;
$("#backdrop").onclick = closeModal;
$("#modal-save").onclick = () => {
  const h = state.highlights.find(x => x.id === modalId);
  if (h) { h.note = $("#modal-note").value.trim(); save(); }
  closeModal();
  if (current) renderChapter(current);
  renderPanel();
  toast("Note saved");
};
$("#modal-delete").onclick = () => {
  state.highlights = state.highlights.filter(x => x.id !== modalId);
  save(); closeModal();
  if (current) renderChapter(current);
  renderPanel();
  toast("Highlight removed");
};

/* =============================================================
   Side panel — notes & settings
   ============================================================= */
let panelMode = "notes";
function openPanel(mode) {
  if (!$("#panel").hidden && panelMode === mode) return closePanel();
  panelMode = mode;
  $("#panel").hidden = false;
  $("#panel-title").textContent = mode === "notes" ? "Notes & highlights" : "Reading settings";
  $("#btn-export").hidden = mode !== "notes";
  $("#btn-notes").classList.toggle("active", mode === "notes");
  $("#btn-settings").classList.toggle("active", mode === "settings");
  if (innerWidth <= 1180) $("#scrim").classList.add("show");
  renderPanel();
}
function closePanel() {
  $("#panel").hidden = true;
  $("#scrim").classList.remove("show");
  $("#btn-notes").classList.remove("active");
  $("#btn-settings").classList.remove("active");
}
$("#btn-notes").onclick = () => openPanel("notes");
$("#btn-settings").onclick = () => openPanel("settings");
$("#btn-panel-close").onclick = closePanel;
$("#scrim").onclick = () => { closePanel(); if (innerWidth <= 900) $("#sidebar").hidden = true; };

function renderPanel() {
  if ($("#panel").hidden) return;
  const body = $("#panel-body");
  body.textContent = "";
  if (panelMode === "notes") renderNotes(body); else renderSettings(body);
}

function renderNotes(body) {
  const notes = [];
  for (const c of CHAPTERS) {
    for (const h of state.highlights.filter(h => h.slug === c.slug).sort((a, b) => a.start - b.start)) notes.push({ type: "hl", c, h });
    const a = state.actions[c.slug];
    if (a && (a.note || "").trim()) notes.push({ type: "action", c, a });
  }
  if (!notes.length) {
    const p = el("div", { className: "panel-empty" });
    p.innerHTML = svgIcon('<path d="M4 20h16M6 16l8.5-8.5a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L9.5 19.5 5 20z"/>') +
      "<div>Select any passage while reading to highlight it or attach a note.<br><br>Your action-step answers show up here too.</div>";
    body.append(p);
    return;
  }
  body.append(el("p", {
    style: "font-size:.75rem;color:var(--muted);margin:0 0 .8rem",
    textContent: `${notes.length} item${notes.length > 1 ? "s" : ""} · stored on this device only`,
  }));
  for (const n of notes) {
    const item = el("div", { className: "note-item" });
    const link = el("button", { className: "ni-ch", textContent: `${n.c.number}. ${n.c.shortTitle}` });
    link.onclick = () => { go(n.c.slug); if (innerWidth <= 1180) closePanel(); };
    item.append(link);
    if (n.type === "hl") {
      item.append(el("blockquote", { textContent: n.h.text }));
      if (n.h.note) item.append(el("p", { className: "ni-note", textContent: n.h.note }));
      const acts = el("div", { className: "ni-actions" });
      const edit = el("button", { className: "linkbtn", textContent: n.h.note ? "Edit note" : "Add note" });
      edit.onclick = () => { if (current !== n.c.slug) go(n.c.slug); openNoteModal(n.h.id); };
      const del = el("button", { className: "linkbtn danger", textContent: "Delete" });
      del.onclick = () => {
        state.highlights = state.highlights.filter(x => x.id !== n.h.id);
        save(); if (current === n.c.slug) renderChapter(current); renderPanel();
      };
      acts.append(edit, del);
      item.append(acts);
    } else {
      item.append(el("p", {
        className: "ni-note",
        style: "font-weight:600;color:var(--text);margin-bottom:.3rem",
        textContent: (n.a.done ? "✓ " : "") + "Action step",
      }));
      item.append(el("p", { className: "ni-note", textContent: n.a.note }));
    }
    body.append(item);
  }
}

function renderSettings(body) {
  const s = state.settings;

  const themeField = el("div", { className: "field" });
  themeField.innerHTML = "<label>Theme</label>";
  const themeSeg = el("div", { className: "seg" });
  for (const [val, label] of [["light", "Light"], ["sepia", "Sepia"], ["night", "Night"]]) {
    const b = el("button", { textContent: label });
    b.setAttribute("aria-pressed", String(document.documentElement.dataset.theme === val));
    b.onclick = () => { s.theme = val; applySettings(); save(); renderPanel(); };
    themeSeg.append(b);
  }
  themeField.append(themeSeg);

  const fontField = el("div", { className: "field" });
  fontField.innerHTML = "<label>Typeface</label>";
  const fontSeg = el("div", { className: "seg" });
  for (const [val, label] of [["serif", "Serif"], ["sans", "Sans"]]) {
    const b = el("button", { textContent: label });
    b.setAttribute("aria-pressed", String(s.font === val));
    b.onclick = () => { s.font = val; applySettings(); save(); renderPanel(); };
    fontSeg.append(b);
  }
  fontField.append(fontSeg);

  const stepper = (label, key, max, fmt) => {
    const f = el("div", { className: "field" });
    f.innerHTML = `<label>${label}</label>`;
    const row = el("div", { className: "stepper" });
    const minus = el("button", { className: "iconbtn", innerHTML: svgIcon('<path d="M5 12h14"/>') });
    const plus = el("button", { className: "iconbtn", innerHTML: svgIcon('<path d="M12 5v14M5 12h14"/>') });
    minus.setAttribute("aria-label", "Decrease " + label.toLowerCase());
    plus.setAttribute("aria-label", "Increase " + label.toLowerCase());
    const out = el("output", { textContent: fmt(s[key]) });
    const upd = d => {
      s[key] = Math.max(0, Math.min(max, s[key] + d));
      out.textContent = fmt(s[key]);
      minus.disabled = s[key] === 0; plus.disabled = s[key] === max;
      applySettings(); save();
    };
    minus.onclick = () => upd(-1);
    plus.onclick = () => upd(1);
    minus.disabled = s[key] === 0; plus.disabled = s[key] === max;
    row.append(minus, out, plus);
    f.append(row);
    return f;
  };

  const reset = el("div", { className: "field" });
  reset.innerHTML = "<label>Your data</label>";
  const stats = el("p", {
    style: "font-size:.8rem;color:var(--muted);line-height:1.55;margin:0 0 .6rem",
    textContent: `${doneCount()} chapters complete · ${state.highlights.length} highlights · ` +
      `${Object.values(state.actions).filter(a => a.note || a.done).length} action steps worked on. ` +
      "Everything lives in this browser — nothing is uploaded.",
  });
  const wipe = el("button", { className: "btn ghost small", textContent: "Reset all progress" });
  wipe.onclick = () => {
    if (!confirm("Erase all progress, highlights, notes and quiz results on this device?")) return;
    localStorage.removeItem(KEY);
    state = load();
    applySettings(); renderTOC(); renderPanel(); go(null);
    toast("All data cleared");
  };
  reset.append(stats, wipe);

  body.append(
    themeField, fontField,
    stepper("Text size", "size", SIZES.length - 1, v => Math.round((parseFloat(SIZES[v]) / parseFloat(SIZES[2])) * 100) + "%"),
    stepper("Line spacing", "leading", LEADINGS.length - 1, v => LEADINGS[v]),
    stepper("Page width", "width", WIDTHS.length - 1, v => ["XS", "S", "M", "L", "XL"][v]),
    reset,
  );
}

/* =============================================================
   Export
   ============================================================= */
function exportMarkdown() {
  const date = new Date().toISOString().slice(0, 10);
  const lines = [
    `# ${BOOK.title} — my notes`,
    "", `_${BOOK.subtitle}_`, "",
    `Exported ${date} · ${doneCount()}/${CHAPTERS.length} chapters complete`, "", "---", "",
  ];
  let any = false;
  for (const c of CHAPTERS) {
    const hls = state.highlights.filter(h => h.slug === c.slug).sort((a, b) => a.start - b.start);
    const act = state.actions[c.slug];
    const quiz = state.quiz[c.slug];
    const hasQuiz = quiz?.checked;
    const hasAct = act && (act.done || (act.note || "").trim());
    if (!hls.length && !hasAct && !hasQuiz && !state.completed[c.slug]) continue;
    any = true;
    lines.push(`## ${c.number}. ${c.shortTitle}`, "");
    lines.push(`*${c.partTitle}*${state.completed[c.slug] ? " · ✅ complete" : ""}`, "");
    if (hls.length) {
      lines.push("### Highlights", "");
      for (const h of hls) {
        lines.push(`> ${h.text.replace(/\n+/g, " ")}`, "");
        if (h.note) lines.push(`**Note:** ${h.note}`, "");
      }
    }
    if (hasAct) {
      lines.push("### Action step", "", `- [${act.done ? "x" : " "}] ${c.actionStep}`, "");
      if ((act.note || "").trim()) lines.push(act.note.trim(), "");
    }
    if (hasQuiz) {
      const right = c.quiz.filter((q, i) => quiz.answers[i] === q.answer).length;
      lines.push(`### Knowledge check`, "", `Score: **${right}/${c.quiz.length}**`, "");
    }
    lines.push("---", "");
  }
  if (!any) lines.push("_No highlights, notes or completed chapters yet._", "");

  const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `ai-income-blueprint-notes-${date}.md` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Notes exported");
}
$("#btn-export").onclick = exportMarkdown;

/* =============================================================
   Routing & chrome
   ============================================================= */
function go(slug, opts = {}) {
  current = slug && BY_SLUG[slug] ? slug : null;
  if (current) { state.last = current; save(); }
  const hash = current ? "#/" + current : "#/cover";
  if (location.hash !== hash && !opts.fromHash) location.hash = hash;
  if (current) renderChapter(current); else renderCover();
  paintProgress();
  renderTOC();
  renderPanel();
  document.title = current ? `${BY_SLUG[current].shortTitle} — ${BOOK.title}` : `${BOOK.title} — Interactive Edition`;
  $("#brand-sub").textContent = current ? `Chapter ${BY_SLUG[current].number} of ${CHAPTERS.length}` : "Interactive Edition";
  $("#main").scrollTop = 0;
  if (innerWidth <= 900 && !opts.keepSidebar) { $("#sidebar").hidden = true; $("#scrim").classList.remove("show"); }
  if (opts.focus !== false) $("#main").focus({ preventScroll: true });
}

addEventListener("hashchange", () => {
  const slug = location.hash.replace(/^#\//, "");
  if (slug === "cover" || !slug) { if (current !== null) go(null, { fromHash: true }); return; }
  if (BY_SLUG[slug] && slug !== current) go(slug, { fromHash: true });
});

$("#btn-home").onclick = () => go(null);
$("#btn-toc").onclick = () => {
  const sb = $("#sidebar");
  sb.hidden = !sb.hidden;
  $("#btn-toc").setAttribute("aria-pressed", String(!sb.hidden));
  if (innerWidth <= 900) $("#scrim").classList.toggle("show", !sb.hidden);
};
$("#search").oninput = renderTOC;
$("#search").onkeydown = e => { if (e.key === "Escape") { e.target.value = ""; renderTOC(); e.target.blur(); } };

$("#main").addEventListener("scroll", () => {
  const m = $("#main");
  const max = m.scrollHeight - m.clientHeight;
  $("#scrollprogress").style.width = max > 40 ? (m.scrollTop / max) * 100 + "%" : "0";
}, { passive: true });

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Escape") {
    if ($("#modal").classList.contains("show")) return closeModal();
    hideSelPop();
    if (!$("#panel").hidden) closePanel();
    return;
  }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); $("#sidebar").hidden = false; $("#btn-toc").setAttribute("aria-pressed", "true"); $("#search").focus(); return; }
  const idx = current ? CHAPTERS.indexOf(BY_SLUG[current]) : -1;
  if (e.key === "ArrowRight" && idx < CHAPTERS.length - 1) go(CHAPTERS[idx + 1].slug);
  else if (e.key === "ArrowLeft" && idx > 0) go(CHAPTERS[idx - 1].slug);
  else if (e.key === "ArrowLeft" && idx === 0) go(null);
  else if (e.key.toLowerCase() === "c") $("#btn-toc").click();
  else if (e.key.toLowerCase() === "n") openPanel("notes");
  else if (e.key.toLowerCase() === "s") openPanel("settings");
  else if (e.key.toLowerCase() === "t") {
    const order = ["light", "sepia", "night"];
    const now = document.documentElement.dataset.theme;
    state.settings.theme = order[(order.indexOf(now) + 1) % order.length];
    applySettings(); save(); renderPanel();
    toast(state.settings.theme[0].toUpperCase() + state.settings.theme.slice(1) + " theme");
  }
});

document.addEventListener("mousedown", e => { if (!selpop.contains(e.target)) hideSelPop(); });

/* =============================================================
   Boot
   ============================================================= */
applySettings();
if (innerWidth <= 900) { $("#sidebar").hidden = true; $("#btn-toc").setAttribute("aria-pressed", "false"); }
$("#brand-title").textContent = BOOK.title;
const bootSlug = location.hash.replace(/^#\//, "");
go(BY_SLUG[bootSlug] ? bootSlug : null, { fromHash: true, focus: false });
</script>
</body>
</html>
