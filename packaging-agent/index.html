<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOSH Packaging Agent — turn one Claude output into a sellable product</title>
<meta name="description" content="Offline packaging console: takes one AI-generated asset and writes the whole commercial package — descriptions, four price tiers, documentation, licences, marketplace listings, SEO, 50 social posts, a funnel and a launch plan — then downloads it as a folder tree.">
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --ink:#15181d; --ink-2:#4a5261;
  --ink-3:#6b7484; --line:#dfe3ea; --line-2:#c7cddb;
  --accent:#8a3ffc; --accent-ink:#ffffff; --accent-soft:#f2eaff;
  --good:#0a7d4c; --good-soft:#e3f6ec; --warn:#8a5a00; --warn-soft:#fdf1d6;
  --bad:#b3261e; --bad-soft:#fbe8e7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(16,20,30,.06),0 4px 16px rgba(16,20,30,.05);
}
html[data-theme="dark"]{
  --bg:#0d1015; --panel:#161a21; --panel-2:#1d222b; --ink:#e9edf4; --ink-2:#aeb7c6;
  --ink-3:#818b9c; --line:#252b36; --line-2:#333b49;
  --accent:#b78bff; --accent-ink:#1a1030; --accent-soft:#241b3a;
  --good:#5cd39b; --good-soft:#102b20; --warn:#e5b95c; --warn-soft:#2c2413;
  --bad:#ff8b82; --bad-soft:#301715;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    --bg:#0d1015; --panel:#161a21; --panel-2:#1d222b; --ink:#e9edf4; --ink-2:#aeb7c6;
    --ink-3:#818b9c; --line:#252b36; --line-2:#333b49;
    --accent:#b78bff; --accent-ink:#1a1030; --accent-soft:#241b3a;
    --good:#5cd39b; --good-soft:#102b20; --warn:#e5b95c; --warn-soft:#2c2413;
    --bad:#ff8b82; --bad-soft:#301715;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .5em}
h1{font-size:1.15rem; letter-spacing:-.01em}
h2{font-size:1.35rem; letter-spacing:-.015em; margin-top:0}
h3{font-size:1.05rem}
h4{font-size:.95rem; color:var(--ink-2)}
p,li,dd{margin:0 0 .9em; overflow-wrap:anywhere}
li{margin-bottom:.25em}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono); font-size:.87em}
pre{
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; overflow-x:auto; margin:0 0 1em; white-space:pre; tab-size:2;
}
hr{border:0; border-top:1px solid var(--line); margin:1.6em 0}

/* ---------- layout ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 18px 80px}
header.top{
  position:sticky; top:0; z-index:40; background:var(--panel);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1180px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .mark{
  width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-weight:800; font-size:.9rem; flex:0 0 auto;
}
.brand .who{font-size:.72rem; color:var(--ink-3); letter-spacing:.09em; text-transform:uppercase}
.top-spacer{flex:1 1 auto}
.top-stat{
  display:flex; gap:6px; align-items:baseline; font-size:.8rem; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}
.top-stat b{color:var(--ink); font-size:.9rem; font-variant-numeric:tabular-nums}

/* ---------- tabs ---------- */
.tabs{
  position:sticky; top:52px; z-index:35; background:var(--bg);
  border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin;
}
.tabs-in{max-width:1180px; margin:0 auto; padding:0 12px; display:flex; gap:2px; min-width:max-content}
.tab{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--ink-2); font:inherit; font-size:.88rem; padding:11px 12px; cursor:pointer;
  white-space:nowrap; border-radius:6px 6px 0 0;
}
.tab:hover{color:var(--ink); background:var(--panel-2)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:650}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.panel[hidden]{display:none}
.panel{padding-top:22px}

/* ---------- cards ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin:0 0 16px; box-shadow:var(--shadow);
}

.card-hd h2,.card-hd h3{margin:0}

.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

.lede{font-size:1.02rem; color:var(--ink-2); max-width:74ch}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- forms ---------- */
label{display:block; font-size:.82rem; font-weight:600; color:var(--ink-2); margin:0 0 5px}
.hint{font-weight:400; color:var(--ink-3); font-size:.78rem}
input[type=text],input[type=number],select,textarea{
  width:100%; background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:8px; padding:8px 10px; font:inherit; font-size:.92rem;
}
textarea{min-height:76px; resize:vertical; line-height:1.5}
input[type=range]{width:100%; accent-color:var(--accent)}
.field{margin:0 0 14px}
.field:last-child{margin-bottom:0}
.row{display:flex; gap:10px; align-items:center}
.row-grow{flex:1 1 auto; min-width:0}
fieldset{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin:0 0 14px}
legend{font-size:.8rem; font-weight:700; color:var(--ink-2); padding:0 6px}
.checks{display:flex; flex-wrap:wrap; gap:8px 14px}
.check{display:flex; align-items:center; gap:7px; font-size:.87rem; font-weight:500; color:var(--ink); margin:0}
.check input{accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto}
.slider-val{font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); min-width:1.6em; display:inline-block}

.btn{
  appearance:none; font:inherit; font-size:.87rem; font-weight:600; cursor:pointer;
  background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:8px; padding:8px 13px;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08); color:var(--accent-ink)}
.btn.sm{padding:5px 9px; font-size:.8rem}
.btn.icon{padding:6px 9px; line-height:1}
.btn-row{display:flex; gap:9px; flex-wrap:wrap}

/* ---------- bits ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:.74rem; font-weight:700;
  padding:2px 9px; border-radius:999px; background:var(--panel-2); color:var(--ink-2);
  border:1px solid var(--line); letter-spacing:.02em;
}
.pill.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.pill.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.pill.accent{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.badge-unverified{background:var(--warn-soft); color:var(--warn); border-color:transparent}

table{border-collapse:collapse; width:100%; font-size:.88rem}
.table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius)}

th,td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--line); vertical-align:top}

tbody tr:last-child td{border-bottom:0}

details{border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); margin:0 0 10px}

summary{

  list-style:none; display:flex; align-items:center; gap:9px;
}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸"; color:var(--ink-3); font-size:.8em; transition:transform .15s}
details[open] > summary::before{transform:rotate(90deg)}
summary .sum-note{margin-left:auto; font-weight:400; font-size:.78rem; color:var(--ink-3)}
.details-body{padding:0 14px 14px; border-top:1px solid var(--line); padding-top:12px}
.details-body > :last-child{margin-bottom:0}

.copybox{position:relative; margin:0 0 12px}
.copybox pre{margin:0; max-height:460px; overflow:auto; white-space:pre-wrap; word-wrap:break-word}
.copybox .copy-btn{position:absolute; top:8px; right:8px}
.note{
  border-left:3px solid var(--accent); background:var(--accent-soft); color:var(--ink);
  padding:10px 13px; border-radius:0 8px 8px 0; font-size:.88rem; margin:0 0 14px;
}
.note.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.note > :last-child{margin-bottom:0}

.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:.88rem}
.kv dt{color:var(--ink-3); font-weight:600}
.kv dd{margin:0; font-variant-numeric:tabular-nums}

.tree-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-2); padding:12px}
.tree{font-family:var(--mono); font-size:.83rem; line-height:1.65; white-space:pre; min-width:max-content}
th,td{overflow-wrap:break-word}
.bar{height:7px; border-radius:999px; background:var(--panel-2); overflow:hidden; border:1px solid var(--line)}
.bar > span{display:block; height:100%; background:var(--accent)}

#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
  font-size:.86rem; font-weight:600; box-shadow:var(--shadow); z-index:100;
  opacity:0; pointer-events:none; transition:opacity .18s;
}
#toast.show{opacity:1}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
footer.foot{border-top:1px solid var(--line); margin-top:30px; padding:18px 0; color:var(--ink-3); font-size:.8rem}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>
</head>

<script>
"use strict";
/* ==========================================================================
   MOSH Packaging Agent
   One offline file. Nothing here talks to a model, and nothing leaves the
   device. It turns the facts you type about one AI-generated asset into the
   commercial package that asset needs in order to be sold: descriptions,
   four priced tiers, documentation, licences, four marketplace listings,
   SEO, fifty social posts, a funnel, a launch plan — and a folder of files.
   Every string below is composed by a pure function from your inputs, so the
   same inputs always produce the same package.
   ========================================================================== */

/* ---------- tiny DOM + string helpers ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean); }
function wc(s){ return words(s).length; }
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }
function round(n, dp){ const m = Math.pow(10, dp||0); return Math.round(n*m)/m; }
function uniq(a){ return Array.from(new Set(a)); }
function cap(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
function lower1(s){ s = String(s||''); return s.charAt(0).toLowerCase() + s.slice(1); }
function stripDot(s){ return String(s||'').trim().replace(/[.!?]+$/,''); }
function sentence(s){ s = String(s||'').trim(); if(!s) return ''; return cap(s).replace(/\s+/g,' ') + (/[.!?]$/.test(s) ? '' : '.'); }

/**
 * Shorten a phrase to a word budget without leaving it dangling: drop the
 * clause after the last comma first, and only cut mid-phrase if that is not
 * enough. Used where a sentence has a length it has to keep — a value
 * proposition of fifty words is not a value proposition.
 */
function clause(s, maxWords){
  const t = stripDot(String(s || '').trim());
  if(wc(t) <= maxWords) return t;
  const parts = t.split(/,\s*/);
  for(let i = parts.length - 1; i > 0; i--){
    const kept = parts.slice(0, i).join(', ');
    if(wc(kept) <= maxWords) return kept;
  }
  return words(t).slice(0, maxWords).join(' ');
}

/** Join a list with commas and a final "and" / "or". */
function joinList(arr, conj){
  const a = (arr||[]).filter(Boolean).map(String);
  const c = conj || 'and';
  if(!a.length) return '';
  if(a.length === 1) return a[0];
  if(a.length === 2) return a[0] + ' ' + c + ' ' + a[1];
  return a.slice(0,-1).join(', ') + ' ' + c + ' ' + a[a.length-1];
}
function slug(s){
  return String(s||'').toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'')
    .trim().replace(/[\s_]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'') || 'product';
}
/** Folder-safe name: "Prompt Pack" -> "Prompt_Pack" */
function fileSafe(s){
  return String(s||'').replace(/[^\w\s.-]/g,'').trim().replace(/\s+/g,'_').replace(/_+/g,'_') || 'Product';
}
/** Deterministic 32-bit hash — the only source of "choice" in the generator. */
function hash(s){
  let h = 2166136261 >>> 0;
  s = String(s);
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
/** Pick deterministically from a list, by seed. Same seed, same answer, forever. */
function pick(seed, arr){ return arr[hash(seed) % arr.length]; }
/** Rotate a list deterministically, so ten posts do not all open the same way. */
function rotate(arr, n){ const k = ((n % arr.length) + arr.length) % arr.length; return arr.slice(k).concat(arr.slice(0,k)); }

/* ---------- money ---------- */
function usd(n){
  if(n >= 1000) return '$' + Math.round(n).toLocaleString('en-US');
  return '$' + (Number.isInteger(n) ? n : round(n,2).toFixed(2));
}
function ghs(n){ return 'GHS ' + Math.round(n).toLocaleString('en-US'); }
/** Prices people actually charge: 9/19/29/49/79/99/149/199/299/499… */
const CHARM = [9,14,19,24,29,39,49,59,69,79,89,99,119,129,149,179,199,249,299,349,399,449,499,599,699,799,899,999,1200,1500,2000,2500,3000,4000,5000];
function charm(n){
  let best = CHARM[0], gap = Infinity;
  for(const c of CHARM){ const g = Math.abs(c - n); if(g < gap){ gap = g; best = c; } }
  return best;
}
/** Mobile-money-friendly cedi prices: whole tens, ending 0 or 9. */
function charmGHS(n){
  if(n < 100) return Math.max(10, Math.round(n/5)*5);
  if(n < 1000) return Math.round(n/10)*10;
  if(n < 10000) return Math.round(n/50)*50;
  return Math.round(n/500)*500;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ==========================================================================
   State
   ========================================================================== */
const STORE_KEY = 'mosh.packaging-agent.v1';
let storageOK = true;

function blankFeature(){ return { t:'', d:'' }; }

const DEFAULTS = {
  name: '',
  tagline: '',
  category: 'ai_agent',
  audiences: ['entrepreneurs', 'small_businesses'],
  problem: '',
  outcome: '',
  features: [blankFeature(), blankFeature(), blankFeature()],
  includes: { prompts:true, code:false, docs:true, templates:true, examples:true, assets:false, videos:false },
  complexity: 3,
  setupMinutes: 15,
  needsKey: false,
  needsInstall: false,
  runtime: 'claude',
  demand: 4,
  competition: 3,
  pain: 4,
  budget: 3,
  fx: 12,
  localPct: 60,
  fees: { gumroad:10, selar:5, paystack:1.95, shopify:2.9 },
  studio: 'MOSH Digital Studios',
  contact: 'hello@moshdigitalstudios.com',
  site: 'moshdigitalstudios.com',
  whatsapp: '',
  year: new Date().getFullYear()
};

let S = JSON.parse(JSON.stringify(DEFAULTS));

function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); }
  catch(e){ storageOK = false; return; }
  if(!raw) return;
  try {
    const parsed = JSON.parse(raw);
    S = repair(parsed);
  } catch(e){
    // A corrupt saved file is repaired to defaults rather than crashing the app.
    S = JSON.parse(JSON.stringify(DEFAULTS));
    setTimeout(() => toast('Saved data was unreadable — started from defaults'), 400);
  }
}

/** Merge anything shaped roughly right onto defaults; drop anything that isn't. */
function repair(o){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  if(!o || typeof o !== 'object') return d;
  const str = (v, f) => (typeof v === 'string' ? v : f);
  const num = (v, f, lo, hi) => (typeof v === 'number' && isFinite(v) ? clamp(v, lo, hi) : f);
  const bool = (v, f) => (typeof v === 'boolean' ? v : f);
  d.name = str(o.name, d.name).slice(0, 90);
  d.tagline = str(o.tagline, d.tagline).slice(0, 200);
  d.category = CATEGORIES[o.category] ? o.category : d.category;
  d.audiences = Array.isArray(o.audiences) ? o.audiences.filter(a => AUDIENCES[a]) : d.audiences;
  if(!d.audiences.length) d.audiences = ['entrepreneurs'];
  d.problem = str(o.problem, d.problem).slice(0, 600);
  d.outcome = str(o.outcome, d.outcome).slice(0, 600);
  if(Array.isArray(o.features)){
    d.features = o.features.slice(0, 14).map(f => ({
      t: str(f && f.t, '').slice(0, 90),
      d: str(f && f.d, '').slice(0, 240)
    }));
  }
  while(d.features.length < 3) d.features.push(blankFeature());
  if(o.includes && typeof o.includes === 'object'){
    Object.keys(d.includes).forEach(k => { d.includes[k] = bool(o.includes[k], d.includes[k]); });
  }
  d.complexity = num(o.complexity, d.complexity, 1, 5);
  d.setupMinutes = num(o.setupMinutes, d.setupMinutes, 1, 480);
  d.needsKey = bool(o.needsKey, d.needsKey);
  d.needsInstall = bool(o.needsInstall, d.needsInstall);
  d.runtime = RUNTIMES[o.runtime] ? o.runtime : d.runtime;
  d.demand = num(o.demand, d.demand, 1, 5);
  d.competition = num(o.competition, d.competition, 1, 5);
  d.pain = num(o.pain, d.pain, 1, 5);
  d.budget = num(o.budget, d.budget, 1, 5);
  d.fx = num(o.fx, d.fx, 0.01, 10000);

  if(o.fees && typeof o.fees === 'object'){
    Object.keys(d.fees).forEach(k => { d.fees[k] = num(o.fees[k], d.fees[k], 0, 90); });

}

/* ---------- download plumbing (all local, no network) ---------- */
function download(filename, data, mime){
  const blob = (data instanceof Blob) ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function copyText(text, label){
  const done = () => toast((label || 'Copied') + ' — ' + text.length.toLocaleString() + ' characters');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('Copy failed — select the text and copy manually'); }
  ta.remove();
}

<script>
"use strict";
/* ==========================================================================
   Phase 1 — analysis
   Everything downstream reads P and only P. Build it once per render, and
   the listing, the SEO, the posts and the PDFs cannot drift apart.
   ========================================================================== */

let P = null;

function defaultProblem(cat, aud){
  return 'doing this by hand every time, which is why ' + aud.p + ' ' + aud.ctx + ' keep putting it off';
}

function normPhrase(s, fallback){
  let t = String(s || '').trim();
  if(!t) return fallback;
  t = t.replace(/^(the\s+)?problem\s+(is|being)\s*:?\s*/i, '')
       .replace(/^(it\s+)?(helps|lets|allows)\s+you\s+/i, '')
       .replace(/\s+/g, ' ');
  return lower1(stripDot(t));
}

function derive(){
  const cat = CATEGORIES[S.category] || CATEGORIES.ai_agent;
  const auds = (S.audiences.length ? S.audiences : ['entrepreneurs']).map(a => AUDIENCES[a]).filter(Boolean);
  const aud = auds[0] || AUDIENCES.entrepreneurs;
  const name = (S.name || '').trim() || 'Untitled ' + cap(cat.label);
  const rt = RUNTIMES[S.runtime] || RUNTIMES.claude;

  const feats = S.features
    .map(f => ({ t: stripDot((f.t || '').trim()), d: (f.d || '').trim() }))
    .filter(f => f.t);
  const padded = feats.slice();
  for(let i = 0; padded.length < 3; i++){
    padded.push({ t: cap(cat.useCases[i % cat.useCases.length]), d: 'Included as a worked example you can run unchanged.' });
  }

  const n = v => (clamp(v, 1, 5) - 1) / 4;
  const readiness = (['prompts','code','docs','templates','examples','assets','videos']
    .filter(k => S.includes[k]).length) / 7;
  const scoreRaw = 100 * (
    0.28 * n(S.demand) +
    0.24 * n(S.pain) +
    0.20 * n(S.budget) +
    0.18 * (1 - n(S.competition)) +
    0.10 * readiness
  );
  const score = Math.round(scoreRaw);
  const band = score >= 75 ? { k:'priority', label:'Priority build', cls:'good', note:'Wanted, painful, funded, and not crowded. Build the full ladder and launch it properly.' }
             : score >= 55 ? { k:'strong',   label:'Strong',        cls:'good', note:'Worth the whole package. Expect to earn the top two tiers rather than assume them.' }
             : score >= 35 ? { k:'workable', label:'Workable',      cls:'warn', note:'Sellable, but the price ladder should start low and the free lead magnet does most of the work.' }
             :               { k:'thin',     label:'Thin',          cls:'bad',  note:'Either the demand, the pain or the budget is missing. Package it as a lead magnet and a starter tier, and sell the tier above it as a service.' };

  const complexityLabel = ['Trivial','Simple','Moderate','Involved','Deep'][clamp(S.complexity,1,5) - 1];

  const P0 = {
    S, cat, auds, aud, rt, name, score, band, readiness, complexityLabel,
    safe: fileSafe(name),
    slug: slug(name),
    seed: name + '|' + S.category + '|' + S.audiences.join(','),
    catLabel: cat.label,
    unit: cat.unit,
    art: cat.art,
    audP: joinList(auds.map(a => a.p)),
    audPShort: joinList(auds.slice(0,3).map(a => a.p)),
    audLabels: auds.map(a => a.label),
    features: padded,
    userFeatureCount: feats.length,
    featureTitles: padded.map(f => lower1(f.t)),
    problem: normPhrase(S.problem, defaultProblem(cat, aud)),
    outcome: normPhrase(S.outcome, cat.outcomes[0]),
    tagline: normPhrase(S.tagline, cat.does),
    setup: Math.round(S.setupMinutes),
    ghana: S.audiences.indexOf('ghana_business') >= 0 || S.audiences.indexOf('african_creators') >= 0
  };

  P0.tiers = buildTiers(P0);
  P0.manifest = buildManifest(P0);
  P0.fileCount = P0.manifest.length;
  P0.folderCount = uniq(P0.manifest.map(f => f.folder).filter(Boolean)).length;

  P0.valueProp = buildValueProp(P0);
  P0.desc50  = buildDesc(P0, 50);
  P0.desc150 = buildDesc(P0, 150);
  P0.desc500 = buildDesc(P0, 500);
  return P0;
}

/* ---------- the four descriptions ---------- */

function buildValueProp(p){
  const does = clause(p.tagline, 15);
  const pain = clause(p.problem, 11);
  const gain = clause(p.outcome, 12);
  const who = clause(p.audPShort, 8);
  const frames = [
    `${p.name} is ${p.art} ${p.catLabel} that ${does}, so ${who} can stop ${pain}.`,
    `${p.name} turns ${pain} into ${gain} — ${p.art} ${p.catLabel} built for ${who}.`,
    `For ${who}: ${p.art} ${p.catLabel} that ${does} instead of leaving you ${pain}.`
  ];
  return pick(p.seed + '|vp', frames).replace(/\s+/g, ' ');
}

/** Sentences ranked by how much they earn their place, longest-first-ish. */
function descPool(p){
  const f = p.features;
  const inc = p.S.includes;
  const parts = [];
  const has = k => inc[k];
  if(has('prompts')) parts.push('the prompts');
  if(has('code')) parts.push('the full source');
  if(has('templates')) parts.push('the templates');

    `Every file is editable, so it becomes yours rather than staying ours.`,
    `Nothing here is a subscription: you pay once and the files are on your own device.`,
    `Where a person still has to check the work (${p.cat.gate}), the documentation says so instead of pretending otherwise.`,
    `One thing will date it: ${p.cat.stale}. The licence says what happens then, and updates to this version are included.`,

    f[2] ? `${cap(f[2].t)}${f[2].d ? ' — ' + lower1(stripDot(f[2].d)) : ''}.` : '',

    `If you have never done this before, start at the ${p.tiers[0].name} tier and upgrade for the difference.`,
    `${cap(p.audP)} are the buyers this was written for; everyone else is welcome, but the examples will feel like someone else's business.`,
    `What you are buying is the afternoon you would otherwise spend finding this out yourself.`
  ].filter(Boolean);

  /* Sales-page sentences: only the long description has room for them. */
  const long = [
    `The honest comparison is not against a competitor, it is against carrying on as you are — and carrying on as you are costs ${p.aud.p === 'agencies' ? 'a junior\'s week' : 'the evening you keep spending on it'}.`,
    `Three tiers exist because three different people buy this: one wants the ${p.unit} and nothing else, one wants the system around it, and one wants it installed and running by Friday.`,
    `The ${p.tiers[3].name} tier is a service, not a download — ${lower1(p.tiers[3].adds)} — and it is priced like one.`,
    `Delivery is instant on every tier, and the licence for the tier you bought is inside the folder, not on a page you have to find again.`,
    `${cap(p.aud.s)}s who bought the tier below can upgrade for the difference at any point, so starting small costs nothing later.`,
    `The documentation is written for the version you download, and the changelog says what changed and when.`,
    `If ${p.cat.stale}, that is a maintenance job rather than a surprise, and the update note will say which files moved.`,
    `Nothing in this package makes a claim about what you will earn with it, because nobody selling you a file can know that.`,
    `What it does claim is specific and checkable: ${p.fileCount} files, ${p.folderCount} folders, ${p.setup} minutes to first result, and ${lower1(p.cat.ships)}.`,
    `Read the tier table, pick the row that matches how you work, and the rest of the page is optional.`
  ];

  /* Short, true, and there to land the word count exactly. */
  const tail = [
    'It works offline.',
    'You own what you make with it.',
    'One payment, no subscription.',
    'Updates are included on the tier you bought.',
    'Nothing is hidden until after checkout.',
    'It is written in plain English.',
    'Everything is editable.',
    'The examples are real, not filler.',
    'Support is by email, and answered by a person.',
    'It takes an afternoon to get value from it.',
    'The file list is on the page above.',
    'There is a free sample before you commit.'
  ];
  return { core, body, long, tail };
}

/**
 * Assemble a description of a target length by adding whole sentences that
 * fit. Never truncates mid-sentence; the self-check asserts the result lands
 * inside the tolerance, so a pool that cannot reach the target is a bug that
 * shows up in the footer rather than in a listing.
 */
function fitTo(target, tol, must, optional){
  const out = must.slice();
  const total = () => out.reduce((s, x) => s + wc(x), 0);
  for(const s of optional){
    const t = total();
    if(t >= target - tol) break;
    if(t + wc(s) <= target + tol) out.push(s);
  }
  return out;
}

function buildDesc(p, target){
  const pool = descPool(p);
  const tol = Math.max(4, Math.round(target * 0.06));
  if(target <= 60){
    const must = [pool.core[0]];
    return fitTo(target, tol, must, pool.core.slice(1).concat(pool.body.slice(0, 4), pool.tail)).join(' ');
  }
  if(target <= 200){
    return fitTo(target, tol, pool.core, pool.body.concat(pool.tail)).join(' ');
  }
  /* The 500: same sentences, but paragraphed, because nobody reads a wall. */
  const chosen = fitTo(target, tol, pool.core, pool.body.concat(pool.long, pool.tail));
  const paras = [];
  const per = Math.ceil(chosen.length / 5);
  for(let i = 0; i < chosen.length; i += per) paras.push(chosen.slice(i, i + per).join(' '));
  return paras.join('\n\n');
}

    };
  });
  return tiers;
}

<script>

function mdList(items){ return items.map(i => '- ' + i).join('\n'); }
function mdNum(items){ return items.map((i, n) => (n+1) + '. ' + i).join('\n'); }
function mdTable(head, rows){
  const h = '| ' + head.join(' | ') + ' |';
  const s = '|' + head.map(() => '---').join('|') + '|';
  const b = rows.map(r => '| ' + r.join(' | ') + ' |').join('\n');

}

/** Trim to a hard character limit at a word boundary. Stores truncate mid-word; this doesn't. */
function fit(s, max){
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if(s.length <= max) return s;
  const cut = s.slice(0, max);
  const sp = cut.lastIndexOf(' ');
  return (sp > max * 0.6 ? cut.slice(0, sp) : cut).replace(/[\s,;:—-]+$/, '');
}

/**
 * Shorten a phrase to a character limit without leaving it dangling. Drops
 * whole trailing clauses first ("…within a minute, in your own" becomes
 * "…within a minute"), and only cuts at a word boundary when even the first
 * clause is too long. A store field that ends mid-thought reads as broken,
 * and buyers are right to read it that way.
 */
function fitPhrase(s, max){
  const t = String(s || '').replace(/\s+/g, ' ').trim();
  if(t.length <= max) return stripDot(t);
  const parts = t.split(/,\s*/);
  for(let i = parts.length - 1; i > 0; i--){
    const kept = parts.slice(0, i).join(', ');
    if(kept.length <= max) return stripDot(kept);
  }
  return stripDot(fit(t, max));
}

/** Try each phrasing in turn and take the first that fits the field. */
function pickFit(candidates, max){
  for(const c of candidates){ if(c.length <= max) return c; }
  return fitPhrase(candidates[candidates.length - 1], max);
}

<script>
"use strict";
/* ==========================================================================
   Phase 7 — SEO, and Phase 6 — 50 social posts
   ========================================================================== */

function seoRoots(p){
  return uniq(p.cat.kw.concat([
    p.catLabel.toLowerCase(),
    slug(p.name).replace(/-/g, ' '),
    p.unit + ' for ' + p.aud.p
  ])).filter(Boolean);
}

function seoKeywords(p){
  const roots = seoRoots(p);
  const primary = [], secondary = [], longtail = [];

  /* Primary: the root plus what a buyer types when they already know what they want. */
  roots.forEach(r => primary.push(r));
  for(const mod of INTENT_MODS){
    for(const r of roots){
      const k = (mod === 'best' || mod === 'free trial alternative') ? (mod + ' ' + r) : (r + ' ' + mod);
      if(primary.indexOf(k) < 0) primary.push(k);
      if(primary.length >= 50) break;
    }
    if(primary.length >= 50) break;
  }

  /* Secondary: who and where. Lower volume, far higher intent. */
  const buyerPool = uniq(p.auds.map(a => 'for ' + a.p).concat(BUYER_MODS));
  for(const b of buyerPool){
    for(const r of roots){
      const k = r + ' ' + b;
      if(secondary.indexOf(k) < 0) secondary.push(k);
      if(secondary.length >= 30) break;
    }
    if(secondary.length >= 30) break;
  }
  const places = p.ghana ? PLACE_MODS : PLACE_MODS.slice(2).concat(PLACE_MODS.slice(0,2));
  for(const pl of places){
    for(const r of roots){
      const k = r + ' ' + pl;
      if(secondary.indexOf(k) < 0) secondary.push(k);
      if(secondary.length >= 50) break;
    }
    if(secondary.length >= 50) break;
  }

  /* Long tail: whole questions. Fewest searches, most sales. */
  const verb = stripDot(lower1(p.cat.outcomes[0]));
  const pain = stripDot(p.problem).split(',')[0];
  const buyers = uniq(p.auds.map(a => a.p).concat(['small businesses','freelancers']));
  for(let i = 0; i < LONGTAIL_FRAMES.length && longtail.length < 20; i++){
    const reps = LONGTAIL_FRAMES[i].indexOf('{buyer}') >= 0 ? Math.min(2, buyers.length) : 1;
    for(let j = 0; j < reps && longtail.length < 20; j++){
      const k = LONGTAIL_FRAMES[i]
        .replace('{verb}', verb)
        .replace('{pain}', pain)
        .replace('{cat}', p.catLabel.toLowerCase())
        .replace('{a_cat}', p.art + ' ' + p.catLabel.toLowerCase())
        .replace('{buyer}', buyers[j % buyers.length]);
      if(longtail.indexOf(k) < 0) longtail.push(k);
    }
  }

  const intentOf = k =>
    /^(how|what|is|why)/.test(k) ? 'informational'
    : /(buy|download|price|cost|pdf|kit|pack)/.test(k) ? 'transactional'
    : /(best|vs|worth|template|tool|for )/.test(k) ? 'commercial'
    : 'commercial';
  const placeOf = (k, group) =>
    group === 'primary' ? (k.length < 26 ? 'Title, H1, store tags' : 'Body copy, product tags')
    : group === 'secondary' ? 'Collection pages, store tags, alt text'
    : 'Blog posts, FAQ headings, YouTube titles';

  const mark = (arr, g) => arr.slice(0, g === 'longtail' ? 20 : 50)
    .map(k => ({ k, group:g, intent:intentOf(k), place:placeOf(k, g) }));

  return { primary: mark(primary,'primary'), secondary: mark(secondary,'secondary'), longtail: mark(longtail,'longtail') };
}

function seoMeta(p){
  const h = shopify(p);
  return {
    title: h.seoTitle,
    desc: h.seoDesc,
    og: h.ogDesc,
    tags: gumroad(p).tags,
    slug: p.slug,
    h1: pickFit([cap(p.outcome) + ' — ' + p.name, fitPhrase(cap(p.outcome), 44) + ' — ' + p.name, p.name], 70),
    alt: fitPhrase(p.name + ' — ' + p.catLabel + ' cover showing ' + p.fileCount + ' included files', 120)
  };
}

GEN.seoCsv = p => {
  const kw = seoKeywords(p);
  const rows = kw.primary.concat(kw.secondary, kw.longtail);
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  return 'keyword,group,intent,where_to_use\n' +
    rows.map(r => [q(r.k), r.group, r.intent, q(r.place)].join(',')).join('\n') + '\n';
};

GEN.seoMeta = p => {
  const m = seoMeta(p);
  const kw = seoKeywords(p);
  return docHeader(p, 'SEO metadata') +
`${mdTable(['Field','Value','Limit'], [
  ['SEO title', m.title, m.title.length + '/60'],
  ['Meta description', m.desc, m.desc.length + '/160'],

])}

**Product tags**: ${m.tags.join(', ')}

## Keywords

${kw.primary.length} primary, ${kw.secondary.length} secondary, ${kw.longtail.length} long-tail —
the full list with intent and placement is in \`SEO_Keywords.csv\`.

### The ten that matter most

${mdList(kw.primary.slice(0,5).map(x => '`' + x.k + '` — ' + x.intent + ' · ' + x.place)
  .concat(kw.longtail.slice(0,5).map(x => '`' + x.k + '` — ' + x.intent + ' · ' + x.place)))}

## How to actually use these

${mdNum([
  'One keyword per page. A page targeting six ranks for none.',
  'Primary keywords go in the title and the H1 of the product page. Nowhere else needs them.',
  'Secondary keywords are collection pages: one page per buyer type, one per country you sell into.',
  'Long-tail keywords are questions, so answer them — one FAQ heading or one blog post each. These convert far better than the head terms and are the only ones a new store can win.',
  'Never stuff. A store page that reads like a keyword list converts worse than one that reads like a person, and search engines have been able to tell for a decade.'
])}
` + docFooter(p);
};

/* ==========================================================================
   Phase 6 — social content
   Ten angles per platform, one post per angle. No platform repeats an
   argument; no two platforms say it the same way.

function angleContent(p, key){
  const t0 = p.tiers[0], t2 = p.tiers[2];
  const map = {
    problem: {
      hook: cap(p.problem) + '.',
      body: 'That is not a discipline problem. It is a missing tool. ' + p.name + ' is ' + p.art + ' ' + p.catLabel + ' that ' + p.tagline + '.',
      cta: 'Link below.'
    },
    cost: {
      hook: 'The job takes about ' + (p.setup + 140) + ' minutes by hand.',
      body: 'With ' + p.name + ' it takes about ' + (p.setup + 20) + '. That is roughly ' + Math.round((120)/60) + ' hours a week back if you do it twice — and the two hours were never the interesting part of the work.',
      cta: 'From ' + usd(t0.usd) + '.'
    },
    before: {
      hook: 'Before: ' + p.problem + '. After: ' + p.outcome + '.',
      body: 'Same person, same job, different starting point. ' + p.fileCount + ' files, ' + p.folderCount + ' folders, about ' + p.setup + ' minutes to set up.',
      cta: 'Get it: link in bio.'
    },
    usecase: {
      hook: cap(p.cat.useCases[0]) + ' — in one pass.',
      body: 'One prompt, your real material, and a list at the end of everything you need to check before it goes out. That last part is why the output is usable.',
      cta: 'See the whole file list before you buy.'
    },
    objection: {
      hook: '"' + OBJECTIONS[0].q + '"',
      body: OBJECTIONS[0].a,
      cta: usd(t0.usd) + ' to skip the afternoon.'
    },
    teach: {
      hook: 'Free tip, no purchase needed:',
      body: 'Paste the material, do not describe it. A summary of your input is an invitation for the model to invent the rest — and it will accept, confidently. That one habit fixes most bad output.',
      cta: 'More of this in ' + p.name + '.'
    },
    proof: {
      hook: 'What is actually in it:',
      body: p.fileCount + ' files across ' + p.folderCount + ' folders — ' + joinList(p.featureTitles.slice(0,3)) + ', documentation, three licences, worked examples. Listed in full on the page before you pay.',
      cta: 'Nothing hidden until checkout.'
    },
    audience: {
      hook: 'For ' + p.aud.p + ' ' + p.aud.ctx + ':',
      body: 'You want ' + p.aud.wants + '. This is the part of that you can buy today, for ' + usd(t0.usd) + ', and use this afternoon.',
      cta: 'Not for everyone. Probably for you.'
    },
    price: {
      hook: 'Why ' + usd(t0.usd) + ' and not free:',
      body: 'Free would mean ' + p.fileCount + ' files nobody opens. The price is roughly one hour of what ' + p.aud.p + ' charge — and it removes rather more than one hour.',
      cta: p.tiers[1].name + ' at ' + usd(p.tiers[1].usd) + ' adds the commercial licence.'
    },
    offer: {
      hook: p.name + ' — ' + usd(t0.usd) + '.',
      body: cap(p.valueProp),
      cta: p.ghana ? 'Pay with MoMo. Download immediately.' : 'Instant download. One payment, no subscription.'
    }
  };
  return map[key];
}

function socialPosts(p){
  const out = { facebook:[], instagram:[], linkedin:[], x:[], whatsapp:[] };
  const tagPool = uniq(gumroad(p).tags.map(t => '#' + t.replace(/[^a-z0-9]+/gi, '')));
  const link = p.S.site ? p.S.site + '/' + p.slug : '[YOUR LINK]';

  ANGLES.forEach((a, i) => {
    const c = angleContent(p, a.key);

    out.facebook.push(
      `${c.hook}\n\n${c.body}\n\n${c.cta}\n\n👉 ${link}`
    );

    out.instagram.push(
      `${c.hook}\n\n${c.body}\n\n${c.cta}\n\n.\n.\n${rotate(tagPool, i).slice(0,7).join(' ')}`
    );

    out.linkedin.push(
      `${c.hook}\n\n${c.body}\n\n` +
      `Concretely: ${p.fileCount} files, ${p.folderCount} folders, about ${p.setup} minutes to a first result. ` +
      `Where a person still has to check the work — ${p.cat.gate} — the documentation says so rather than pretending otherwise.\n\n` +
      `${c.cta}\n${link}`
    );

    out.x.push(fit(`${c.hook}\n\n${c.body}\n\n${link}`, 280));

    out.whatsapp.push(
      `*${fitPhrase(c.hook, 70)}*\n\n${fitPhrase(c.body, 220)}\n\n${p.ghana ? 'Pay with MoMo — ' + ghs(p.tiers[0].ghsLocal) : c.cta}\n${link}`
    );
  });
  return out;
}

};

function funnel(p){
  const t = p.tiers;
  const stages = [
    { n:'Free lead magnet', price:'Free', offer:'“' + fitPhrase(cap(p.cat.useCases[0]), 40) + ' — the one-page method”',
      what:'The first prompt from the library, the workflow table, and the VERIFY habit. Genuinely useful alone.',
      job:'Earn the email address by solving something small today', conv:'20–35% of page visitors' },
    { n:'Low-ticket', price:usd(t[0].usd), offer:t[0].name + ' tier',
      what:t[0].adds + '.',
      job:'Turn a reader into a customer. The first purchase is the hard one; its size is not the point', conv:'3–8% of the list within 14 days' },
    { n:'Core product', price:usd(t[1].usd), offer:t[1].name + ' tier',
      what:t[1].adds + '.',
      job:'The product this whole funnel exists to sell', conv:'25–40% of Starter buyers, within 30 days' },
    { n:'Premium bundle', price:usd(t[2].usd), offer:t[2].name + ' tier + setup call',

      what:t[3].adds + '.',
      job:'Where the margin is. One of these is worth ' + Math.round(t[3].usd / t[0].usd) + ' Starter sales', conv:'1–3% of Premium buyers' }
  ];

  const landing = {
    headline: pick(p.seed + '|hl', [
      cap(p.outcome) + ' — without ' + p.problem + '.',
      cap(p.problem) + '? Here is the afternoon back.',
      cap(p.outcome) + ', in about ' + p.setup + ' minutes.'
    ]),
    sub: fitPhrase(p.valueProp, 180),
    bullets: p.features.slice(0,5).map(f => cap(f.t) + (f.d ? ' — ' + lower1(stripDot(f.d)) : '')),

  const upsells = [
    { at:'Immediately after checkout', name:'The ' + t[2].name + ' upgrade', price:usd(t[2].usd - t[1].usd),
      copy:'You have the ' + t[1].name + ' tier. For ' + usd(t[2].usd - t[1].usd) + ' — the difference, not the price — add ' + lower1(t[2].adds) + '. This offer is on this page only because after today it costs full price, not because a timer says so.' },
    { at:'Thank-you page', name:'60-minute setup call', price:usd(charm(t[1].usd * 1.5)),

      copy:'If you are delivering this to clients, the commercial licence covers five. The agency licence covers all of them, plus installing it in their environments.' }
  ];

  const downsells = [

      copy:'Not ready for the whole system? Take the ' + t[0].name + ' tier — the ' + p.unit + ' and the documentation, ' + usd(t[0].usd) + '. Upgrade for the difference whenever you want.' },
    { at:'Declined upsell', name:'Payment plan on ' + t[2].name, price:'2 × ' + usd(Math.ceil(t[2].usd / 2)),
      copy:'Same tier, two payments, a month apart. Nothing is withheld — the whole download arrives on the first payment.' }
  ];

  const bumps = [
    { name:'Add the four template families', price:usd(charm(Math.max(9, t[1].usd - t[0].usd))),
      copy:'Tick to add the prompt, workflow, SOP and automation templates — the difference between using it once and running it every week.' },

  return { stages, landing, upsells, downsells, bumps, emails };
}

<script>
"use strict";
/* ==========================================================================
   Export
   Three writers, none of them a library: Markdown, PDF and ZIP. The PDF
   writer emits PDF 1.4 with the base-14 fonts; the ZIP writer emits stored
   (uncompressed) entries with real CRC-32s. Both run in the page, offline.
   ========================================================================== */

/* ---------- file contents on demand ---------- */
function fileContent(p, entry){
  if(entry.gen.indexOf('pdf:') === 0){
    const base = entry.gen.slice(4);
    const src = { Quick_Start_Guide:'quickstart', Installation_Guide:'install', User_Manual:'manual', FAQ:'faq', Troubleshooting_Guide:'trouble' }[base];
    return { pdf: true, md: GEN[src](p), title: base.replace(/_/g, ' ') };
  }
  const fn = GEN[entry.gen];
  return { pdf: false, md: fn ? fn(p) : '(no generator for ' + entry.gen + ')' };
}

/* ==========================================================================
   PDF — written by hand, because a 40 KB dependency for five documents is a
   dependency you have to keep, and this file has none.
   ========================================================================== */

/* Latin-1 is what the base-14 fonts encode; anything else is transliterated
   rather than silently dropped. */
const PDF_TRANS = [
  [/[‘’‛]/g, "'"], [/[“”]/g, '"'], [/—/g, '--'], [/–/g, '-'],
  [/…/g, '...'], [/·/g, '-'], [/→/g, '->'], [/✓/g, 'v'], [/[•]/g, '-'],
  [/ /g, ' '], [/[\u{1F300}-\u{1FAFF}☀-➿]/gu, '']
];
function pdfText(s){
  let t = String(s == null ? '' : s);
  PDF_TRANS.forEach(([re, to]) => { t = t.replace(re, to); });
  return t.replace(/[^\x09\x0a\x20-\xFF]/g, '?');
}
function pdfEsc(s){ return s.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }

/* Average glyph widths are good enough for wrapping and exact for Courier. */
const PDF_W = { F1: 0.50, F2: 0.535, F3: 0.60 };
function pdfWrap(text, font, size, maxW){
  const per = PDF_W[font] * size;
  const max = Math.max(8, Math.floor(maxW / per));
  const out = [];
  String(text).split('\n').forEach(line => {
    if(line.length <= max){ out.push(line); return; }
    let cur = '';
    line.split(' ').forEach(w => {
      if(!cur.length){ cur = w; return; }
      if((cur + ' ' + w).length <= max){ cur += ' ' + w; }
      else { out.push(cur); cur = w; }
    });
    if(cur.length) out.push(cur);
  });
  return out;
}

/** Markdown (the subset these documents use) → a flat list of typeset lines. */
function mdToBlocks(md){
  const blocks = [];
  let inCode = false;
  md.split('\n').forEach(raw => {
    const line = raw.replace(/\t/g, '  ');
    if(/^```/.test(line.trim())){ inCode = !inCode; blocks.push({ t:'rule-thin' }); return; }
    if(inCode){ blocks.push({ t:'code', s:line }); return; }
    if(/^\s*$/.test(line)){ blocks.push({ t:'gap' }); return; }
    if(/^# /.test(line)){ blocks.push({ t:'h1', s:line.slice(2) }); return; }
    if(/^## /.test(line)){ blocks.push({ t:'h2', s:line.slice(3) }); return; }
    if(/^### /.test(line)){ blocks.push({ t:'h3', s:line.slice(4) }); return; }
    if(/^\s*\|/.test(line)){
      if(/^\s*\|[\s:|-]+\|\s*$/.test(line)){ blocks.push({ t:'rule-thin' }); return; }
      blocks.push({ t:'table', s:line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim()).join('  |  ') });
      return;
    }
    if(/^---+$/.test(line.trim())){ blocks.push({ t:'rule' }); return; }
    if(/^> /.test(line)){ blocks.push({ t:'quote', s:line.slice(2) }); return; }
    if(/^\s*[-*] /.test(line)){ blocks.push({ t:'li', s:line.replace(/^\s*[-*] /, '') }); return; }
    if(/^\s*\d+\. /.test(line)){ blocks.push({ t:'li', s:line.trim() }); return; }
    blocks.push({ t:'p', s:line });
  });
  return blocks;
}
function stripInline(s){
  return String(s).replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1')
    .replace(/`(.+?)`/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
}

function buildPDF(title, md, footerText){
  const PW = 595.28, PH = 841.89, M = 54, MAXW = PW - M*2;
  const STYLE = {
    h1:{f:'F2', s:19, lead:24, before:10, after:8},
    h2:{f:'F2', s:13.5, lead:18, before:14, after:5},
    h3:{f:'F2', s:11, lead:15, before:10, after:3},
    p:{f:'F1', s:10, lead:14.2, before:0, after:4},
    li:{f:'F1', s:10, lead:14.2, before:0, after:1, indent:14, bullet:true},
    quote:{f:'F1', s:10, lead:14.2, before:4, after:4, indent:14},
    code:{f:'F3', s:8.6, lead:11.6, before:0, after:0, indent:10},
    table:{f:'F3', s:8.2, lead:11.4, before:0, after:0, indent:0}
  };
  const pages = [];
  let cur = [], y = PH - M;
  const newPage = () => { pages.push(cur); cur = []; y = PH - M; };
  const put = (font, size, x, yy, text) => cur.push({ font, size, x, y: yy, text });

  mdToBlocks(md).forEach(b => {
    if(b.t === 'gap'){ y -= 5; return; }
    if(b.t === 'rule' || b.t === 'rule-thin'){ y -= (b.t === 'rule' ? 8 : 4); return; }
    const st = STYLE[b.t] || STYLE.p;
    const text = (b.t === 'code' || b.t === 'table') ? b.s : stripInline(b.s);
    const indent = st.indent || 0;
    const lines = pdfWrap(pdfText(text), st.f, st.s, MAXW - indent);
    y -= st.before;
    lines.forEach((ln, i) => {
      if(y < M + 28){ newPage(); }
      const prefix = (st.bullet && i === 0 && !/^\d+\./.test(ln)) ? '- ' : (st.bullet ? '  ' : '');
      put(st.f, st.s, M + indent, y, prefix + ln);
      y -= st.lead;
    });
    y -= st.after;
  });
  pages.push(cur);

  /* --- assemble the file, tracking byte offsets as we go --- */
  const objs = [];
  const nPages = pages.length;
  const pageObjIds = [], contentObjIds = [];
  for(let i = 0; i < nPages; i++){ pageObjIds.push(3 + i*2); contentObjIds.push(4 + i*2); }
  const fontBase = 3 + nPages*2;

  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = '<< /Type /Pages /Count ' + nPages + ' /Kids [' + pageObjIds.map(id => id + ' 0 R').join(' ') + '] >>';

  pages.forEach((items, i) => {
    const pid = pageObjIds[i], cid = contentObjIds[i];
    objs[pid] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW.toFixed(2) + ' ' + PH.toFixed(2) + ']' +
      ' /Resources << /Font << /F1 ' + fontBase + ' 0 R /F2 ' + (fontBase+1) + ' 0 R /F3 ' + (fontBase+2) + ' 0 R >> >>' +
      ' /Contents ' + cid + ' 0 R >>';
    let s = 'BT\n';
    let lastFont = '', lastSize = 0;
    items.forEach(it => {
      if(it.font !== lastFont || it.size !== lastSize){
        s += '/' + it.font + ' ' + it.size + ' Tf\n';
        lastFont = it.font; lastSize = it.size;
      }
      s += '1 0 0 1 ' + it.x.toFixed(2) + ' ' + it.y.toFixed(2) + ' Tm (' + pdfEsc(it.text) + ') Tj\n';
    });
    /* page footer */
    s += '/F1 7.5 Tf\n1 0 0 1 ' + M + ' ' + (M - 22) + ' Tm (' + pdfEsc(pdfText(footerText)) + ') Tj\n';
    s += '1 0 0 1 ' + (PW - M - 42) + ' ' + (M - 22) + ' Tm (' + pdfEsc('Page ' + (i+1) + ' of ' + nPages) + ') Tj\n';
    s += 'ET';
    objs[cid] = '<< /Length ' + s.length + ' >>\nstream\n' + s + '\nendstream';
  });

  objs[fontBase]     = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[fontBase + 1] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[fontBase + 2] = '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>';

  const maxObj = fontBase + 2;
  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = [];
  for(let i = 1; i <= maxObj; i++){
    offsets[i] = out.length;
    out += i + ' 0 obj\n' + (objs[i] || '<< >>') + '\nendobj\n';
  }
  const xref = out.length;
  out += 'xref\n0 ' + (maxObj + 1) + '\n0000000000 65535 f \n';
  for(let i = 1; i <= maxObj; i++){
    out += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  }
  out += 'trailer\n<< /Size ' + (maxObj + 1) + ' /Root 1 0 R /Info << /Title (' + pdfEsc(pdfText(title)) +
         ') /Producer (MOSH Packaging Agent) >> >>\nstartxref\n' + xref + '\n%%EOF';

  const bytes = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
  return bytes;
}

/* ==========================================================================
   ZIP — stored entries, real CRC-32, real central directory.
   ========================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;

})();
function crc32(bytes){
  let c = 0xFFFFFFFF;

}

  let offset = 0;

  const u16 = v => [v & 0xFF, (v >>> 8) & 0xFF];
  const u32 = v => [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF];
  const push = arr => { const b = new Uint8Array(arr); chunks.push(b); offset += b.length; };

  entries.forEach(e => {
    const nameBytes = enc.encode(e.name);
    const data = (e.data instanceof Uint8Array) ? e.data : enc.encode(String(e.data));
    const crc = data.length ? crc32(data) : 0;
    const start = offset;

    push([].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(now.time), u16(now.date),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0)));
    chunks.push(nameBytes); offset += nameBytes.length;
    if(data.length){ chunks.push(data); offset += data.length; }

    central.push({ nameBytes, crc, size: data.length, start, dir: !!e.dir });
  });

  const cdStart = offset;
  central.forEach(c => {
    push([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(now.time), u16(now.date),
      u32(c.crc), u32(c.size), u32(c.size), u16(c.nameBytes.length), u16(0), u16(0), u16(0), u16(0),
      u32(c.dir ? 0x10 : 0x20), u32(c.start)));
    chunks.push(c.nameBytes); offset += c.nameBytes.length;
  });
  const cdSize = offset - cdStart;
  push([].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(cdSize), u32(cdStart), u16(0)));

  return new Blob(chunks, { type: 'application/zip' });
}

/* ---------- what goes in the ZIP ---------- */
function packageEntries(p, opts){
  const root = p.safe + '_v1.0.0/';
  const entries = [{ name: root, dir: true, data: '' }];
  FOLDERS.forEach(f => entries.push({ name: root + f.id + '/', dir: true, data: '' }));

  p.manifest.forEach(m => {
    if(opts && opts.buyerOnly && m.ship !== 'buyer') return;
    if(opts && opts.tier && m.ship === 'buyer' && !(m.tier > 0 && m.tier <= opts.tier)) return;
    const c = fileContent(p, m);
    const path = root + (m.folder ? m.folder + '/' : '') + m.file;
    entries.push({ name: path, data: c.pdf ? buildPDF(c.title + ' — ' + p.name, c.md, p.name + ' · ' + p.S.studio) : c.md });
  });
  entries.push({ name: root + 'MANIFEST.txt', data: manifestText(p, opts) });
  return entries;
}

function manifestText(p, opts){
  const rows = p.manifest.filter(m => {
    if(opts && opts.buyerOnly && m.ship !== 'buyer') return false;
    if(opts && opts.tier && m.ship === 'buyer' && !(m.tier > 0 && m.tier <= opts.tier)) return false;
    return true;
  });
  const w = Math.max.apply(null, rows.map(r => (r.folder ? r.folder + '/' : '') + r.file).map(s => s.length));
  return p.name + ' v1.0.0 — manifest\n' +
    'Generated ' + new Date().toISOString().slice(0,10) + ' by the MOSH Packaging Agent\n' +
    (opts && opts.tier ? 'Tier: ' + p.tiers[opts.tier - 1].name + '\n' : '') +
    '\n' + rows.map(r => {
      const path = (r.folder ? r.folder + '/' : '') + r.file;
      return path.padEnd(w + 2) + (r.ship === 'buyer' ? 'ships to buyer' : 'studio only  ') +
             (r.ship === 'buyer' ? '  tier ' + r.tier + '+' : '');
    }).join('\n') + '\n\n' + rows.length + ' files.\n';
}

function treeText(p){
  const byFolder = {};
  p.manifest.forEach(m => { const k = m.folder || ''; (byFolder[k] = byFolder[k] || []).push(m); });
  let out = p.safe + '/\n';
  (byFolder[''] || []).forEach(m => { out += '├── ' + m.file + '\n'; });
  FOLDERS.forEach((f, i) => {
    const last = i === FOLDERS.length - 1;
    out += (last ? '└── ' : '├── ') + f.id + '/\n';
    const files = byFolder[f.id] || [];
    files.forEach((m, j) => {
      const lastF = j === files.length - 1;
      out += (last ? '    ' : '│   ') + (lastF ? '└── ' : '├── ') + m.file +
             (m.ship === 'studio' ? '   (studio only)' : '') + '\n';
    });
  });
  return out;
}

<script>
"use strict";
/* ==========================================================================
   Rendering — a small Markdown renderer so every generated document can be
   read on screen in the same form it will be pasted into a store.
   ========================================================================== */

function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
}

function mdToHtml(md){
  const lines = String(md).split('\n');
  const out = [];
  let i = 0, inCode = false, code = [];
  let listType = null, listBuf = [];
  const closeList = () => {
    if(listType){ out.push('<' + listType + '>' + listBuf.join('') + '</' + listType + '>'); listType = null; listBuf = []; }
  };
  while(i < lines.length){
    const line = lines[i];
    if(/^```/.test(line.trim())){
      if(inCode){
        out.push('<pre>' + esc(code.join('\n')) + '</pre>');
        code = []; inCode = false;
      } else { closeList(); inCode = true; }
      i++; continue;
    }
    if(inCode){ code.push(line); i++; continue; }

    if(/^\s*$/.test(line)){ closeList(); i++; continue; }
    if(/^#{1,4} /.test(line)){
      closeList();
      const lvl = line.match(/^#+/)[0].length;
      const h = Math.min(4, lvl + 1);
      out.push('<h' + h + '>' + inlineMd(line.replace(/^#+ /, '')) + '</h' + h + '>');
      i++; continue;
    }
    if(/^---+\s*$/.test(line)){ closeList(); out.push('<hr>'); i++; continue; }
    if(/^\s*\|/.test(line)){
      closeList();
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(rows.length > 1 && /^[\s:|-]+$/.test(rows[1].replace(/\|/g,'')) ? 2 : 1).map(cells);
      out.push('<div class="table-scroll"><table><thead><tr>' +
        head.map(h => '<th>' + inlineMd(h) + '</th>').join('') + '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    if(/^> /.test(line)){
      closeList();
      const buf = [];
      while(i < lines.length && /^> /.test(lines[i])){ buf.push(lines[i].slice(2)); i++; }
      out.push('<div class="note">' + inlineMd(buf.join(' ')) + '</div>');
      continue;
    }
    if(/^\s*[-*] /.test(line)){
      if(listType !== 'ul'){ closeList(); listType = 'ul'; }
      listBuf.push('<li>' + inlineMd(line.replace(/^\s*[-*] /, '')) + '</li>');
      i++; continue;
    }
    if(/^\s*\d+\. /.test(line)){
      if(listType !== 'ol'){ closeList(); listType = 'ol'; }
      listBuf.push('<li>' + inlineMd(line.replace(/^\s*\d+\. /, '')) + '</li>');
      i++; continue;
    }
    closeList();
    const buf = [];
    while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^```/.test(lines[i].trim()) &&
          !/^#{1,4} /.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^\s*[-*] /.test(lines[i]) &&
          !/^\s*\d+\. /.test(lines[i]) && !/^> /.test(lines[i]) && !/^---+\s*$/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + inlineMd(buf.join(' ')) + '</p>');
  }
  closeList();
  if(inCode && code.length) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
  return out.join('\n');
}

/** A generated document, rendered, with copy and download. */

function docCard(key, title, sub, md, filename){
  DOC_CACHE[key] = { md, filename };

function syncForm(){
  $$('#panel-product [data-k]').forEach(el => {
    const path = el.dataset.k.split('.');
    let v = S;
    path.forEach(k => { v = v[k]; });
    if(el.type === 'checkbox') el.checked = !!v;
    else el.value = v;
    if(el.type === 'range'){ const out = $('#val-' + el.dataset.k); if(out) out.textContent = v; }
  });
  $$('#panel-product [data-aud]').forEach(el => { el.checked = S.audiences.indexOf(el.dataset.aud) >= 0; });
  $$('#panel-product [data-inc]').forEach(el => { el.checked = !!S.includes[el.dataset.inc]; });
  $('#feature-rows').innerHTML = featureRowsHTML();
}

        ${p.tiers.map(t => `<tr><td>${esc(t.name)} ZIP</td><td class="num">${filesForTier(p, t.n).length}</td><td>${esc(t.adds)}</td></tr>`).join('')}
        <tr><td>Markdown</td><td class="num">1</td><td>All thirteen sections of the brief as one document, for reading or pasting into a doc</td></tr>
        <tr><td>Keywords CSV</td><td class="num">1</td><td>120 keywords with group, intent and placement</td></tr>
      </tbody></table></div>
    <p class="tiny muted" style="margin:12px 0 0">Five of the documentation files are exported as real
    PDFs as well as Markdown. They are typeset here — page breaks, headings, tables in Courier, page
    numbers and a footer — which is why they look like documents rather than printed web pages.</p>
  </div>

  <div class="card">
    <div class="card-hd"><h3>Your data</h3></div>
    <p class="small">Everything you typed is saved to this browser's <code>localStorage</code> and
    nowhere else. ${storageOK ? '' : '<strong>Storage is currently unavailable, so this session will not be saved.</strong>'}</p>
    <div class="btn-row">
      <button class="btn" type="button" id="btn-backup">⬇ Back up as JSON</button>
      <button class="btn" type="button" id="btn-restore">⬆ Restore from JSON</button>
      <button class="btn" type="button" id="btn-wipe">🗑 Clear everything</button>
    </div>
    <input type="file" id="file-restore" accept="application/json,.json" hidden>
    <p class="tiny muted" style="margin:12px 0 0">Clearing backs up first, then wipes. A corrupt or
    foreign JSON file is repaired onto the defaults rather than crashing the app.</p>
  </div>`;
}

function setPath(obj, path, value){
  const keys = path.split('.');
  let o = obj;
  for(let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
}

function onFormInput(e){
  const el = e.target;
  let touched = false;

  if(el.dataset && el.dataset.k){
    const k = el.dataset.k;
    if(el.type === 'checkbox') setPath(S, k, el.checked);
    else if(el.type === 'number' || el.type === 'range'){
      const v = parseFloat(el.value);
      if(isFinite(v)) setPath(S, k, v);
      if(el.type === 'range'){ const out = $('#val-' + k); if(out) out.textContent = el.value; }
    }
    else setPath(S, k, el.value);
    touched = true;
  }
  if(el.dataset && el.dataset.aud){
    const a = el.dataset.aud;
    if(el.checked){ if(S.audiences.indexOf(a) < 0) S.audiences.push(a); }
    else S.audiences = S.audiences.filter(x => x !== a);
    if(!S.audiences.length){ S.audiences = [a]; el.checked = true; toast('At least one audience is required'); }
    touched = true;
  }
  if(el.dataset && el.dataset.inc){ S.includes[el.dataset.inc] = el.checked; touched = true; }
  if(el.dataset && el.dataset.f !== undefined && el.dataset.fk){
    S.features[+el.dataset.f][el.dataset.fk] = el.value;
    touched = true;
  }
  if(touched){ S = repair(S); save(); renderAll(); }
}
