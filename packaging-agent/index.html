function tiersCsv(p){
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const head = ['tier','price_usd','price_ghs_local','price_ghs_converted','files_shipped','net_gumroad','net_selar','net_paystack','net_shopify','who_for','adds'];
  return head.join(',') + '\n' + p.tiers.map(t => [
    q(t.name), t.usd, t.ghsLocal, t.ghs, filesForTier(p, t.n).length,
    t.net.gumroad, t.net.selar, t.net.paystack, t.net.shopify, q(t.who), q(t.adds)
  ].join(',')).join('\n') + '\n';
}

function wire(){
  $('#panel-product').addEventListener('input', onFormInput);
  $('#panel-product').addEventListener('change', onFormInput);

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-seg],[data-copydoc],[data-dldoc],[data-copytext],[data-copy],[data-tierzip],[data-delf],button');
    if(!t) return;

    if(t.dataset.seg){
      if(t.dataset.seg === 'store') listingStore = t.dataset.val;
      if(t.dataset.seg === 'platform') socialPlat = t.dataset.val;
      renderTab(activeTab);
      return;
    }
    if(t.dataset.copydoc){ const d = DOC_CACHE[t.dataset.copydoc]; if(d) copyText(d.md, 'Copied'); return; }
    if(t.dataset.dldoc){ const d = DOC_CACHE[t.dataset.dldoc]; if(d) download(d.filename || 'document.md', d.md, 'text/markdown;charset=utf-8'); return; }
    if(t.dataset.copytext !== undefined && t.dataset.copytext !== ''){ copyText(t.dataset.copytext, 'Copied'); return; }
    if(t.dataset.copy === 'vp'){ copyText(P.valueProp, 'Value proposition copied'); return; }
    if(t.dataset.delf !== undefined){
      const i = +t.dataset.delf;
      if(S.features.length > 3){ S.features.splice(i, 1); save(); syncForm(); renderAll(); }
      return;
    }
    if(t.dataset.tierzip){
      const n = +t.dataset.tierzip;
      const blob = makeZip(packageEntries(P, { buyerOnly: true, tier: n }));
      download(P.safe + '_v1.0.0_' + P.tiers[n-1].name + '.zip', blob);
      toast(P.tiers[n-1].name + ' ZIP built — ' + filesForTier(P, n).length + ' files');
      return;
    }

    switch(t.id){
      case 'btn-theme': {
        const cur = document.documentElement.getAttribute('data-theme');
        const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        const next = dark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem(STORE_KEY + '.theme', next); } catch(err){}
        break;
      }
      case 'btn-example': loadExample(); break;
      case 'btn-clearform':
        S = JSON.parse(JSON.stringify(DEFAULTS)); save(); syncForm(); renderAll(); toast('Blank');
        break;
      case 'btn-addfeature':
        if(S.features.length < 14){ S.features.push(blankFeature()); save(); syncForm(); renderAll();
          const rows = $$('#feature-rows input[data-fk="t"]'); if(rows.length) rows[rows.length-1].focus(); }
        break;
      case 'btn-md':
        download(P.safe + '_complete_package.md', masterMarkdown(P), 'text/markdown;charset=utf-8');
        toast('Markdown built'); break;
      case 'btn-zip-all': {
        const blob = makeZip(packageEntries(P, {}));
        download(P.safe + '_v1.0.0_FULL.zip', blob);
        toast('Full package built — ' + P.fileCount + ' files'); break;
      }
      case 'btn-csv-kw': download(P.safe + '_keywords.csv', GEN.seoCsv(P), 'text/csv;charset=utf-8'); break;
      case 'btn-seocsv': download(P.safe + '_keywords.csv', GEN.seoCsv(P), 'text/csv;charset=utf-8'); break;
      case 'btn-csv-tiers': download(P.safe + '_tiers.csv', tiersCsv(P), 'text/csv;charset=utf-8'); break;
      case 'btn-backup':
        download('packaging-agent-backup-' + new Date().toISOString().slice(0,10) + '.json',
          JSON.stringify(S, null, 2), 'application/json'); break;
      case 'btn-restore': $('#file-restore').click(); break;
      case 'btn-wipe': {
        download('packaging-agent-backup-before-clear.json', JSON.stringify(S, null, 2), 'application/json');
        S = JSON.parse(JSON.stringify(DEFAULTS));
        try { localStorage.removeItem(STORE_KEY); } catch(err){}
        save(); syncForm(); renderAll(); toast('Cleared — a backup was downloaded first');
        break;
      }
    }
  });

  document.addEventListener('change', e => {
    if(e.target.id === 'file-pick'){ filePick = e.target.value; renderTab('files'); }
    if(e.target.id === 'file-restore'){
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try { S = repair(JSON.parse(r.result)); save(); syncForm(); renderAll(); toast('Restored'); }
        catch(err){ toast('That file could not be read as a backup'); }
      };
      r.readAsText(f);
      e.target.value = '';
    }
  });

  $('#tablist').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if(b) setTab(b.dataset.tab, false);
  });
  $('#tablist').addEventListener('keydown', e => {
    const i = TABS.findIndex(t => t.id === activeTab);
    if(e.key === 'ArrowRight'){ setTab(TABS[(i+1) % TABS.length].id, true); e.preventDefault(); }
    if(e.key === 'ArrowLeft'){ setTab(TABS[(i-1+TABS.length) % TABS.length].id, true); e.preventDefault(); }
    if(e.key === 'Home'){ setTab(TABS[0].id, true); e.preventDefault(); }
    if(e.key === 'End'){ setTab(TABS[TABS.length-1].id, true); e.preventDefault(); }
  });
}

/* ==========================================================================
   Self-check — runs at load, counts in the footer.
   The claims this file makes about itself are checked here, in the page,
   rather than asserted in a README nobody can run.
   ========================================================================== */
/* Words that cannot legitimately end a shortened field. "it" and "is" can —
   "leaves an audit trail behind it" is a finished thought — so they are not here. */
const DANGLING = /(,\s*$|\b(and|or|but|the|a|an|in|on|of|for|to|with|your|our|my|so|that|which|from|by)\s*[.!]?$)/i;

function selfTest(){
  let pass = 0;
  const fails = [];
  const ok = (cond, msg) => { if(cond) pass++; else fails.push(msg); };

  const savedS = JSON.parse(JSON.stringify(S));
  const build = patch => { S = repair(Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), patch || {})); return derive(); };

  /* --- helpers --- */
  ok(joinList(['a']) === 'a', 'joinList 1');
  ok(joinList(['a','b']) === 'a and b', 'joinList 2');
  ok(joinList(['a','b','c']) === 'a, b and c', 'joinList 3');
  ok(joinList(['a','b'],'or') === 'a or b', 'joinList or');
  ok(joinList([]) === '', 'joinList empty');
  ok(wc('one two three') === 3, 'wc');
  ok(wc('   ') === 0, 'wc blank');
  ok(slug('My Product! v2') === 'my-product-v2', 'slug');
  ok(fileSafe('My Product! v2') === 'My_Product_v2', 'fileSafe');
  ok(esc('<img onerror="x">') === '&lt;img onerror=&quot;x&quot;&gt;', 'esc');
  ok(charm(11) === 9 || charm(11) === 14, 'charm snaps to a real price point');
  ok(CHARM.indexOf(charm(137)) >= 0, 'charm returns a listed price');
  ok(charmGHS(87) % 5 === 0, 'charmGHS rounds under 100');
  ok(charmGHS(437) % 10 === 0, 'charmGHS rounds under 1000');
  ok(fit('one two three four', 10).length <= 10, 'fit respects the limit');
  ok(fit('one two three four', 10).indexOf('thr') < 0 || fit('one two three four',10) === 'one two', 'fit cuts at a word boundary');
  ok(fit('short', 40) === 'short', 'fit leaves short strings alone');
  ok(hash('a') === hash('a') && hash('a') !== hash('b'), 'hash is deterministic and discriminating');
  ok(pick('seed', [1,2,3]) === pick('seed', [1,2,3]), 'pick is deterministic');
  ok(rotate([1,2,3], 1).join() === '2,3,1', 'rotate');
  ok(usd(1500) === '$1,500', 'usd thousands');
  ok(ghs(1500) === 'GHS 1,500', 'ghs');

  /* --- fitTo never overshoots --- */
  const ft = fitTo(50, 4, ['one two three'], ['four five six seven eight', 'nine ten', 'a b c d e f g h i j k l m n o p q r s t u v w x y z']);
  ok(ft.reduce((s,x) => s + wc(x), 0) <= 54, 'fitTo respects the upper tolerance');

  /* --- repair --- */
  ok(repair(null).name === DEFAULTS.name, 'repair(null)');
  ok(repair({ category:'nonsense' }).category === DEFAULTS.category, 'repair rejects an unknown category');
  ok(repair({ audiences:['nope'] }).audiences.length === 1, 'repair falls back to one audience');
  ok(repair({ complexity: 99 }).complexity === 5, 'repair clamps high');
  ok(repair({ complexity: -4 }).complexity === 1, 'repair clamps low');
  ok(repair({ fx: 'twelve' }).fx === DEFAULTS.fx, 'repair rejects a non-numeric rate');
  ok(repair({ features: 'not an array' }).features.length >= 3, 'repair replaces a broken feature list');
  ok(repair({ name: '<scr' + 'ipt>x</scr' + 'ipt>' }).name.indexOf('<') === 0, 'repair keeps text intact — escaping happens at render');
  ok(JSON.parse(JSON.stringify(repair({}))).fees.gumroad === DEFAULTS.fees.gumroad, 'repair round-trips through JSON');

  /* --- descriptions land inside their word windows, in every category --- */
  Object.keys(CATEGORIES).forEach(catKey => {
    const p = build({ category: catKey, name: 'Test ' + catKey });
    ok(Math.abs(wc(p.desc50) - 50) <= 4, '50-word description in range for ' + catKey + ' (' + wc(p.desc50) + ')');
    ok(Math.abs(wc(p.desc150) - 150) <= 9, '150-word description in range for ' + catKey + ' (' + wc(p.desc150) + ')');
    ok(Math.abs(wc(p.desc500) - 500) <= 30, '500-word description in range for ' + catKey + ' (' + wc(p.desc500) + ')');
    ok(wc(p.valueProp) >= 8 && wc(p.valueProp) <= 45, 'value proposition is one sentence for ' + catKey);
    ok(p.desc500.indexOf('\n\n') > 0, '500-word description is paragraphed for ' + catKey);
  });

  /* --- the same inputs always produce the same package --- */
  const a1 = build({ name:'Determinism', category:'prompt_pack' });
  const a2 = build({ name:'Determinism', category:'prompt_pack' });
  ok(a1.valueProp === a2.valueProp, 'value proposition is deterministic');
  ok(a1.desc500 === a2.desc500, 'long description is deterministic');
  ok(GEN.salesPage(a1) === GEN.salesPage(a2), 'the sales page is deterministic');
  ok(JSON.stringify(socialPosts(a1)) === JSON.stringify(socialPosts(a2)), 'the 50 posts are deterministic');

  /* --- price ladder stays inside the brief's ranges --- */
  [1,2,3,4,5].forEach(cx => {
    [1,3,5].forEach(bd => {
      [1,5].forEach(dm => {
        const p = build({ complexity: cx, budget: bd, demand: dm });
        const t = p.tiers;
        ok(t[0].usd >= 9 && t[0].usd <= 29, 'Starter inside $9–29 (c' + cx + ' b' + bd + ' d' + dm + ')');
        ok(t[1].usd >= 49 && t[1].usd <= 99, 'Professional inside $49–99 (c' + cx + ' b' + bd + ' d' + dm + ')');
        ok(t[2].usd >= 99 && t[2].usd <= 299, 'Premium inside $99–299 (c' + cx + ' b' + bd + ' d' + dm + ')');
        ok(t[3].usd >= 500 && t[3].usd <= 5000, 'Enterprise inside $500–5,000 (c' + cx + ' b' + bd + ' d' + dm + ')');
        ok(t[0].usd < t[1].usd && t[1].usd < t[2].usd && t[2].usd < t[3].usd, 'ladder increases (c' + cx + ' b' + bd + ' d' + dm + ')');
        ok(t.every(x => x.ghsLocal <= x.ghs), 'the local price never exceeds the conversion');
        ok(t.every(x => x.net.gumroad < x.usd), 'net is below gross on every tier');
      });
    });
  });

  /* --- score and band --- */
  const hi = build({ demand:5, pain:5, budget:5, competition:1, includes:{prompts:true,code:true,docs:true,templates:true,examples:true,assets:true,videos:true} });
  const lo = build({ demand:1, pain:1, budget:1, competition:5, includes:{prompts:false,code:false,docs:false,templates:false,examples:false,assets:false,videos:false} });
  ok(hi.score > lo.score, 'a better market scores higher');
  ok(hi.score <= 100 && lo.score >= 0, 'score stays in range');
  ok(hi.band.k === 'priority', 'the best case reads as a priority build');
  ok(lo.band.k === 'thin', 'the worst case reads as thin');
  ok(build({ competition:1 }).score > build({ competition:5 }).score, 'competition is inverted in the score');

  /* --- manifest --- */
  const pm = build({ includes:{prompts:true,code:true,docs:true,templates:true,examples:true,assets:true,videos:true} });
  const paths = pm.manifest.map(m => (m.folder ? m.folder + '/' : '') + m.file);
  ok(uniq(paths).length === paths.length, 'no duplicate file paths');
  ok(pm.manifest.every(m => m.gen.indexOf('pdf:') === 0 || typeof GEN[m.gen] === 'function'), 'every manifest row has a generator');
  ok(pm.manifest.filter(m => m.gen.indexOf('pdf:') === 0).length === 5, 'five PDFs are declared');
  ok(pm.manifest.every(m => m.ship !== 'buyer' || (m.tier >= 1 && m.tier <= 4)), 'every buyer file has a valid tier');
  ok(FOLDERS.every(f => paths.some(x => x.indexOf(f.id + '/') === 0)), 'every folder in the structure has at least one file');
  ok(pm.folderCount === 10, 'the package reports exactly ten folders');
  ok(pm.manifest.some(m => m.folder === ''), 'the product root carries files of its own');
  [1,2,3,4].forEach(n => ok(filesForTier(pm, n).length >= filesForTier(pm, Math.max(1, n-1)).length, 'tier ' + n + ' ships at least as much as the tier below'));
  ok(filesForTier(pm, 4).length === pm.manifest.filter(m => m.ship === 'buyer').length, 'the top tier ships every buyer file');
  ok(pm.manifest.some(m => m.ship === 'studio'), 'studio-only files exist');
  ok(packageEntries(pm, { buyerOnly:true, tier:1 }).every(e => e.dir || e.name.indexOf('07_Marketing/') < 0 || e.name.slice(-1) === '/'), 'no marketing file reaches a customer ZIP');

  /* --- every generated file renders cleanly, in three very different products --- */
  [{ category:'prompt_pack', audiences:['teachers'], name:'Lesson Engine' },
   { category:'mini_app', audiences:['ghana_business'], name:'Quote Tool', runtime:'browser' },
   { category:'business_system', audiences:['agencies','consultants'], name:'Delivery OS', complexity:5 }
  ].forEach(patch => {
    const p = build(patch);
    p.manifest.forEach(m => {
      const c = fileContent(p, m);
      const s = c.md;
      const label = patch.name + ' → ' + m.file;
      ok(typeof s === 'string' && s.length > 120, label + ' produces content');
      ok(s.indexOf('undefined') < 0, label + ' contains no undefined');
      ok(s.indexOf('[object Object]') < 0, label + ' contains no [object Object]');
      ok(s.indexOf('NaN') < 0, label + ' contains no NaN');
      ok(s.indexOf('${') < 0, label + ' has no unresolved template');
    });
  });

  /* --- SEO --- */
  Object.keys(CATEGORIES).forEach(catKey => {
    const p = build({ category: catKey });
    const kw = seoKeywords(p);
    ok(kw.primary.length === 50, '50 primary keywords for ' + catKey);
    ok(kw.secondary.length === 50, '50 secondary keywords for ' + catKey);
    ok(kw.longtail.length === 20, '20 long-tail keywords for ' + catKey);
    ok(uniq(kw.primary.map(x => x.k)).length === 50, 'primary keywords are unique for ' + catKey);
    ok(uniq(kw.secondary.map(x => x.k)).length === 50, 'secondary keywords are unique for ' + catKey);
    ok(uniq(kw.longtail.map(x => x.k)).length === 20, 'long-tail keywords are unique for ' + catKey);
    ok(kw.longtail.every(x => x.k.indexOf('{') < 0), 'no unfilled long-tail slot for ' + catKey);
    const m = seoMeta(p);
    ok(m.title.length <= 60, 'SEO title within 60 for ' + catKey + ' (' + m.title.length + ')');
    ok(m.desc.length <= 160, 'meta description within 160 for ' + catKey + ' (' + m.desc.length + ')');
    ok(m.og.length <= 200, 'Open Graph description within 200 for ' + catKey);
    ok(m.tags.length === 10, 'ten tags for ' + catKey);
    ok(uniq(m.tags).length === m.tags.length, 'tags are unique for ' + catKey);
    const csv = GEN.seoCsv(p).trim().split('\n');
    ok(csv.length === 121, 'keyword CSV has 120 rows plus a header for ' + catKey);
  });

  /* --- listings --- */
  Object.keys(CATEGORIES).forEach(catKey => {
    const p = build({ category: catKey, name: CATEGORIES[catKey].label + ' Product' });
    const g = gumroad(p), h = shopify(p), k = paystack(p);
    ok(g.title.length <= 60, 'Gumroad title within 60 for ' + catKey + ' (' + g.title.length + ')');
    ok(g.tags.length === 10, 'ten Gumroad tags for ' + catKey);
    ok(g.benefits.length === 6, 'six Gumroad benefits for ' + catKey);
    ok(h.seoTitle.length <= 60, 'Shopify SEO title within 60 for ' + catKey);
    ok(h.seoDesc.length <= 160, 'Shopify meta description within 160 for ' + catKey);
    ok(h.variants.length === 4, 'four Shopify variants for ' + catKey);
    ok(k.short.length <= 150, 'Paystack short description within 150 for ' + catKey + ' (' + k.short.length + ')');
    ok(k.momo.length === 6, 'six Mobile Money steps for ' + catKey);
    ok(k.prices.every(x => x.ghs > 0), 'every Ghana price is positive for ' + catKey);
    const ct = coverText(p);
    ok(ct.line1.length <= 34 && ct.line2.length <= 58, 'cover text fits its lines for ' + catKey);
    /* A shortened field that ends on a conjunction or a preposition reads as
       broken, and buyers are right to read it that way. */
    [[ct.line2,'cover line 2'], [g.summary,'Gumroad summary'], [k.short,'Paystack short description'],
     [h.seoDesc,'Shopify meta description'], [h.seoTitle,'Shopify SEO title'], [g.title,'Gumroad title'],
     [seoMeta(p).h1,'H1'], [funnel(p).landing.sub,'landing sub-headline']
    ].forEach(([v, what]) => ok(!DANGLING.test(v), what + ' does not end mid-thought for ' + catKey + ' ("' + v.slice(-28) + '")'));
  });

  /* --- social --- */
  Object.keys(CATEGORIES).forEach(catKey => {
    const p = build({ category: catKey });
    const s = socialPosts(p);
    const all = [].concat(s.facebook, s.instagram, s.linkedin, s.x, s.whatsapp);
    ok(all.length === 50, '50 posts for ' + catKey);
    ok(uniq(all).length === 50, 'all 50 posts are distinct for ' + catKey);
    ok(s.x.every(x => x.length <= 280), 'every X post is inside 280 characters for ' + catKey);
    ok(s.instagram.every(x => x.indexOf('#') > 0), 'every Instagram post carries hashtags for ' + catKey);
    ok(all.every(x => x.indexOf('undefined') < 0), 'no post leaks undefined for ' + catKey);
    ok(Object.keys(s).length === 5, 'five channels for ' + catKey);
  });

  /* --- funnel --- */
  const pf = build({});
  const fn = funnel(pf);
  ok(fn.stages.length === 5, 'five funnel stages');
  ok(fn.emails.length === 7, 'seven emails');
  ok(fn.upsells.length === 3 && fn.downsells.length === 2 && fn.bumps.length === 2, 'upsells, downsells and bumps');
  ok(fn.stages[0].price === 'Free', 'the funnel opens with a free lead magnet');
  ok(fn.emails.every(e => e.body.length > 120), 'every email has a real body');
  ok(fn.emails.map(e => e.day).every((d, i, arr) => i === 0 || d > arr[i-1]), 'the email days increase');
  ok(GEN.launch(pf).split('- [ ]').length - 1 === 30, 'the launch checklist has exactly 30 items');
  ok(GEN.outreach(pf).split('```').length - 1 === 8, 'four outreach templates in fenced blocks');

  /* --- Markdown renderer, including hostile input --- */
  const html = mdToHtml('# H\n\n| a | b |\n|---|---|\n| 1 | 2 |\n\n- x\n- y\n\n```\ncode <b>\n```\n');
  ok(html.indexOf('<table>') > 0, 'tables render');
  ok(html.indexOf('<li>x</li>') > 0, 'lists render');
  ok(html.indexOf('&lt;b&gt;') > 0, 'code blocks are escaped');
  const evilTag = '<scr' + 'ipt>bad()</scr' + 'ipt>';
  const nasty = build({ name:'<img src=x onerror=alert(1)>', features:[{t:evilTag, d:'"quoted"'},{t:'b',d:''},{t:'c',d:''}] });
  const nastyHtml = mdToHtml(GEN.readme(nasty));
  ok(nastyHtml.indexOf('<img src=x') < 0, 'an injected img tag reaches the page as text');
  ok(nastyHtml.indexOf(evilTag) < 0, 'an injected script tag reaches the page as text');
  ok(nastyHtml.indexOf('&lt;img') > 0, 'the injected markup is visible, escaped');

  /* --- PDF writer --- */
  const pdf = buildPDF('Test', GEN.quickstart(pf), 'footer');
  const head = String.fromCharCode.apply(null, pdf.slice(0, 8));
  const tailBytes = pdf.slice(pdf.length - 6);
  ok(head.indexOf('%PDF-1.4') === 0, 'PDF starts with a 1.4 header');
  ok(String.fromCharCode.apply(null, tailBytes).indexOf('%%EOF') >= 0, 'PDF ends with %%EOF');
  ok(pdf.length > 2000, 'PDF has real content (' + pdf.length + ' bytes)');
  const pdfStr = String.fromCharCode.apply(null, pdf.slice(0, 4000));
  ok(pdfStr.indexOf('/Type /Catalog') > 0, 'PDF has a catalogue');
  const whole = Array.prototype.map.call(pdf, c => String.fromCharCode(c)).join('');
  ok(whole.indexOf('xref') > 0 && whole.indexOf('startxref') > 0, 'PDF has a cross-reference table');
  ok(whole.indexOf('/BaseFont /Helvetica') > 0, 'PDF embeds a base-14 font reference');
  const xrefPos = parseInt(whole.slice(whole.lastIndexOf('startxref') + 9), 10);
  ok(whole.slice(xrefPos, xrefPos + 4) === 'xref', 'the startxref offset points at the table');
  ok(/\/Count (\d+)/.test(whole) && parseInt(whole.match(/\/Count (\d+)/)[1], 10) >= 2, 'the quick start PDF runs to more than one page');
  ok((whole.match(/\/Type \/Page[^s]/g) || []).length === parseInt(whole.match(/\/Count (\d+)/)[1], 10), 'the page count matches the page objects');
  ok(pdfText('“smart” — quotes…').indexOf('"smart" -- quotes...') === 0, 'PDF text transliterates typography');
  ok(pdfText('emoji 🚀 gone').indexOf('🚀') < 0, 'PDF text drops what the base fonts cannot encode');
  ok(pdfWrap('a '.repeat(200), 'F1', 10, 400).length > 1, 'PDF text wraps');

  /* --- ZIP writer --- */
  ok(crc32(new TextEncoder().encode('123456789')) === 0xCBF43926, 'CRC-32 matches the standard check value');
  const zipEntries = packageEntries(pf, { buyerOnly:true, tier:2 });
  const zip = makeZip(zipEntries);
  ok(zip instanceof Blob && zip.size > 3000, 'ZIP is built (' + zip.size + ' bytes)');
  const smallZip = makeZip([{ name:'a.txt', data:'hello' }]);
  ok(smallZip.size === 5 + 30 + 5 + 46 + 5 + 22, 'ZIP byte layout is exactly local header + data + central directory + EOCD');
  ok(zipEntries.filter(e => e.dir).length === 11, 'the ZIP declares the root and all ten folders');
  ok(zipEntries.some(e => e.name.indexOf('MANIFEST.txt') > 0), 'the ZIP carries a manifest');
  ok(zipEntries.every(e => e.name.indexOf('..') < 0), 'no path escapes the root');

  /* --- the master document --- */
  const master = masterMarkdown(pf);
  ok(master.length > 60000, 'the complete Markdown package is substantial (' + master.length.toLocaleString() + ' chars)');
  for(let n = 1; n <= 13; n++) ok(master.indexOf('\n# ' + n + '. ') > 0, 'master document has section ' + n);
  ok(master.indexOf('undefined') < 0, 'master document leaks no undefined');
  ok(master.indexOf('[object Object]') < 0, 'master document leaks no [object Object]');
  ok(treeText(pf).split('\n').length > 40, 'the folder tree lists every file');
  ok(FOLDERS.every(f => treeText(pf).indexOf(f.id) > 0), 'the tree shows all ten folders');
  ok(manifestText(pf, {}).indexOf('studio only') > 0, 'the manifest marks studio-only files');
  ok(tiersCsv(pf).trim().split('\n').length === 5, 'the tiers CSV has four rows and a header');

  /* --- knowledge base integrity --- */
  Object.keys(CATEGORIES).forEach(k => {
    const c = CATEGORIES[k];
    ok(c.kw.length >= 5, k + ' has enough keyword roots');
    ok(c.useCases.length === 5, k + ' has five use cases');
    ok(c.outcomes.length === 3, k + ' has three outcomes');
    ok(!!c.gate && !!c.stale && !!c.ships, k + ' names its gate, its decay and what it ships');
    ok(['a','an'].indexOf(c.art) >= 0, k + ' has a usable article');
  });
  Object.keys(AUDIENCES).forEach(k => {
    const a = AUDIENCES[k];
    ok(!!a.p && !!a.s && !!a.ctx && !!a.wants, k + ' is fully described');
  });
  ok(ANGLES.length === 10, 'ten posting angles');
  ok(uniq(ANGLES.map(a => a.key)).length === 10, 'the angles are distinct');
  ok(OBJECTIONS.length === 6, 'six objections answered');
  ok(FOLDERS.length === 10, 'ten folders, as specified');
  ok(FOLDERS.every((f, i) => f.id.indexOf(String(i+1).padStart(2,'0')) === 0), 'folders are numbered in order');

  S = savedS;
  return { pass, fails };
}

/* ==========================================================================
   Start
   ========================================================================== */
function init(){
  try {
    const th = localStorage.getItem(STORE_KEY + '.theme');
    if(th) document.documentElement.setAttribute('data-theme', th);
  } catch(e){}

  load();
  buildTabs();
  $('#panel-product').innerHTML = productFormHTML();
  syncForm();
  wire();

  let saved = null;
  try { saved = localStorage.getItem(STORE_KEY + '.tab'); } catch(e){}
  activeTab = TABS.some(t => t.id === saved) ? saved : 'product';
  TABS.forEach(t => {
    $('#tab-' + t.id).setAttribute('aria-selected', String(t.id === activeTab));
    $('#tab-' + t.id).tabIndex = t.id === activeTab ? 0 : -1;
    $('#panel-' + t.id).hidden = t.id !== activeTab;
  });

  renderAll();

  const t0 = performance.now();
  const res = selfTest();
  const ms = Math.round(performance.now() - t0);
  const foot = $('#foot-tests');
  if(res.fails.length){
    foot.innerHTML = '<strong style="color:var(--bad)">' + res.fails.length + ' self-checks failed</strong> of ' +
      (res.pass + res.fails.length) + ' — ' + esc(res.fails.slice(0, 3).join('; '));
    console.error('Self-check failures:', res.fails);
  } else {
    foot.textContent = res.pass.toLocaleString() + ' self-checks passed in ' + ms + ' ms';
  }
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
