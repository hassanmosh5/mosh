  h += card('The catalogue, twelve months out', 'the same arithmetic with the catalogue growing underneath it',
    table(['Month',{label:'Live products',num:true},{label:'Assumed visits',num:true},{label:'Base net',num:true},{label:'Cumulative',num:true}],
      proj.map(r => ({ cells:['M' + r.m, {num:true, html:String(r.live)}, {num:true, html:r.visits.toLocaleString()},
        {num:true, html:usd(r.base)}, {num:true, html:usd(r.cumBase)}] }))));

  return h;
}

/* ---------- Phase 16 + 17 + 18: operations ---------- */
function renderOps(D){
  if(!D.selected) return noSelection('Licences and SOPs are written for one validated product.');
  if(!D.val.complete) return needsValidation(D);
  const o = D.selected;
  const lic = buildLicences(o, D);
  const sops = buildSOPs(o, D);
  const cat = buildCatalogue(D, D.s.catalogueTarget);
  const rec = buildRecurring(D, cat);

  let h = card('Phase 16 · Licensing', 'six, and two of them should stay in the drawer for a year',
    table(['Licence',{label:'Price',num:true},'Where it lives'],
      lic.map(l => ({ cells:[
        '<strong>' + esc(l.label) + '</strong>',
        { num:true, html: l.price ? usd(l.price) : '—' },
        esc(l.included)
      ]}))) +
    '<div style="margin-top:14px">' + lic.map(l => detail(l.label, l.price ? usd(l.price) : l.included, copybox(l.text, l.label))).join('') + '</div>' +
    '<p class="note warn">These are plain-English commercial terms, not legal advice, and they have not been reviewed by a lawyer in your jurisdiction or your buyer’s. ' +
    'For anything above the personal licence — and for every sale into the EU or UK — have them read by someone qualified before you publish them.</p>');

  h += card('Phase 17 · Standard operating procedures', 'six, written to be handed over',
    sops.map(s => detail(s.label, s.owner + ' · ' + s.freq + ' · ~' + s.minutes + ' min',
      '<ol>' + s.steps.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' +
      '<p class="small"><strong>Automate:</strong> ' + esc(s.automate) + '</p>')).join('') +
    '<p class="note" style="margin-top:14px">Total recurring load: ' +
    round(sops.filter(s => /Weekly/i.test(s.freq)).reduce((a,s) => a + s.minutes, 0) / 60, 1) + ' h/week plus ' +
    round(sops.filter(s => /Daily/i.test(s.freq)).reduce((a,s) => a + s.minutes, 0) * 5 / 60, 1) + ' h/week of support — ' +
    'out of your ' + D.s.hours + '. This is the cost nobody budgets for and the reason catalogues stall at fifteen products.</p>');

  h += card('Phase 18 · Recurring revenue', 'four shapes, and when each becomes honest',
    table(['Club',{label:'Price/mo',num:true},'What members get',{label:'Churn',num:true},{label:'Half-life',num:true},{label:'LTV',num:true},{label:'MRR at 200',num:true},'Ready?'],
      rec.map(r => ({ cells:[
        '<strong>' + esc(r.label) + '</strong>',
        { num:true, html: usd(r.price) },
        esc(r.gives),
        { num:true, html: pct(r.churn * 100, 0) },
        { num:true, html: r.halfLife + ' mo' },
        { num:true, html: usd(r.ltv) },
        { num:true, html: usd(r.at200) },
        r.viable ? '<span class="pill good">yes</span>' : '<span class="pill bad">not yet</span>'
      ]}))) +
    '<div style="margin-top:12px">' + rec.map(r => '<p class="small"><strong>' + esc(r.label) + ':</strong> ' + esc(r.why) + '</p>').join('') + '</div>' +
    '<p class="note warn">Churn is the number that decides all of this and it is the one nobody models. At ' +
    pct(rec[0].churn * 100, 0) + ' monthly churn, half your members are gone in ' + rec[0].halfLife +
    ' months — so a club needs new material every single month or it is a subscription to an archive the member already downloaded.</p>');

  return h;
}

/* ---------- Phase 20: the board ---------- */
function renderBoard(D){
  if(!D.selected) return noSelection('The board reviews one product at a time.');
  const b = buildBoard(D);

  let h = card('Phase 20 · Board review', D.selected.name,
    '<div class="grid g3">' +
      stat('Approval score', b.approval + '<span class="muted" style="font-size:.5em">/100</span>', 'mean of eight seats') +
      stat('Verdict', '<span class="pill ' + b.verdict.pill + '" style="font-size:.45em;vertical-align:middle">' + esc(b.verdict.label) + '</span>', b.verdict.note) +
      stat('Seats under 5', String(b.blockers.length), b.blockers.length ? b.blockers.map(x => x.label).join(', ') : 'none') +
    '</div>');

  h += card(null, null,
    table(['Seat',{label:'Score',num:true},'What it sees','The risk from that seat','Its demand'],
      b.rows.map(r => ({ cells:[
        r.glyph + ' <strong>' + esc(r.label) + '</strong>',
        { num:true, html: scorePill(r.score, 7, 5) },
        esc(r.finding),
        esc(r.risk),
        esc(r.demand)
      ]}))));

  if(b.conditions.length){
    h += card('Conditions of approval', b.conditions.length + ' seat' + (b.conditions.length === 1 ? '' : 's') + ' scored under 7, in order of severity',
      '<ol>' + b.conditions.map(c => '<li><strong>' + esc(c.label) + ' (' + c.score + '/10):</strong> ' + esc(c.demand) + '</li>').join('') + '</ol>' +
      '<p class="note warn">A board that only approves is a rubber stamp with a job title. Three of these seats are wired to be hard to please, ' +
      'and if all eight are happy the honest reading is that the scoring is too generous rather than that the product is flawless.</p>');
  } else {
    h += card('No conditions', null, '<p class="lede">Every seat at 7 or above. Read that as a warning rather than a compliment and have someone who is not you score it again.</p>');
  }

  h += card('Risk analysis', null,
    ul(b.rows.map(r => '<strong>' + esc(r.label) + ':</strong> ' + esc(r.risk))) +
    '<p class="note">The board reviews the dossier, not the market. It can tell you that your plan contradicts itself; it cannot tell you that buyers exist. ' +
    'Only the validation worksheet does that, and only because you filled it in by hand.</p>');

  return h;
}
</script>
<script>
"use strict";
/* ==========================================================================
   The deliverable. One Markdown dossier carrying all fifteen sections, plus
   the machine-readable versions of the two tables you will actually reuse.
   ========================================================================== */

function md(lines){ return lines.filter(x => x !== null && x !== undefined).join('\n'); }
function mdTable(head, rows){
  return md([
    '| ' + head.join(' | ') + ' |',
    '|' + head.map(() => '---').join('|') + '|',
    ...rows.map(r => '| ' + r.map(c => String(c == null ? '' : c).replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ') + ' |')
  ]);
}

function buildDossier(D){
  const s = D.s, o = D.selected, v = D.val;
  const date = new Date().toISOString().slice(0, 10);
  const out = [];

  out.push('# ' + (o ? o.name : 'Venture studio dossier'));
  out.push('');
  out.push('_' + s.studio + (s.operator ? ' · ' + s.operator : '') + ' · ' + date + '_');
  out.push('');
  out.push('Produced offline by the CLEAR AI Digital Product Venture Studio. Every number in this document is arithmetic on inputs supplied by the operator, or on the studio’s stated assumptions, which are printed beside their own outputs. Nothing here was fetched from a marketplace, a search engine or a model.');
  out.push('');

  /* 1 — opportunity analysis */
  out.push('## 1 · Opportunity analysis');
  out.push('');
  out.push('Knowledge assets on file: ' + D.assets.length + '. Product types considered: ' + TYPES.length + '. Ideas scored: ' + D.opps.length + '.');
  out.push('');
  out.push('### Knowledge asset inventory');
  out.push('');
  out.push(mdTable(['Knowledge asset','Buyer type','Problem solved','Product potential','Strength'],
    D.assets.map(a => [
      cap(assetSubject(a)), cap(buyerShort(a)), assetProblem(a),
      D.opps.filter(x => x.assetId === a.id).slice(0, 3).map(x => x.type.label).join(', '),
      round(assetStrength(a), 1) + '/10'
    ])));
  out.push('');
  out.push('### Top 20 opportunities');
  out.push('');
  out.push(mdTable(['#','Product','Type','Demand','Profit','Ease','Scale','Compet','SEO','Score','Build h','Price'],
    D.opps.slice(0, 20).map((x, i) => [
      i + 1, x.name, x.type.label,
      round(x.scores.demand,1), round(x.scores.profit,1), round(x.scores.ease,1),
      round(x.scores.scale,1), round(x.scores.compet,1), round(x.scores.seo,1),
      x.score, x.buildHours, usd(x.price)
    ])));
  out.push('');
  out.push('Weights: demand 24%, profitability 20%, competition 16%, ease 14%, scalability 14%, SEO 12%. Competition is scored so that 10 means an empty shelf.');
  out.push('');

  if(!o){
    out.push('---');
    out.push('');
    out.push('_No product selected, so the remaining fourteen sections are not in this document. Select one in the Opportunities tab and validate it._');
    return out.join('\n');
  }

  /* 2 — validation */
  out.push('## 2 · Validation report');
  out.push('');
  out.push('**Product:** ' + o.name + '  ');
  out.push('**At stake:** ' + hrs(o.buildHours) + ' of build, plus ' + o.type.upkeep + ' h/month upkeep for as long as it is listed.');
  out.push('');
  if(v.complete){
    out.push(mdTable(['Check','Answer','Score','Weight','Reading'],
      v.rows.map(r => [r.check.label, r.value, r.score + '/100', r.check.weight + '%', r.check.read(r.value)])));
    out.push('');
    out.push('**Validation score: ' + v.score + '/100 — ' + DECISIONS[v.decision].label + '.** ' + DECISIONS[v.decision].note);
    if(v.notes){ out.push(''); out.push('**Notes from the search:**'); out.push(''); out.push('> ' + v.notes.replace(/\n/g,'\n> ')); }
  } else {
    out.push('**NOT VALIDATED.** ' + v.answered + ' of ' + VALIDATION_CHECKS.length + ' answers on file. The remaining sections of this dossier were generated anyway, at the operator’s request, and should be read as a draft of an untested idea rather than as a plan.');
  }
  out.push('');

  const arch = buildArchitecture(o, D);
  const tiers = buildTiers(o, D);
  const outline = buildOutline(o, D);
  const flow = buildWorkflow(o, D);
  const qa = buildQA(o, D);
  const eco = buildEcosystem(o, D);
  const cat = buildCatalogue(D, s.catalogueTarget);
  const listings = buildListings(o, D);
  const kw = keywordSets(o, D);
  const faq = buildFAQ(o, D);
  const vis = buildVisuals(o, D);
  const content = buildContent(o, D);
  const email = buildEmail(o, D);
  const funnel = buildFunnel(o, D);
  const econ = buildEconomics(D, 1);
  const proj = buildProjection(D, cat);
  const lic = buildLicences(o, D);
  const sops = buildSOPs(o, D);
  const rec = buildRecurring(D, cat);
  const scaling = buildScaling(D, cat);
  const board = buildBoard(D);

  /* 3 — blueprint */
  out.push('## 3 · Product blueprint');
  out.push('');
  out.push(mdTable(['Field','Value'], [
    ['Product name', arch.name], ['Promise', arch.promise], ['Target audience', arch.audience],
    ['Not for', arch.notFor], ['Core problem', arch.problem], ['Desired outcome', arch.outcome],
    ['Unique mechanism', arch.mechanism], ['Transformation from', arch.transformation.from],
    ['Transformation to', arch.transformation.to], ['Credibility', arch.credibility],
    ['Evidence', arch.proof], ['Format', o.type.deliver], ['Gate', arch.gate]
  ]));
  out.push('');
  out.push('### The four versions');
  out.push('');
  out.push(mdTable(['Tier','Price','What it is','Includes'],
    tiers.map(t => [t.label, usd(t.price), t.blurb, t.includes.join('; ')])));
  out.push('');

  /* 4 — product content */
  out.push('## 4 · Product content');
  out.push('');
  for(const sec of outline.sections){
    out.push('### ' + sec.h);
    out.push('');
    if(sec.list) out.push(sec.list.map(x => '- ' + x).join('\n'));
    else out.push(sec.body);
    out.push('');
  }
  out.push('### The spine');
  out.push('');
  out.push(mdTable(['#','Section','What it does','Worksheet'],
    outline.spine.map(x => [x.n, x.title, x.detail, x.worksheet])));
  out.push('');
  out.push('### Production workflow');
  out.push('');
  out.push(mdTable(['Pass','Hours','Tools','What happens','Human gate'],
    flow.map(p => [p.label, p.hours, p.tool, p.does, p.gate])));
  out.push('');
  out.push('### Quality assurance');
  out.push('');
  out.push(mdTable(['Category','Score','Passes 8/10?','Fix if not'],
    qa.rows.map(r => [r.k, r.score, r.pass ? 'yes' : 'NO', r.pass ? '' : r.fix])));
  out.push('');

  /* 5 — assets */
  out.push('## 5 · Product assets');
  out.push('');
  out.push('**Palette:** ' + vis.palette);
  out.push('');
  out.push('**Cover — Canva:** ' + vis.cover.canva);
  out.push('');
  out.push('**Cover — Midjourney:** `' + vis.cover.midjourney + '`');
  out.push('');
  out.push('**Cover — Firefly:** `' + vis.cover.firefly + '`');
  out.push('');
  out.push('**Mockups:**');
  out.push('');
  out.push(vis.mockups.map(x => '- ' + x).join('\n'));
  out.push('');
  out.push('**Thumbnails:**');
  out.push('');
  out.push(vis.thumbnails.map(x => '- ' + x).join('\n'));
  out.push('');

  /* 6 — listings */
  out.push('## 6 · Marketplace listings');
  out.push('');
  for(const l of listings){
    out.push('### ' + l.label);
    out.push('');
    out.push('**Title** (' + l.titleLen + '/' + l.titleMax + '): ' + l.title);
    out.push('');
    out.push('**Description** (' + l.descLen + '/' + l.descMax + '):');
    out.push('');
    out.push('```\n' + l.desc + '\n```');
    out.push('');
    if(l.tagMax) out.push('**Tags** (' + l.tags.length + '/' + l.tagMax + '): ' + l.tags.join(', '));
    out.push('');
    out.push('**Meta title:** ' + l.metaTitle + '  ');
    out.push('**Meta description:** ' + l.metaDesc + '  ');
    out.push('**Price:** ' + usd(l.price) + ' → net ' + usd(l.net) + ' after ' + pct(l.fee) + (l.fixed ? ' + ' + usd(l.fixed) : '') + '.');
    out.push('');
  }
  out.push('### Keywords');
  out.push('');
  out.push('**Primary (transactional, ' + kw.primary.length + '):** ' + kw.primary.join(' · '));
  out.push('');
  out.push('**Secondary (buyer-qualified, ' + kw.secondary.length + '):** ' + kw.secondary.join(' · '));
  out.push('');
  out.push('**Long-tail (' + kw.longtail.length + '):** ' + kw.longtail.join(' · '));
  out.push('');
  out.push('### FAQs');
  out.push('');
  for(const f of faq){ out.push('**' + f.q + '**'); out.push(''); out.push(f.a); out.push(''); }

  /* 7 — marketing */
  out.push('## 7 · Marketing assets');
  out.push('');
  out.push('### 90-day content plan');
  out.push('');
  out.push(mdTable(['Week','Phase','Long piece','Posts','Email'],
    content.plan.map(w => ['W' + w.week, w.phase, w.long, w.posts.join(' / '), w.email])));
  out.push('');
  out.push('### Long pieces');
  out.push('');
  out.push(mdTable(['Title','Target phrase','What it is for'], content.blogs.map(b => [b.t, b.kw, b.job])));
  out.push('');
  for(const [k, ch] of Object.entries(content.social)){
    out.push('### ' + ch.label + ' — ' + ch.posts.length + ' posts');
    out.push('');
    out.push('_' + ch.shape + '_');
    out.push('');
    for(const p of ch.posts){ out.push('**' + p.angle + '**'); out.push(''); out.push(p.text.split('\n').map(x => '> ' + x).join('\n')); out.push(''); }
  }
  out.push('### Lead magnets');
  out.push('');
  out.push(mdTable(['Magnet','Why'], content.leadMagnets.map(m => [m.t, m.why])));
  out.push('');

  /* 8 — email funnel */
  out.push('## 8 · Email funnel');
  out.push('');
  out.push('**Lead magnet:** ' + email.magnet.title + ' — ' + email.magnet.promise);
  out.push('');
  out.push('**Landing page:** ' + email.landing.headline + ' / ' + email.landing.sub + ' / button: “' + email.landing.cta + '”');
  out.push('');
  for(const seq of email.sequences){
    out.push('### ' + seq.name + ' sequence');
    out.push('');
    out.push('_' + seq.note + '_');
    out.push('');
    out.push(mdTable(['Day','Subject','What it does'], seq.items.map(i => ['d' + i.d, i.s, i.b])));
    out.push('');
  }

  /* 9 — pricing */
  out.push('## 9 · Pricing strategy');
  out.push('');
  out.push(mdTable(['Tier','List price','Share of buyers'].concat(D.platforms.map(p => PLATFORMS[p].label + ' net')),
    tiers.map(t => [t.label, usd(t.price), pct((ASSUMPTIONS.mix[t.id] || 0) * 100, 0)]
      .concat(D.platforms.map(p => usd(netPerSale(t.price, p)))))));
  out.push('');
  out.push('### Funnel');
  out.push('');
  out.push('```\n' + funnel.diagram + '\n```');
  out.push('');
  out.push(mdTable(['Stage','Offer','Price','Note'],
    funnel.stages.map(x => [x.k, x.name, x.price == null ? '—' : (x.price ? usd(x.price) : 'free'), x.note])));
  out.push('');

  /* 10 — catalogue */
  out.push('## 10 · Catalogue strategy');
  out.push('');
  out.push('Target: ' + s.catalogueTarget + ' products at ' + s.hours + ' h/week. Total build ' + hrs(cat.totalHours) +
    ', finishing in about ' + round(cat.totalHours / Math.max(1, s.hours) / 4.33, 1) + ' months, ending at ' + round(cat.totalUpkeep, 1) + ' h/month of upkeep.');
  out.push('');
  if(cat.stallAt) out.push('**Stall point: product ' + cat.stallAt + '** — upkeep reaches three quarters of the working week there.');
  else out.push('No stall point inside ' + s.catalogueTarget + ' products at the current hours.');
  out.push('');
  out.push(mdTable(['#','Day','Product','Type','Build h','Price','Score','Stage'],
    cat.rows.map(r => [r.n, 'd' + r.day, r.opp.name, r.opp.type.label, r.hours, usd(r.opp.price), r.opp.score, r.stage])));
  out.push('');

  /* 11 — automation */
  out.push('## 11 · Automation plan');
  out.push('');
  for(const sop of sops){
    out.push('### ' + sop.label);
    out.push('');
    out.push('_' + sop.owner + ' · ' + sop.freq + ' · about ' + sop.minutes + ' minutes_');
    out.push('');
    out.push(sop.steps.map((x, i) => (i + 1) + '. ' + x).join('\n'));
    out.push('');
    out.push('**Automate:** ' + sop.automate);
    out.push('');
  }

  /* 12 — scaling */
  out.push('## 12 · Scaling roadmap');
  out.push('');
  out.push(mdTable(['Catalogue','Upkeep/week','Left to build','% upkeep','Hire','Delegate','Automate'],
    scaling.map(r => [r.n + ' products', r.upkeepWeekly + ' h', r.buildWeekly + ' h', r.pctUpkeep + '%', r.hire, r.delegate, r.automate])));
  out.push('');
  out.push('### Recurring revenue');
  out.push('');
  out.push(mdTable(['Club','Price/mo','Members get','Churn','Half-life','LTV','MRR at 200','Ready?'],
    rec.map(r => [r.label, usd(r.price), r.gives, pct(r.churn * 100, 0), r.halfLife + ' mo', usd(r.ltv), usd(r.at200), r.viable ? 'yes' : 'not yet'])));
  out.push('');

  /* 13 — licensing */
  out.push('## 13 · Licensing plan');
  out.push('');
  for(const l of lic){
    out.push('### ' + l.label + (l.price ? ' — ' + usd(l.price) : '') + ' (' + l.included + ')');
    out.push('');
    out.push('```\n' + l.text + '\n```');
    out.push('');
  }
  out.push('_Plain-English commercial terms, not legal advice. Not reviewed by a lawyer in any jurisdiction._');
  out.push('');

  /* 14 — revenue forecast */
  out.push('## 14 · Revenue arithmetic');
  out.push('');
  out.push('**Assumptions, all four of them invented by this file:** ' + ASSUMPTIONS.reachNote + ' ' + ASSUMPTIONS.convNote + ' ' + ASSUMPTIONS.shelfNote + ' ' + ASSUMPTIONS.refundNote);
  out.push('');
  out.push('Average order value ' + usd(econ.aov) + '. Platform fees ' + pct(econ.fee) + '. Fixed monthly cost ' + usd(econ.monthlyPlatformCost) + '. Assumed monthly visits ' + econ.visits.toLocaleString() + '.');
  out.push('');
  out.push(mdTable(['Scenario','Conversion','Sales/mo','Gross','Net','Annualised'],
    econ.scen.map(x => [x.label, pct(x.conv * 100), x.sales, usd(x.gross), usd(x.net), usd(x.year)])));
  out.push('');
  out.push(mdTable(['Month','Live products','Assumed visits','Base net','Cumulative'],
    proj.map(r => ['M' + r.m, r.live, r.visits.toLocaleString(), usd(r.base), usd(r.cumBase)])));
  out.push('');
  out.push('**A new listing with no audience and no reviews sells nothing for the first sixty days. None of these columns knows that.**');
  out.push('');

  /* 15 — board */
  out.push('## 15 · Board review');
  out.push('');
  out.push('**Approval score ' + board.approval + '/100 — ' + board.verdict.label + '.** ' + board.verdict.note);
  out.push('');
  out.push(mdTable(['Seat','Score','What it sees','Risk','Demand'],
    board.rows.map(r => [r.label, r.score + '/10', r.finding, r.risk, r.demand])));
  out.push('');
  if(board.conditions.length){
    out.push('### Conditions of approval');
    out.push('');
    out.push(board.conditions.map((c, i) => (i + 1) + '. **' + c.label + ' (' + c.score + '/10):** ' + c.demand).join('\n'));
    out.push('');
  }
  out.push('---');
  out.push('');
  out.push('_The goal is not one digital product. It is a catalogue of validated assets that compound in visibility, authority and revenue — which is only true of the ones that were validated._');
  return out.join('\n');
}

function opportunityCSV(D){
  const rows = [['rank','product','asset','type','family','demand','profitability','ease','scalability','competition','seo','score','build_hours','upkeep_h_month','price_usd','score_per_hour']];
  D.opps.forEach((o, i) => rows.push([
    i + 1, o.name, assetSubject(o.asset), o.type.label, FAMILIES[o.type.family].label,
    round(o.scores.demand,1), round(o.scores.profit,1), round(o.scores.ease,1),
    round(o.scores.scale,1), round(o.scores.compet,1), round(o.scores.seo,1),
    o.score, o.buildHours, o.upkeep, o.price, o.perHour
  ]));
  return toCSV(rows);
}
function catalogueCSV(D){
  const cat = buildCatalogue(D, D.s.catalogueTarget);
  const rows = [['n','stage','start_day','week','product','type','build_hours','cumulative_hours','upkeep_per_week','price_usd','score']];
  cat.rows.forEach(r => rows.push([
    r.n, r.stage, r.day, r.week, r.opp.name, r.opp.type.label,
    r.hours, r.cumHours, r.upkeepWeekly, r.opp.price, r.opp.score
  ]));
  return toCSV(rows);
}
function toCSV(rows){
  return rows.map(r => r.map(c => {
    const v = String(c == null ? '' : c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(',')).join('\r\n');
}

function renderExport(D){
  const o = D.selected;
  const dossier = buildDossier(D);
  const base = o ? fileSafe(o.name) : 'Venture_Studio';
  const sections = o && D.val.complete ? 15 : o ? 15 : 1;

  let h = card('The deliverable', 'one Markdown document, two spreadsheets, one backup',
    '<p class="lede">' + (o
      ? 'Everything the studio generated for <strong>' + esc(o.name) + '</strong>, in the order the phases run.'
      : 'No product selected, so the dossier carries the opportunity analysis alone — which is one section out of fifteen.') + '</p>' +
    '<div class="grid g4">' +
      stat('Dossier', dossier.length.toLocaleString() + '<span class="muted" style="font-size:.45em"> chars</span>', wc(dossier).toLocaleString() + ' words') +
      stat('Sections', String(sections), o ? 'all fifteen phases of the deliverable' : 'select a product for the other fourteen') +
      stat('Opportunities', String(D.opps.length), 'rows in the CSV') +
      stat('Catalogue', String(buildCatalogue(D, D.s.catalogueTarget).rows.length), 'products in the plan') +
    '</div>' +
    (o && !D.val.complete
      ? '<p class="note warn" style="margin-top:14px"><strong>This dossier will say, at the top of section 2, that the product was never validated.</strong> ' +
        'It is generated anyway because refusing to export would only make you retype it — but the warning travels with the document, and it should.</p>'
      : '') +
    '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn primary" type="button" data-dl="dossier">Download the dossier (.md)</button>' +
      '<button class="btn" type="button" data-dl="opps">Opportunities (.csv)</button>' +
      '<button class="btn" type="button" data-dl="cat">Catalogue plan (.csv)</button>' +
      '<button class="btn" type="button" data-dl="json">Backup (.json)</button>' +
      '<button class="btn" type="button" data-copy-dossier>Copy the dossier</button>' +
    '</div>' +
    '<p class="tiny muted" style="margin-top:10px">Files are assembled in the page and handed to the browser’s download. Nothing is uploaded; there is no server to upload it to.</p>');

  h += card('What the fifteen sections are', 'the final deliverable, in order',
    table(['#','Section','Source'], [
      ['1','Opportunity analysis','Phase 1–2 — the inventory and every scored idea'],
      ['2','Validation report','Phase 3 — your six numbers and the decision they produce'],
      ['3','Product blueprint','Phase 4 — architecture and the four versions'],
      ['4','Product content','Phase 5–7 — outline, spine, workflow, QA scores'],
      ['5','Product assets','Phase 11 — palette, cover briefs, mockups, thumbnails'],
      ['6','Marketplace listings','Phase 10 — one per platform, limits enforced, plus keywords and FAQs'],
      ['7','Marketing assets','Phase 12 — 90-day plan, articles, posts, lead magnets'],
      ['8','Email funnel','Phase 13 — five sequences'],
      ['9','Pricing strategy','Phase 14–15 — funnel and the ladder'],
      ['10','Catalogue strategy','Phase 9 — 30/90/365 with the stall point'],
      ['11','Automation plan','Phase 17 — six SOPs'],
      ['12','Scaling roadmap','Phase 18–19 — 1→100 and the recurring options'],
      ['13','Licensing plan','Phase 16 — six licences in full'],
      ['14','Revenue arithmetic','Phase 15 — three scenarios and twelve months'],
      ['15','Board review','Phase 20 — eight seats and the conditions']
    ].map(r => ({ cells: r.map(esc) }))));

  h += card('Restore', 'the backup file goes back in here',
    '<div class="field"><label>Paste a backup .json</label>' +
    '<textarea id="restore-box" rows="3" placeholder="paste the contents of a backup file and press Restore"></textarea></div>' +
    '<div class="btn-row"><button class="btn" type="button" data-act="restore">Restore</button>' +
    '<button class="btn" type="button" data-act="reset">Reset everything</button></div>' +
    '<p class="tiny muted" style="margin-top:10px">Your work lives in this browser’s local storage and nowhere else. Clearing site data loses it; the backup file is the only copy that survives.</p>');

  return h;
}
</script>
<script>
"use strict";
/* ==========================================================================
   The shell: tabs, events, and the self-checks that run on every load.
   ========================================================================== */

const RENDERERS = {
  assets:renderAssets, ideas:renderIdeas, validate:renderValidate, blueprint:renderBlueprint,
  build:renderBuild, ecosystem:renderEcosystem, catalogue:renderCatalogue, listings:renderListings,
  marketing:renderMarketing, funnel:renderFunnel, ops:renderOps, board:renderBoard, export:renderExport
};

function buildTabs(){
  $('#tablist').innerHTML = TABS.map(t =>
    '<button class="tab" type="button" role="tab" id="tab-' + t.id + '" data-tab="' + t.id + '" ' +
    'aria-controls="panel-' + t.id + '" aria-selected="false" title="' + esc(t.phase) + '">' +
    esc(t.label) + '</button>').join('');
}

function activeTab(){
  return TABS.some(t => t.id === S.tab) ? S.tab : 'assets';
}

function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.matches || !el.matches('input,textarea,select')) return null;
  const keys = ['data-bind','data-asset','data-field','data-val','data-filter','data-platform'];
  const sel = keys.filter(k => el.hasAttribute(k)).map(k => '[' + k + '="' + el.getAttribute(k) + '"]').join('');
  if(!sel && !el.id) return null;
  return {
    sel: el.id ? '#' + el.id : sel,
    start: typeof el.selectionStart === 'number' ? el.selectionStart : null,
    end: typeof el.selectionEnd === 'number' ? el.selectionEnd : null
  };
}
function restoreFocus(f){
  if(!f) return;
  const el = $(f.sel);
  if(!el) return;
  try {
    el.focus({ preventScroll:true });
    if(f.start != null && el.setSelectionRange && /text|search|url|tel|password/.test(el.type || 'text')) el.setSelectionRange(f.start, f.end);
    else if(f.start != null && el.tagName === 'TEXTAREA') el.setSelectionRange(f.start, f.end);
  } catch(_){ /* selection is not supported on number inputs in some browsers */ }
}

function render(){
  D = derive();
  const tab = activeTab();
  const f = captureFocus();

  $$('#tablist .tab').forEach(b => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  for(const t of TABS){
    const p = $('#panel-' + t.id);
    if(!p) continue;
    if(t.id === tab){
      p.hidden = false;
      p.innerHTML = RENDERERS[t.id](D);
    } else if(!p.hidden){
      p.hidden = true;
      p.innerHTML = '';
    }
  }

  $('#hdr-assets').textContent = D.assets.length;
  $('#hdr-ideas').textContent = D.opps.length;
  $('#hdr-val').textContent = D.val && D.val.complete ? D.val.score : (D.selected ? (D.val.answered + '/' + VALIDATION_CHECKS.length) : '—');

  restoreFocus(f);
  save();
}

function goTab(id){
  if(!TABS.some(t => t.id === id)) return;
  S.tab = id;
  render();
  window.scrollTo({ top:0, behavior:'auto' });
}

/* ---------- events ---------- */
function bindEvents(){
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-tab],[data-go],[data-pick],[data-copy],[data-act],[data-dl],[data-copy-dossier],#btn-theme');
    if(!t) return;

    if(t.id === 'btn-theme'){
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(STORE_KEY + '.theme', next); } catch(_){}
      return;
    }
    if(t.dataset.tab) return goTab(t.dataset.tab);
    if(t.dataset.go)  return goTab(t.dataset.go);

    if(t.dataset.pick){
      S.selected = S.selected === t.dataset.pick ? '' : t.dataset.pick;
      render();
      if(S.selected) toast('Selected — now validate it');
      return;
    }
    if(t.dataset.copy){
      const el = document.getElementById(t.dataset.copy);
      if(el) copyText(el.textContent, 'Copied');
      return;
    }
    if(t.hasAttribute('data-copy-dossier')) return copyText(buildDossier(D), 'Dossier copied');
    if(t.dataset.dl) return doDownload(t.dataset.dl);
    if(t.dataset.act) return doAction(t.dataset.act, t);
  });

  document.addEventListener('input', onFormEvent);
  document.addEventListener('change', onFormEvent);
}

function onFormEvent(ev){
  const el = ev.target;
  if(!el || !el.matches) return;

  /* live slider label without a full re-render on every pixel */
  if(el.type === 'range' && ev.type === 'input'){
    const lbl = el.parentElement && el.parentElement.querySelector('.slider-val');
    if(lbl) lbl.textContent = el.value;
  }

  if(el.hasAttribute('data-bind')){
    const k = el.getAttribute('data-bind');
    const prevMarket = S.market;
    S[k] = (el.type === 'number' || el.type === 'range') ? Number(el.value) : el.value;
    if(k === 'market' && S.market !== prevMarket){
      const m = MARKETS[S.market];
      if(m) S.fx = m.fx;
    }
    S = repair(S);
    if(ev.type === 'change' || el.tagName === 'SELECT') render();
    else { save(); softStats(); }
    return;
  }
  if(el.hasAttribute('data-platform')){
    S.platforms[el.getAttribute('data-platform')] = el.checked;
    S = repair(S);
    return render();
  }
  if(el.hasAttribute('data-asset')){
    const id = el.getAttribute('data-asset'), f = el.getAttribute('data-field');
    const a = S.assets.find(x => x.id === id);
    if(!a) return;
    a[f] = (el.type === 'number' || el.type === 'range') ? Number(el.value) : el.value;
    S = repair(S);
    if(ev.type === 'change') render();
    else { save(); softStats(); }
    return;
  }
  if(el.hasAttribute('data-val')){
    if(!S.selected) return;
    const row = S.validation[S.selected] || (S.validation[S.selected] = {});
    const id = el.getAttribute('data-val');
    if(el.value === '') delete row[id];
    else {
      const c = VALIDATION_CHECKS.find(x => x.id === id);
      row[id] = clamp(Number(el.value) || 0, 0, c ? c.max : 1000);
    }
    S = repair(S);
    return render();
  }
  if(el.hasAttribute('data-val-notes')){
    if(!S.selected) return;
    const row = S.validation[S.selected] || (S.validation[S.selected] = {});
    row.notes = el.value.slice(0, 600);
    S = repair(S);
    save();
    return;
  }
  if(el.hasAttribute('data-filter')){
    const k = el.getAttribute('data-filter');
    ideaFilter[k] = k === 'limit' ? Number(el.value) : el.value;
    return render();
  }
}

function softStats(){
  D = derive();
  $('#hdr-assets').textContent = D.assets.length;
  $('#hdr-ideas').textContent = D.opps.length;
}

function doAction(act, el){
  if(act === 'add-asset'){
    if(S.assets.length >= 12) return toast('Twelve is the limit — and more than four is usually a studio that has not chosen');
    let n = S.assets.length + 1, id = 'a' + n;
    while(S.assets.some(a => a.id === id)) id = 'a' + (++n);
    S.assets.push(Object.assign(blankAsset(), { id }));
    S = repair(S);
    return render();
  }
  if(act === 'del-asset'){
    const id = el.dataset.id;
    if(S.assets.length <= 1) return toast('Keep at least one');
    S.assets = S.assets.filter(a => a.id !== id);
    if(S.selected.split(':')[0] === id) S.selected = '';
    S = repair(S);
    return render();
  }
  if(act === 'restore'){
    const box = $('#restore-box');
    if(!box || !box.value.trim()) return toast('Paste a backup first');
    try {
      const parsed = JSON.parse(box.value);
      S = repair(parsed);
      render();
      return toast('Restored');
    } catch(_){ return toast('That is not a valid backup file'); }
  }
  if(act === 'reset'){
    if(!window.confirm('Reset every field to the worked example? Your current work is lost unless you downloaded the backup.')) return;
    S = repair(JSON.parse(JSON.stringify(DEFAULTS)));
    render();
    return toast('Reset');
  }
}

function doDownload(kind){
  const base = D.selected ? fileSafe(D.selected.name) : 'Venture_Studio';
  if(kind === 'dossier') return download(base + '_dossier.md', buildDossier(D), 'text/markdown;charset=utf-8');
  if(kind === 'opps')    return download(base + '_opportunities.csv', opportunityCSV(D), 'text/csv;charset=utf-8');
  if(kind === 'cat')     return download(base + '_catalogue.csv', catalogueCSV(D), 'text/csv;charset=utf-8');
  if(kind === 'json')    return download(base + '_backup.json', JSON.stringify(S, null, 2), 'application/json');
}

/* ---------- self-checks ----------
   These run on every load and report in the footer. They are here because the
   whole app is arithmetic on strings, and arithmetic on strings goes wrong
   quietly. A red footer means do not trust the numbers above it. */
function selfCheck(){
  const fails = [];
  let pass = 0;
  const ok = (name, cond) => { if(cond) pass++; else fails.push(name); };
  const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 0.001 : tol);

  /* helpers */
  ok('clamp bounds', clamp(12, 0, 10) === 10 && clamp(-2, 0, 10) === 0);
  ok('round dp', near(round(1.2345, 2), 1.23));
  ok('esc escapes', esc('<a href="x">&</a>') === '&lt;a href=&quot;x&quot;&gt;&amp;&lt;/a&gt;');
  ok('esc null safe', esc(null) === '' && esc(undefined) === '');
  ok('wc counts', wc('  one   two three ') === 3);
  ok('truncate respects limit', truncate('a'.repeat(200), 40).length <= 40);
  ok('truncate keeps short strings', truncate('short', 40) === 'short');
  ok('slug', slug('Closing Sales over WhatsApp!') === 'closing-sales-over-whatsapp');
  ok('fileSafe', !/[\/\\:]/.test(fileSafe('a/b\\c:d')));
  ok('hash deterministic', hash('abc') === hash('abc') && hash('abc') !== hash('abd'));
  ok('pick deterministic', pick('seed', [1,2,3,4,5]) === pick('seed', [1,2,3,4,5]));
  ok('rotate length', rotate([1,2,3,4], 2).length === 4 && rotate([1,2,3,4], 2)[0] === 3);
  ok('rotate handles empty', rotate([], 3).length === 0);
  ok('charm returns a shelf price', CHARM.includes(charm(37)) && CHARM.includes(charm(3)));
  ok('charm monotonic-ish', charm(500) >= charm(50) && charm(50) >= charm(5));
  ok('joinList oxford', joinList(['a','b','c']) === 'a, b, and c');
  ok('titleCase small words', titleCase('the art of the deal') === 'The Art of the Deal');
  ok('toCSV escapes quotes', toCSV([['a"b','c,d']]) === '"a""b","c,d"');

  /* data integrity */
  ok('33 product types', TYPES.length === 33);
  ok('type ids unique', uniq(TYPES.map(t => t.id)).length === TYPES.length);
  ok('every type has a family', TYPES.every(t => FAMILIES[t.family]));
  ok('every type has a gate', TYPES.every(t => t.gate && t.gate.length > 20));
  ok('every type has a name pattern', TYPES.every(t => Array.isArray(NAME_PATTERNS[t.id])));
  ok('price bands sane', TYPES.every(t => t.lo > 0 && t.hi > t.lo));
  ok('scores in range', TYPES.every(t => [t.demand,t.margin,t.ease,t.scale,t.crowd,t.seo].every(n => n >= 0 && n <= 10)));
  ok('every family used', Object.keys(FAMILIES).every(f => TYPES.some(t => t.family === f)));
  ok('validation weights sum to 100', VALIDATION_CHECKS.reduce((a,c) => a + c.weight, 0) === 100);
  ok('validation fits 30 minutes', VALIDATION_MINUTES === 30);
  ok('validation scores stay 0–100', VALIDATION_CHECKS.every(c =>
    [0, 1, Math.round(c.max / 2), c.max].every(n => { const s = c.score(n); return s >= 0 && s <= 100; })));
  ok('market table complete', Object.values(MARKETS).every(m => m.label && m.cur && m.fx > 0));
  ok('platform limits present', Object.values(PLATFORMS).every(p => p.limits && p.limits.title > 20 && p.limits.desc > 100));
  ok('eight board seats', BOARD.length === 8);
  ok('seven QA categories', QA_CATEGORIES.length === 7);

  /* engine, run against a fixed fixture so the checks do not depend on state */
  const fx = repair(JSON.parse(JSON.stringify(DEFAULTS)));
  const prevS = S;
  S = fx;
  const dd = derive();
  ok('opportunities generated', dd.opps.length === dd.assets.length * TYPES.length);
  ok('opportunities sorted', dd.opps.every((o, i) => i === 0 || dd.opps[i-1].score >= o.score));
  ok('scores bounded', dd.opps.every(o => o.score >= 0 && o.score <= 100));
  ok('sub-scores bounded', dd.opps.every(o => Object.values(o.scores).every(n => n >= 0 && n <= 10)));
  ok('no NaN anywhere in scoring', dd.opps.every(o => isFinite(o.score) && isFinite(o.price) && isFinite(o.buildHours)));
  ok('build hours positive', dd.opps.every(o => o.buildHours > 0));
  ok('prices are shelf prices', dd.opps.every(o => CHARM.includes(o.price)));
  ok('names are non-empty', dd.opps.every(o => o.name.length > 3 && !/\{S\}/.test(o.name)));
  ok('promises are non-empty', dd.opps.every(o => o.promise.length > 20 && !/\{[Bs]\}/.test(o.promise)));
  ok('engine is deterministic', JSON.stringify(allOpportunities(fx).map(o => o.id + o.score)) ===
                                JSON.stringify(allOpportunities(fx).map(o => o.id + o.score)));

  const o1 = dd.opps[0];
  ok('tiers ascend in price', (() => { const t = buildTiers(o1, dd); return t[0].price <= t[1].price && t[1].price <= t[2].price && t[2].price <= t[3].price; })());
  ok('net is less than list', (() => { const t = buildTiers(o1, dd); return t[1].net.every(n => n.net < t[1].price); })());
  ok('outline has eight spine sections', buildOutline(o1, dd).spine.length === 8);
  ok('outline sections non-empty', buildOutline(o1, dd).sections.every(s => s.h && (s.body || (s.list && s.list.length))));
  ok('workflow hours sum to build hours', near(buildWorkflow(o1, dd).reduce((a,p) => a + p.hours, 0), o1.buildHours, 0.35));
  ok('QA has seven rows', buildQA(o1, dd).rows.length === 7);
  ok('QA scores bounded', buildQA(o1, dd).rows.every(r => r.score >= 0 && r.score <= 10));
  ok('ecosystem has nine rungs', buildEcosystem(o1, dd).length === 9);
  ok('ecosystem lead magnet is free', buildEcosystem(o1, dd)[0].price === 0);

  const cat = buildCatalogue(dd, 25);
  ok('catalogue hits its target', cat.rows.length === Math.min(25, dd.opps.length));
  ok('catalogue numbers are sequential', cat.rows.every((r, i) => r.n === i + 1));
  ok('catalogue days increase', cat.rows.every((r, i) => i === 0 || r.day >= cat.rows[i-1].day));
  ok('catalogue caps type repeats', (() => {
    const c = {}; cat.rows.forEach(r => c[r.opp.typeId] = (c[r.opp.typeId] || 0) + 1);
    return Object.values(c).every(n => n <= 2);
  })());
  ok('catalogue stages assigned', cat.rows.every(r => ['infrastructure','compounding','acceleration'].includes(r.stage)));

  const econ = buildEconomics(dd, 1);
  ok('economics finite', econ.scen.every(x => isFinite(x.net) && isFinite(x.gross)));
  ok('economics ordered by conversion', econ.scen[0].gross <= econ.scen[1].gross && econ.scen[1].gross <= econ.scen[2].gross);
  ok('AOV inside the tier range', (() => { const t = buildTiers(o1, dd); return econ.aov >= t[0].price * 0.3 && econ.aov <= t[3].price; })());
  ok('projection is twelve months', buildProjection(dd, cat).length === 12);
  ok('scaling covers five sizes', buildScaling(dd, cat).length === 5);
  ok('recurring has four clubs', buildRecurring(dd, cat).length === 4);

  /* validation behaviour */
  const vEmpty = validationFor(fx, o1.id);
  ok('empty validation has no decision', vEmpty.decision === 'unknown' && !vEmpty.complete);
  const fx2 = repair(Object.assign({}, fx, { selected:o1.id,
    validation:{ [o1.id]:{ mkt:0, proven:0, ceiling:0, comm:0, threads:0, intent:0 } } }));
  ok('no evidence is rejected', validationFor(fx2, o1.id).decision === 'reject');
  const fx3 = repair(Object.assign({}, fx, { selected:o1.id,
    validation:{ [o1.id]:{ mkt:22, proven:6, ceiling:90, comm:5, threads:9, intent:8 } } }));
  const v3 = validationFor(fx3, o1.id);
  ok('strong evidence proceeds', v3.decision === 'proceed' && v3.score >= 72);
  ok('validation score bounded', v3.score >= 0 && v3.score <= 100);
  ok('partial answers give no verdict', validationFor(repair(Object.assign({}, fx, {
    validation:{ [o1.id]:{ mkt:22, proven:6 } } })), o1.id).decision === 'unknown');

  /* listings respect every platform limit */
  const dd3 = (() => { S = fx3; const d = derive(); return d; })();
  const listings = buildListings(dd3.selected, dd3);
  ok('listings generated for each platform', listings.length === dd3.platforms.length);
  ok('listing titles within limit', listings.every(l => l.titleLen <= l.titleMax));
  ok('listing bodies within limit', listings.every(l => l.descLen <= l.descMax));
  ok('listing tags within limit', listings.every(l => l.tags.length <= l.tagMax &&
    l.tags.every(t => t.length <= PLATFORMS[l.key].limits.tagLen)));
  ok('meta title within 60', listings.every(l => l.metaTitle.length <= 60));
  ok('meta description within 155', listings.every(l => l.metaDesc.length <= 155));
  ok('net per sale below list', listings.every(l => l.net < l.price && l.net > 0));

  const kw = keywordSets(dd3.selected, dd3);
  ok('keywords generated', kw.all.length >= 40);
  ok('keywords unique', uniq(kw.all).length === kw.all.length);
  ok('no empty keywords', kw.all.every(k => k.trim().length > 3));

  const content = buildContent(dd3.selected, dd3);
  ok('content plan is 13 weeks', content.plan.length === 13);
  ok('social posts on five channels', Object.keys(content.social).length === 5);
  ok('no unfilled placeholders in posts', Object.values(content.social).every(c =>
    c.posts.every(p => !/\{[a-z]+\}/.test(p.text))));
  const email = buildEmail(dd3.selected, dd3);
  ok('five email sequences', email.sequences.length === 5);
  ok('email days ascend', email.sequences.every(s => s.items.every((i, n) => n === 0 || i.d >= s.items[n-1].d)));

  const funnel = buildFunnel(dd3.selected, dd3);
  ok('funnel has nine stages', funnel.stages.length === 9);
  ok('funnel diagram drawn', funnel.diagram.split('\n').length > 15);
  const lic = buildLicences(dd3.selected, dd3);
  ok('six licences', lic.length === 6);
  ok('licences carry the product name', lic.every(l => l.text.includes(dd3.selected.name)));
  ok('six SOPs', buildSOPs(dd3.selected, dd3).length === 6);

  const board = buildBoard(dd3);
  ok('board scores eight seats', board.rows.length === 8);
  ok('board scores bounded', board.rows.every(r => r.score >= 0 && r.score <= 10));
  ok('board approval bounded', board.approval >= 0 && board.approval <= 100);
  ok('board has a verdict', !!board.verdict.label);
  const fxU = repair(Object.assign({}, fx, { selected:o1.id, validation:{} }));
  S = fxU;
  ok('board blocks the unvalidated', buildBoard(derive()).verdict.key === 'blocked');

  /* the deliverable */
  S = fx3;
  const dd4 = derive();
  const doc = buildDossier(dd4);
  ok('dossier carries all fifteen sections', [
    'Opportunity analysis','Validation report','Product blueprint','Product content','Product assets',
    'Marketplace listings','Marketing assets','Email funnel','Pricing strategy','Catalogue strategy',
    'Automation plan','Scaling roadmap','Licensing plan','Revenue arithmetic','Board review'
  ].every(h => doc.includes('· ' + h)));
  ok('dossier is substantial', wc(doc) > 4000);
  ok('dossier leaves no placeholders', !/\{[A-Za-z]+\}/.test(doc.replace(/\{braces\}/g,'')));
  ok('dossier has no undefined', !/\bundefined\b/.test(doc) && !/\bNaN\b/.test(doc));
  ok('opportunity CSV row count', opportunityCSV(dd4).split('\r\n').length === dd4.opps.length + 1);
  ok('catalogue CSV row count', catalogueCSV(dd4).split('\r\n').length === buildCatalogue(dd4, dd4.s.catalogueTarget).rows.length + 1);

  /* unvalidated dossier must say so */
  S = fxU;
  ok('unvalidated dossier warns', buildDossier(derive()).includes('NOT VALIDATED'));

  /* state repair */
  ok('repair survives junk', (() => { const r = repair({ assets:'nonsense', hours:-4, market:'atlantis' });
    return r.assets.length >= 1 && r.hours >= 1 && MARKETS[r.market]; })());
  ok('repair keeps at least one platform', (() => repair({ platforms:{} }).platforms.gumroad === true)());
  ok('repair caps assets at 12', repair({ assets: new Array(40).fill({ name:'x' }) }).assets.length === 12);
  ok('repair gives assets unique ids', (() => {
    const r = repair({ assets:[{ id:'a', name:'x' }, { id:'a', name:'y' }] });
    return r.assets[0].id !== r.assets[1].id; })());

  S = prevS;
  return { pass, fails };
}

/* ---------- init ---------- */
function init(){
  try { const th = localStorage.getItem(STORE_KEY + '.theme'); if(th) document.documentElement.setAttribute('data-theme', th); } catch(_){}
  S = load();
  buildTabs();
  bindEvents();
  render();

  const t0 = performance.now();
  let res;
  try { res = selfCheck(); }
  catch(err){ res = { pass:0, fails:['self-check crashed: ' + (err && err.message)] }; console.error(err); }
  const ms = Math.round(performance.now() - t0);
  const foot = $('#foot-tests');
  if(res.fails.length){
    foot.innerHTML = '<strong style="color:var(--bad)">' + res.fails.length + ' self-checks failed</strong> of ' +
      (res.pass + res.fails.length) + ' — ' + esc(res.fails.slice(0, 3).join('; '));
    console.error('Self-check failures:', res.fails);
  } else {
    foot.textContent = res.pass.toLocaleString() + ' self-checks passed in ' + ms + ' ms';
  }
  /* the render above ran before the checks touched S; put the panel back in
     case a check left the world somewhere else */
  render();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
