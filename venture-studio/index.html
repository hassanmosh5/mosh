<script>
"use strict";
/* ==========================================================================
   Phase 20: the board.

   Eight seats reading the same dossier from eight directions. Each one scores
   it, names the risk it can see from where it sits, and makes one demand. A
   board that only ever approves is a rubber stamp with a job title, so three
   of these seats are wired to be hard to please.
   ========================================================================== */
function buildBoard(D){
  const o = D.selected;
  const s = D.s;
  const val = D.val;
  const qa = buildQA(o, D);
  const cat = buildCatalogue(D, s.catalogueTarget);
  const econ = buildEconomics(D, 1);
  const eco = buildEcosystem(o, D);
  const base = econ.scen.find(x => x.key === 'base');
  const low = econ.scen.find(x => x.key === 'low');
  const kw = keywordSets(o, D);
  const hasProof = String(o.asset.evidence || '').trim().length > 15;
  const validated = val && val.complete;
  const decision = validated ? val.decision : 'unknown';
  const commRow = validated ? (val.rows.find(r => r.check.id === 'comm') || {}).value || 0 : 0;
  const threadRow = validated ? (val.rows.find(r => r.check.id === 'threads') || {}).value || 0 : 0;
  const ceiling = validated ? (val.rows.find(r => r.check.id === 'ceiling') || {}).value || 0 : 0;

  const seats = [
    { id:'strategy',
      score: clamp(4 + (validated ? 2 : -2) + (decision === 'proceed' ? 2 : 0) + (o.scores.compet - 5) * 0.4 + (eco.length >= 8 ? 1 : 0), 0, 10),
      finding: validated
        ? 'This is one product with a ladder of nine rungs behind it, which is the only reason it is worth thirty hours.'
        : 'There is no validated position here yet, only a well-formed idea. Strategy cannot approve an idea.',
      risk: o.scores.compet < 4
        ? 'The shelf is crowded and the plan wins on nothing in particular. That is a marketing-spend fight, and you do not have a marketing budget.'
        : 'The catalogue depends on ' + D.assets.length + ' knowledge asset' + (D.assets.length === 1 ? '' : 's') + '. ' + (D.assets.length < 3 ? 'That is too few; one exhausted asset stops the studio.' : 'Adequate, but add one every quarter.'),
      demand: validated ? 'Commit to the ecosystem, not the product. Build rungs 1–3 before starting a second knowledge asset.'
                        : 'Complete the validation worksheet. Thirty minutes.' },

    { id:'finance',
      score: clamp(3 + (base.net > 300 ? 3 : base.net > 100 ? 2 : base.net > 30 ? 1 : 0) + (low.net > 0 ? 1.5 : -1) + (o.scores.profit - 5) * 0.5 + (D.feePct < 8 ? 1 : 0), 0, 10),
      finding: 'At ' + usd(econ.aov) + ' average order value and ' + pct(D.feePct) + ' in platform fees, the base case is ' + usd(base.net) + ' a month from one live product, on ' + econ.visits.toLocaleString() + ' assumed visits.',
      risk: low.net <= 0
        ? 'The pessimistic column is negative. You are paying ' + usd(econ.monthlyPlatformCost) + ' a month in platform fees against traffic you do not yet have.'
        : 'The whole model rests on ' + econ.visits.toLocaleString() + ' monthly visits, of which ' + econ.shelfVisits.toLocaleString() + ' are assumed shelf traffic that a new listing will not receive for sixty days.',
      demand: (econ.monthlyPlatformCost > 0
        ? 'You are committed to ' + usd(econ.monthlyPlatformCost) + '/month in platform subscriptions before a single sale. Drop them until a free platform has produced one.'
        : 'Stay on the platforms that charge nothing monthly until one of them has produced a sale. A subscription is a bet on traffic you have not measured.') +
        ' The build costs ' + hrs(o.buildHours) + '; at ' + usd(base.net) + '/mo it repays in ' +
        (base.net > 0 ? Math.ceil(o.buildHours * 15 / base.net) + ' months' : 'no finite number of months') +
        ' with your time valued at ' + usd(15) + '/h.' },

    { id:'marketing',
      score: clamp(2.5 + (commRow >= 3 ? 3 : commRow >= 1 ? 1.5 : 0) + (threadRow >= 4 ? 2 : threadRow >= 1 ? 1 : 0) + (s.audience >= 1000 ? 2 : s.audience >= 200 ? 1 : 0), 0, 10),
      finding: s.audience > 0
        ? 'An audience of ' + s.audience.toLocaleString() + ' at ' + pct((ASSUMPTIONS.reach[s.visibility]||0) * 100, 0) + ' reach gives ' + econ.audienceVisits.toLocaleString() + ' people who will see the launch.'
        : 'No audience at all. Every visitor has to be earned or bought, and you have not budgeted to buy any.',
      risk: commRow === 0
        ? 'Validation could not name one community where these buyers gather. Without that, launch day is a listing and a hope.'
        : 'The 90-day plan needs one long piece a fortnight and three posts a week — about 90 minutes weekly out of your ' + s.hours + '. That is real, recurring time nobody has costed.',
      demand: 'Launch into the ' + Math.max(1, commRow) + ' named communit' + (commRow === 1 ? 'y' : 'ies') + ' first, marketplace second. Post the method for four weeks before mentioning the product once.' },

    { id:'seo',
      score: clamp(o.scores.seo * 0.8 + (kw.longtail.length >= 10 ? 1.5 : 0) + (kw.intentSplit.transactional >= 15 ? 1 : 0) - (D.market.seo < 0 ? 1 : 0), 0, 10),
      finding: kw.all.length + ' keywords generated: ' + kw.primary.length + ' transactional, ' + kw.secondary.length + ' buyer-qualified, ' + kw.longtail.length + ' long-tail.',
      risk: o.scores.seo < 6
        ? 'This product type is not naturally findable. People do not search for it; they are shown it. SEO will not be the channel.'
        : 'Marketplace ranking follows sales, and sales follow ranking. The first ten sales have to come from somewhere else entirely.',
      demand: 'Put the long-tail phrases into titles verbatim, including the awkward ones. Nobody searches the way a title reads well.' },

    { id:'product',
      score: clamp(qa.avg * 0.85 + (hasProof ? 1 : -0.5), 0, 10),
      finding: 'Quality assurance averages ' + qa.avg + '/10 across seven categories, with ' + qa.failing.length + ' below the 8/10 bar.',
      risk: qa.failing.length
        ? 'Failing: ' + qa.failing.map(f => f.k.toLowerCase()).join(', ') + '. Shipping under the bar is how a catalogue acquires a reputation it cannot outrun.'
        : 'Nothing failing, which usually means the scoring is too generous. Have someone who is not you score it again.',
      demand: qa.failing.length
        ? 'Fix ' + qa.failing[0].k.toLowerCase() + ' before the polish pass: ' + qa.failing[0].fix
        : 'Ship it, then re-score after the first ten buyers have used it.' },

    { id:'customer',
      score: clamp(4 + (firstUseMinutes(o) <= 20 ? 2 : 0) + (s.refund >= 7 ? 1.5 : s.refund >= 3 ? 0.5 : -1) + (assetAudienceClause(o.asset) || o.asset.buyer ? 2 : 0), 0, 10),
      finding: 'Time to first useful output: ' + firstUseMinutes(o) + ' minutes. Refund window: ' + s.refund + ' days.',
      risk: s.refund < 7
        ? 'A refund window under seven days reads as a trap, and in the EU it is not even yours to set.'
        : 'The gate — "' + o.type.gate + '" — is a real limit. If it appears first in the refund email rather than on the sales page, every one of those refunds was avoidable.',
      demand: 'Put the gate on the sales page, above the price. A product that names what it cannot do gets fewer refunds and better reviews.' },

    { id:'risk',
      score: clamp(6 + (validated ? 1.5 : -3) + (o.type.id === 'contract' ? -3 : 0) + (o.type.upkeep > 2.5 ? -1.5 : 0) + (hasProof ? 1 : -1), 0, 10),
      finding: riskFinding(o, D, validated),
      risk: o.type.upkeep > 2.5
        ? 'Upkeep is ' + o.type.upkeep + ' h/month for this one product. At ' + s.catalogueTarget + ' products the catalogue’s upkeep alone is ' + round(cat.totalUpkeep, 0) + ' h/month against your ' + round(s.hours * 4.33, 0) + '.'
        : 'Every dated claim in this product — prices, fees, model names, screenshots — is a future support ticket. There are more of them than you think.',
      demand: riskDemand(o, D, validated) },

    { id:'innovation',
      score: clamp(3 + (10 - o.type.crowd) * 0.4 + (o.scores.compet - 5) * 0.3 + (o.asset.depth - 3) * 0.6 + (D.market.crowd < 0 ? 1.5 : 0), 0, 10),
      finding: o.type.crowd >= 8
        ? 'This is the most crowded shelf in the catalogue. Everything depends on the buyer being narrower than everyone else’s.'
        : 'A comparatively open shelf, which usually means smaller demand rather than a missed opportunity. Check that it is the first and not the second.',
      risk: 'The obvious next product is another one of these. Doing that four times produces a catalogue that competes with itself.',
      demand: 'Take one thing from the ecosystem ladder that is not the same shape as this — ' + (eco.find(e => e.role === 'Membership') || {}).name + ' or ' + (eco.find(e => e.role === 'Consulting') || {}).name + ' — and cost it properly before building a second ' + o.type.label.toLowerCase() + '.' }
  ];

  const rows = seats.map(x => {
    const meta = BOARD.find(b => b.id === x.id);
    return Object.assign({}, x, { label:meta.label, glyph:meta.glyph, score: round(x.score, 1) });
  });

  const approval = round(rows.reduce((a, r) => a + r.score, 0) / rows.length * 10, 0);
  const blockers = rows.filter(r => r.score < 5);
  let verdict;
  if(!validated) verdict = { key:'blocked', label:'Blocked — not validated', pill:'bad',
    note:'The board does not review unvalidated products. Six answers, thirty minutes, then come back.' };
  else if(decision === 'reject') verdict = { key:'blocked', label:'Blocked — validation says no', pill:'bad',
    note:'The worksheet rejected this. Overruling your own validation is the single most expensive habit in this business.' };
  else if(blockers.length >= 3) verdict = { key:'blocked', label:'Blocked', pill:'bad',
    note: blockers.length + ' seats scored under 5. Fix their demands and re-submit.' };
  else if(approval >= 72 && !blockers.length) verdict = { key:'approved', label:'Approved', pill:'good',
    note:'Build it. Start the draft pass this week; the approval decays as fast as the research behind it.' };
  else verdict = { key:'conditions', label:'Approved with conditions', pill:'warn',
    note:'Proceed once the demands from the seats scoring under 7 have been met. They are listed in order of severity.' };

  return { rows, approval, verdict, blockers, qa, conditions: rows.filter(r => r.score < 7).sort((a,b) => a.score - b.score) };
}

function riskFinding(o, D, validated){
  if(o.type.id === 'contract') return 'This is a legal document sold to people who will rely on it. That is a different category of risk from every other product in the catalogue.';
  if(o.type.family === 'ai') return 'The product is instructions to a model that will change underneath it, probably within two quarters.';
  if(o.type.id === 'notes' || o.type.id === 'curriculum') return 'This is tied to a syllabus that changes on someone else’s timetable, and buyers will hold you to the current one.';
  if(!validated) return 'Unvalidated. The dominant risk is thirty hours spent on something nobody was asking for.';
  return 'Ordinary product risk: dated claims, platform fee changes, and a refund policy that has to be honoured on the worst day.';
}
function riskDemand(o, D, validated){
  if(o.type.id === 'contract') return 'A qualified lawyer in the buyer’s jurisdiction reviews it before sale, and the listing carries the words "not legal advice" above the price. Otherwise do not sell it.';
  if(o.type.family === 'ai') return 'Date it on the cover, name the model and the month it was tested, and either budget ' + o.type.upkeep + ' h/month to keep it current or sell it explicitly as a snapshot.';
  if(!validated) return 'Do not build. Validate first — that is what the worksheet is for.';
  return 'Write the limits on the sales page before writing the sales page’s headline. Everything in the gate goes above the price.';
}
</script>
<script>
"use strict";
/* ==========================================================================
   Rendering. Thirteen panels, each a pure function of the derived object.
   Nothing here computes anything; if a number appears below, it was worked out
   in one of the engine files above.
   ========================================================================== */

const TABS = [
  { id:'assets',    label:'🧠 Assets',      phase:'Phase 1' },
  { id:'ideas',     label:'💡 Opportunities',phase:'Phase 2' },
  { id:'validate',  label:'🔎 Validate',    phase:'Phase 3' },
  { id:'blueprint', label:'📐 Blueprint',   phase:'Phase 4 · 6' },
  { id:'build',     label:'🛠 Build',        phase:'Phase 5 · 7' },
  { id:'ecosystem', label:'🪜 Ecosystem',   phase:'Phase 8' },
  { id:'catalogue', label:'📚 Catalogue',   phase:'Phase 9 · 19' },
  { id:'listings',  label:'🛒 Listings',    phase:'Phase 10 · 11' },
  { id:'marketing', label:'📣 Marketing',   phase:'Phase 12 · 13' },
  { id:'funnel',    label:'🔻 Funnel',      phase:'Phase 14 · 15' },
  { id:'ops',       label:'⚙️ Operations',  phase:'Phase 16 · 17 · 18' },
  { id:'board',     label:'⚖️ Board',       phase:'Phase 20' },
  { id:'export',    label:'📤 Export',      phase:'Deliverable' }
];

/* ---------- html helpers ---------- */
function card(title, sub, body, extra){
  return '<section class="card' + (extra ? ' ' + extra : '') + '">' +
    (title ? '<div class="card-hd"><h2>' + esc(title) + '</h2>' + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>' : '') +
    body + '</section>';
}
function sub(title, sub, body){
  return '<div class="card-hd" style="margin-top:18px"><h3>' + esc(title) + '</h3>' +
    (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>' + body;
}
function ul(items){ return '<ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>'; }
function ulEsc(items){ return ul(items.map(esc)); }
function table(head, rows, opts){
  opts = opts || {};
  return '<div class="table-scroll"><table>' +
    '<thead><tr>' + head.map(h => '<th' + (h.num ? ' class="num"' : '') + (h.title ? ' title="' + esc(h.title) + '"' : '') + '>' + esc(h.label != null ? h.label : h) + '</th>').join('') + '</tr></thead>' +
    '<tbody>' + rows.map(r => '<tr' + (r.cls ? ' class="' + r.cls + '"' : '') + (r.attrs || '') + '>' +
      (r.cells || r).map(c => typeof c === 'object'
        ? '<td' + (c.num ? ' class="num"' : '') + '>' + c.html + '</td>'
        : '<td>' + c + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}
function copybox(text, label){
  const id = 'cb' + hash(String(text).slice(0, 200) + label);
  return '<div class="copybox"><button class="btn sm copy-btn" type="button" data-copy="' + id + '">Copy</button>' +
    '<pre id="' + id + '">' + esc(text) + '</pre></div>';
}
function detail(summary, note, body, open){
  return '<details' + (open ? ' open' : '') + '><summary>' + esc(summary) +
    (note ? '<span class="sum-note">' + esc(note) + '</span>' : '') + '</summary>' +
    '<div class="details-body">' + body + '</div></details>';
}
function bar(pct0to100, tone){
  const p = clamp(pct0to100, 0, 100);
  return '<span class="bar' + (tone ? ' ' + tone : '') + '" style="display:block"><span style="width:' + p + '%"></span></span>';
}
function scorePill(n, hi, lo){
  const cls = n >= (hi || 7.5) ? 'good' : n >= (lo || 5) ? 'warn' : 'bad';
  return '<span class="pill ' + cls + '">' + round(n, 1) + '</span>';
}
function stat(lbl, val, s){
  return '<div class="stat"><div class="lbl">' + esc(lbl) + '</div><div class="val">' + val + '</div>' +
    (s ? '<div class="sub">' + esc(s) + '</div>' : '') + '</div>';
}
function noSelection(what){
  return card('Nothing selected', null,
    '<p class="lede">' + esc(what) + '</p>' +
    '<p>Go to <strong>Opportunities</strong>, read the ranking, and pick one. Then fill in the validation worksheet. ' +
    'This app will not design a product it has no evidence for — that refusal is the only thing here worth more than the templates.</p>' +
    '<div class="btn-row"><button class="btn primary" type="button" data-go="ideas">Open Opportunities</button></div>');
}
function needsValidation(D){
  const v = D.val;
  return card('Not validated yet', VALIDATION_MINUTES + ' minutes of work stands between you and this tab',
    '<p class="lede">' + esc(D.selected.name) + ' has ' + v.answered + ' of ' + VALIDATION_CHECKS.length +
    ' validation answers on file. Until all six are in, there is nothing here worth generating.</p>' +
    '<p>The worksheet is not a formality. Six numbers, taken off real marketplaces with your own eyes, decide whether the next ' +
    hrs(D.selected.buildHours) + ' is an asset or a hobby. This file cannot fetch any of them: it makes no network requests, ' +
    'has never seen a marketplace, and would be lying if it filled them in for you.</p>' +
    '<div class="btn-row"><button class="btn primary" type="button" data-go="validate">Open the worksheet</button></div>');
}

/* ---------- Phase 1: assets ---------- */
function renderAssets(D){
  const s = D.s;
  let h = '';

  h += card('The studio', 'Everything downstream is priced, timed and scheduled from these numbers',
    '<div class="grid g3">' +
      field('Studio name', '<input type="text" data-bind="studio" value="' + esc(s.studio) + '">') +
      field('Operator', '<input type="text" data-bind="operator" value="' + esc(s.operator) + '" placeholder="your name — appears on licences">') +
      field('Primary market', select('market', Object.entries(MARKETS).map(([k,v]) => [k, v.label]), s.market)) +
    '</div>' +
    '<div class="grid g4">' +
      field('Hours a week for this', '<input type="number" min="1" max="80" data-bind="hours" value="' + s.hours + '">', 'Build time, not marketing time') +
      field('People who already hear you', '<input type="number" min="0" step="10" data-bind="audience" value="' + s.audience + '">', 'List plus followers who would notice a launch') +
      field('How warm are they', select('visibility', [['cold','Cold — they signed up and forgot'],['warm','Warm — they open things'],['hot','Hot — they reply']], s.visibility)) +
      field('Refund window (days)', '<input type="number" min="0" max="90" data-bind="refund" value="' + s.refund + '">', 'Under 7 reads as a trap') +
    '</div>' +
    '<fieldset><legend>Where you will sell</legend><div class="checks">' +
      Object.entries(PLATFORMS).map(([k,p]) =>
        '<label class="check"><input type="checkbox" data-platform="' + k + '"' + (s.platforms[k] ? ' checked' : '') + '> ' +
        esc(p.label) + ' <span class="tiny muted">' + pct(p.pct) + (p.monthly ? ' + ' + usd(p.monthly) + '/mo' : '') + '</span></label>').join('') +
    '</div><p class="tiny muted" style="margin:10px 0 0">Fees as the studio last recorded them. They change without notice and they are not this file’s to know — check each one before you publish a price.</p></fieldset>' +
    '<p class="note">' + esc(D.market.note) + '</p>');

  h += card('Phase 1 · Knowledge asset inventory', 'What you know that someone else would pay to skip learning',
    '<p class="lede">Nine of ten people list what they are qualified in. The money is in what you are <em>fast</em> at — the thing you do in twenty minutes that takes everyone else a day, whether or not anyone certified you to do it.</p>' +
    '<div id="asset-list">' + s.assets.map((a, i) => assetRow(a, i)).join('') + '</div>' +
    '<div class="btn-row"><button class="btn" type="button" data-act="add-asset">+ Add a knowledge asset</button>' +
    '<span class="tiny muted" style="align-self:center">' + s.assets.length + ' of 12</span></div>');

  const inv = D.assets.map(a => {
    const pay = assetPayFor(a);
    const best = D.opps.filter(o => o.assetId === a.id).slice(0, 3);
    return { cells:[
      '<strong>' + esc(cap(assetSubject(a))) + '</strong><br><span class="tiny muted">' + esc(ORIGINS[a.origin].label) + ' · ' + a.years + ' y</span>',
      esc(cap(buyerShort(a))),
      esc(assetProblem(a)),
      best.map(o => '<span class="pill accent">' + esc(o.type.label) + '</span>').join(' ') +
        '<div class="tiny muted" style="margin-top:4px">strength ' + round(assetStrength(a), 1) + '/10</div>'
    ] };
  });

  h += card('Knowledge Asset Inventory', 'The phase 1 deliverable',
    D.assets.length
      ? table(['Knowledge asset','Buyer type','Problem solved','Product potential'], inv) +
        '<div style="margin-top:14px">' + D.assets.map(a => {
          const p = assetPayFor(a);
          return detail(cap(assetSubject(a)), 'what someone would pay for',
            '<dl class="kv">' +
            '<dt>To learn</dt><dd>' + esc(p.learn) + '</dd>' +
            '<dt>To save time on</dt><dd>' + esc(p.time) + '</dd>' +
            '<dt>To automate</dt><dd>' + esc(p.automate) + '</dd>' +
            '<dt>To simplify</dt><dd>' + esc(p.simplify) + '</dd>' +
            '<dt>Evidence</dt><dd>' + esc(String(a.evidence||'').trim() || '— none recorded, which is a problem for the sales page and not for this table') + '</dd>' +
            '</dl>');
        }).join('') + '</div>'
      : '<p class="note warn">No assets with a name yet. Type one above — a phrase, not a job title: <em>“closing sales over WhatsApp for small shops”</em> beats <em>“sales”</em> by a mile, because the second one cannot be searched for.</p>');

  return h;
}

function assetRow(a, i){
  return '<fieldset data-asset-row="' + esc(a.id) + '">' +
    '<legend>Asset ' + (i + 1) + '</legend>' +
    '<div class="grid g2">' +
      field('What you know <span class="hint">— a phrase, and put “for <em>whoever</em>” on the end if you can</span>',
        '<input type="text" data-asset="' + esc(a.id) + '" data-field="name" value="' + esc(a.name) + '" placeholder="closing sales over WhatsApp for small shops">') +
      field('Where it came from', select2('origin', Object.entries(ORIGINS).map(([k,v]) => [k, v.label]), a.origin, a.id)) +
    '</div>' +
    '<div class="grid g4">' +
      field('Years doing it', '<input type="number" min="0" max="50" data-asset="' + esc(a.id) + '" data-field="years" value="' + a.years + '">') +
      field('Depth <span class="hint">1–5</span>', range(a.id, 'depth', a.depth, 'Can you teach past the surface?')) +
      field('Proof <span class="hint">1–5</span>', range(a.id, 'proof', a.proof, 'What have you actually kept?')) +
      field('Buyer <span class="hint">— optional override</span>', '<input type="text" data-asset="' + esc(a.id) + '" data-field="buyer" value="' + esc(a.buyer) + '" placeholder="derived from the phrase above">') +
    '</div>' +
    field('Evidence <span class="hint">— one line. This ends up on the sales page, so it has to be true.</span>',
      '<textarea data-asset="' + esc(a.id) + '" data-field="evidence" placeholder="ran WhatsApp sales for 40+ Accra retailers; kept the scripts and the numbers">' + esc(a.evidence) + '</textarea>') +
    '<div class="btn-row"><button class="btn sm" type="button" data-act="del-asset" data-id="' + esc(a.id) + '">Remove this asset</button></div>' +
  '</fieldset>';
}
function field(label, control, hint){
  return '<div class="field"><label>' + label + '</label>' + control +
    (hint ? '<div class="tiny muted" style="margin-top:4px">' + esc(hint) + '</div>' : '') + '</div>';
}
function select(bind, pairs, val){
  return '<select data-bind="' + bind + '">' + pairs.map(([k, l]) =>
    '<option value="' + esc(k) + '"' + (k === val ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
}
function select2(fieldName, pairs, val, assetId){
  return '<select data-asset="' + esc(assetId) + '" data-field="' + fieldName + '">' + pairs.map(([k, l]) =>
    '<option value="' + esc(k) + '"' + (k === val ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>';
}
function range(assetId, f, val, hint){
  return '<div class="row"><input type="range" min="1" max="5" step="1" data-asset="' + esc(assetId) + '" data-field="' + f + '" value="' + val + '">' +
    '<span class="slider-val">' + val + '</span></div>' +
    '<div class="tiny muted">' + esc(hint) + '</div>';
}

/* ---------- Phase 2: the opportunity engine ---------- */
let ideaFilter = { family:'', asset:'', sort:'score', limit:30 };

function renderIdeas(D){
  const s = D.s;
  if(!D.opps.length){
    return card('Nothing to rank yet', null, '<p class="lede">Give at least one knowledge asset a name on the Assets tab. ' +
      'Every idea in this studio is an asset seen through one of ' + TYPES.length + ' product types; with no asset there is nothing to see through them.</p>' +
      '<div class="btn-row"><button class="btn primary" type="button" data-go="assets">Back to Assets</button></div>');
  }

  let rows = D.opps.slice();
  if(ideaFilter.family) rows = rows.filter(o => o.type.family === ideaFilter.family);
  if(ideaFilter.asset)  rows = rows.filter(o => o.assetId === ideaFilter.asset);
  if(ideaFilter.sort === 'perHour') rows.sort((a,b) => b.perHour - a.perHour);
  else if(ideaFilter.sort === 'fast') rows.sort((a,b) => a.buildHours - b.buildHours || b.score - a.score);
  else if(ideaFilter.sort === 'price') rows.sort((a,b) => b.price - a.price || b.score - a.score);
  const shown = rows.slice(0, ideaFilter.limit);

  let h = card('Phase 2 · The opportunity engine',
    D.assets.length + ' asset' + (D.assets.length === 1 ? '' : 's') + ' × ' + TYPES.length + ' product types = ' + D.opps.length + ' scored ideas',
    '<p class="lede">Every knowledge asset is crossed with every product type, and all of them are scored on the same six criteria. ' +
    'Scoring the bad ones too is the point: it is how you find out that your best asset makes a mediocre ebook and an excellent spreadsheet.</p>' +
    '<div class="grid g4">' +
      field('Family', '<select data-filter="family"><option value="">All families</option>' +
        Object.entries(FAMILIES).map(([k,v]) => '<option value="' + k + '"' + (ideaFilter.family === k ? ' selected' : '') + '>' + v.glyph + ' ' + esc(v.label) + '</option>').join('') + '</select>') +
      field('From asset', '<select data-filter="asset"><option value="">All assets</option>' +
        D.assets.map(a => '<option value="' + esc(a.id) + '"' + (ideaFilter.asset === a.id ? ' selected' : '') + '>' + esc(truncate(cap(assetSubject(a)), 40)) + '</option>').join('') + '</select>') +
      field('Order by', '<select data-filter="sort">' +
        [['score','Composite score'],['perHour','Score per build hour'],['fast','Fastest to build'],['price','Highest price']]
        .map(([k,l]) => '<option value="' + k + '"' + (ideaFilter.sort === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>') +
      field('Show', '<select data-filter="limit">' + [10,30,60,120,999].map(n =>
        '<option value="' + n + '"' + (ideaFilter.limit === n ? ' selected' : '') + '>' + (n === 999 ? 'Everything' : 'Top ' + n) + '</option>').join('') + '</select>') +
    '</div>');

  const head = [
    '#','Product','Type',
    {label:'Dem', num:true, title:'Demand — how many people pay for this shape of thing'},
    {label:'Prof', num:true, title:'Profitability — price achieved against hours spent, after platform fees'},
    {label:'Ease', num:true, title:'Ease of creation, adjusted for your depth in the subject and your weekly hours'},
    {label:'Scale', num:true, title:'Scalability — marginal cost of the thousandth sale, less the upkeep burden'},
    {label:'Comp', num:true, title:'Competition — 10 means an empty shelf, 0 means a wall of them'},
    {label:'SEO', num:true, title:'SEO potential — how findable it is by someone typing a problem into a box'},
    {label:'Score', num:true, title:'Weighted composite, 0–100'},
    {label:'Build', num:true}, {label:'Price', num:true}, ''
  ];
  const body = shown.map((o, i) => ({
    cls: D.selected && D.selected.id === o.id ? 'is-picked' : '',
    cells:[
      String(i + 1),
      '<strong>' + esc(o.name) + '</strong><br><span class="tiny muted">' + esc(truncate(o.promise, 96)) + '</span>',
      FAMILIES[o.type.family].glyph + ' ' + esc(o.type.label),
      { num:true, html: round(o.scores.demand, 1) },
      { num:true, html: round(o.scores.profit, 1) },
      { num:true, html: round(o.scores.ease, 1) },
      { num:true, html: round(o.scores.scale, 1) },
      { num:true, html: round(o.scores.compet, 1) },
      { num:true, html: round(o.scores.seo, 1) },
      { num:true, html: '<strong>' + o.score + '</strong>' },
      { num:true, html: hrs(o.buildHours) },
      { num:true, html: usd(o.price) },
      '<button class="btn sm" type="button" data-pick="' + esc(o.id) + '"' +
        (D.selected && D.selected.id === o.id ? ' aria-pressed="true"' : '') + '>' +
        (D.selected && D.selected.id === o.id ? 'Selected' : 'Select') + '</button>'
    ]
  }));

  h += card(null, null,
    table(head, body) +
    '<p class="tiny muted" style="margin-top:10px">Weights: demand 24%, profitability 20%, competition 16%, ease 14%, scalability 14%, SEO 12%. ' +
    'They are the studio’s weights, not laws — the constants sit at the top of this file and moving them moves every row.</p>');

  const top = D.opps[0];
  const fastest = D.opps.slice().sort((a,b) => b.perHour - a.perHour)[0];
  const dearest = D.opps.slice().sort((a,b) => b.price - a.price)[0];
  h += card('What the ranking is telling you', null,
    '<div class="grid g3">' +
      stat('Highest score', esc(top.name), top.score + '/100 · ' + hrs(top.buildHours) + ' · ' + usd(top.price)) +
      stat('Best score per hour', esc(fastest.name), fastest.perHour + '/h · ' + hrs(fastest.buildHours)) +
      stat('Highest price', esc(dearest.name), usd(dearest.price) + ' · ' + hrs(dearest.buildHours)) +
    '</div>' +
    '<p style="margin-top:14px">The first ten products in a catalogue are infrastructure: build for score per hour, not for score. ' +
    'A ' + usd(dearest.price) + ' product that takes ' + hrs(dearest.buildHours) + ' before anyone knows your name is a bet on a reputation you have not got yet.</p>' +
    (D.selected ? '<p class="note">Selected: <strong>' + esc(D.selected.name) + '</strong>. ' +
      (D.val && D.val.complete
        ? 'Validation ' + D.val.score + '/100 — ' + esc(DECISIONS[D.val.decision].label) + '.'
        : 'Now go and validate it: ' + (D.val ? D.val.answered : 0) + ' of ' + VALIDATION_CHECKS.length + ' answers on file.') + '</p>'
      : '<p class="note warn">Nothing selected. Every tab after this one is empty until you pick one.</p>'));

  return h;
}

<script>
"use strict";
/* ---------- Phase 3: the thirty-minute validation ---------- */
function renderValidate(D){
  if(!D.selected) return noSelection('Validation is done on one product at a time, against real marketplaces.');
  const o = D.selected, v = D.val;
  const kw = keywordSets(o, D);
  const dec = DECISIONS[v.decision];

  let h = card('Phase 3 · The thirty-minute validation', VALIDATION_MINUTES + ' minutes, six numbers, one decision',
    '<p class="lede">You are about to consider spending <strong>' + hrs(o.buildHours) + '</strong> on <em>' + esc(o.name) +
    '</em>. This worksheet costs ' + VALIDATION_MINUTES + ' minutes and is the only part of the studio that can save the other ' + hrs(o.buildHours) + '.</p>' +
    '<p class="note warn"><strong>This file cannot do any of it for you.</strong> It makes no network requests and has never seen a marketplace. ' +
    'It can tell you exactly what to search for and it can refuse to design anything until you answer — which is what it does.</p>' +
    '<div class="grid g3">' +
      stat('Validation score', v.complete ? v.score + '<span class="muted" style="font-size:.5em">/100</span>' : '—', v.answered + ' of ' + VALIDATION_CHECKS.length + ' answered') +
      stat('Decision', '<span class="pill ' + (dec.pill || '') + '" style="font-size:.5em;vertical-align:middle">' + esc(dec.label) + '</span>', dec.note) +
      stat('At stake', hrs(o.buildHours), 'plus ' + o.type.upkeep + ' h/month for as long as it is listed') +
    '</div>');

  h += card('The six checks', 'Run them in order — each one can end the exercise',
    VALIDATION_CHECKS.map((c, i) => {
      const row = v.rows[i];
      const q = validationQueries(c, o, D, kw);
      return detail((i + 1) + '. ' + c.label, c.mins + ' min' + (row.answered ? ' · ' + row.score + '/100' : ' · unanswered'),
        '<p class="small muted">' + esc(c.why) + '</p>' +
        '<p class="small"><strong>Search this:</strong></p>' + copybox(q.join('\n'), c.label + ' queries') +
        '<div class="grid g2">' +
          field(esc(c.ask) + ' <span class="hint">(0–' + c.max + ')</span>',
            '<input type="number" min="0" max="' + c.max + '" data-val="' + c.id + '" value="' + (row.answered ? row.value : '') + '" placeholder="count it and type it">',
            c.hint) +
          '<div class="field"><label>What that means</label>' +
            (row.answered
              ? '<p class="small" style="margin:0">' + esc(c.read(row.value)) + '</p>' + bar(row.score, row.score >= 70 ? 'good' : row.score >= 45 ? 'warn' : 'bad')
              : '<p class="small muted" style="margin:0">Answer it and this fills in. Guessing here is worse than not doing it, because a guessed number gets treated as evidence for the next thirty hours.</p>') +
          '</div>' +
        '</div>', !row.answered && i === v.answered);
    }).join('') +
    field('Notes from the search <span class="hint">— paste the exact sentences buyers used. They become your listing copy.</span>',
      '<textarea data-val-notes rows="3" placeholder="“I keep losing track of which customer said what on WhatsApp” — r/smallbusiness, 12 replies">' + esc(v.notes) + '</textarea>'));

  if(v.complete){
    h += card('The verdict', v.score + '/100',
      '<div class="grid g2">' +
        '<div>' + table(['Check',{label:'Answer',num:true},{label:'Score',num:true},{label:'Weight',num:true}],
          v.rows.map(r => ({ cells:[
            esc(r.check.label),
            { num:true, html: String(r.value) },
            { num:true, html: r.score + '' },
            { num:true, html: r.check.weight + '%' }
          ]}))) + '</div>' +
        '<div>' +
          '<p class="note ' + (v.decision === 'proceed' ? '' : v.decision === 'reject' ? 'bad' : 'warn') + '">' +
          '<strong>' + esc(dec.label) + '.</strong> ' + esc(dec.note) + '</p>' +
          ul(v.rows.map(r => '<strong>' + esc(r.check.label) + ':</strong> ' + esc(r.check.read(r.value)))) +
        '</div>' +
      '</div>' +
      (v.decision === 'proceed'
        ? '<p class="note">Proceed. The Blueprint tab is now open, and everything downstream of it.</p>'
        : v.decision === 'pivot'
        ? '<p class="note warn">Pivot. Keep the knowledge asset — it is fine — and take a different product type from the ranking. The asset was never the problem.</p>'
        : v.decision === 'refine'
        ? '<p class="note warn">Refine. Narrow the buyer until the search results stop being about everybody, then answer the six again. Usually one word does it.</p>'
        : '<p class="note bad">Reject. Thirty minutes just saved you ' + hrs(o.buildHours) + '. That is the highest-return work available in this studio and it never feels like it at the time.</p>'));
  } else {
    h += card('No verdict yet', null,
      '<p class="lede">' + (VALIDATION_CHECKS.length - v.answered) + ' answer' + (VALIDATION_CHECKS.length - v.answered === 1 ? '' : 's') +
      ' outstanding, worth about ' + VALIDATION_CHECKS.filter((c,i) => !v.rows[i].answered).reduce((a,c) => a + c.mins, 0) + ' minutes.</p>' +
      '<p>Blueprint, Build, Ecosystem, Listings, Marketing, Funnel, Operations, Board and Export stay shut until then. ' +
      'That is deliberate, and it is the single most useful thing this app does.</p>');
  }
  return h;
}

function validationQueries(c, o, D, kw){
  const subject = assetSubject(o.asset);
  const short = shortSubject(o.asset, 3);
  const type = o.type.label.toLowerCase();
  const place = D.market.label;
  return ({
    mkt: [
      short + ' ' + type,
      subject + ' template',
      kw.primary[0],
      kw.primary[1],
      '— count listings a buyer would actually consider, not the results number'
    ],
    proven: [
      'On Etsy: ' + short + ' ' + type + '  → sort by relevance, read the top 10',
      'Count how many show 100+ sales or 100+ reviews',
      'Open the top 3 and note what they include that you were not planning to'
    ],
    ceiling: [
      'gumroad.com/discover?query=' + encodeURIComponent(short + ' ' + type),
      'selar.co  → search: ' + short,
      'Ignore anything with no sales or reviews. A price nobody paid is not a price.'
    ],
    comm: [
      'reddit.com/search?q=' + encodeURIComponent(subject),
      'Facebook groups: ' + subject + ' ' + place,
      'WhatsApp / Discord / Slack communities you could actually name',
      '— count only rooms with 1,000+ members where this buyer already is'
    ],
    threads: [
      'site:reddit.com "' + short + '" (help OR "how do I" OR recommend)',
      'site:quora.com ' + subject,
      'Last 90 days only. Save the exact wording of every one you find.'
    ],
    intent: [
      'Type each into a search box and read the autocomplete, do not press enter:',
      ...kw.primary.slice(0, 6),
      ...kw.longtail.slice(0, 2),
      '— score one point per query whose suggestions include template / download / kit / pdf / buy'
    ]
  })[c.id] || [short + ' ' + type];
}

/* ---------- Phase 4 + 6: blueprint ---------- */
function renderBlueprint(D){
  if(!D.selected) return noSelection('The blueprint is written for one validated product.');
  if(!D.val.complete) return needsValidation(D);
  const o = D.selected;
  const arch = buildArchitecture(o, D);
  const tiers = buildTiers(o, D);
  const outline = buildOutline(o, D);

  let h = card('Phase 4 · Product architecture', o.name,
    '<div class="grid g2">' +
      '<dl class="kv">' +
        '<dt>Product name</dt><dd><strong>' + esc(arch.name) + '</strong></dd>' +
        '<dt>Promise</dt><dd>' + esc(arch.promise) + '</dd>' +
        '<dt>Target audience</dt><dd>' + esc(arch.audience) + '</dd>' +
        '<dt>Not for</dt><dd>' + esc(arch.notFor) + '</dd>' +
        '<dt>Core problem</dt><dd>' + esc(arch.problem) + '</dd>' +
      '</dl>' +
      '<dl class="kv">' +
        '<dt>Desired outcome</dt><dd>' + esc(arch.outcome) + '</dd>' +
        '<dt>Unique mechanism</dt><dd>' + esc(arch.mechanism) + '</dd>' +
        '<dt>Credibility</dt><dd>' + esc(arch.credibility) + '</dd>' +
        '<dt>Evidence</dt><dd>' + esc(arch.proof) + '</dd>' +
        '<dt>Format</dt><dd>' + esc(o.type.deliver) + ' · ' + outline.count + ' ' + esc(outline.unit) + '</dd>' +
      '</dl>' +
    '</div>' +
    '<div class="grid g2" style="margin-top:6px">' +
      '<div class="stat"><div class="lbl">Transformation — from</div><div class="small" style="margin-top:6px">' + esc(arch.transformation.from) + '</div></div>' +
      '<div class="stat"><div class="lbl">Transformation — to</div><div class="small" style="margin-top:6px">' + esc(arch.transformation.to) + '</div></div>' +
    '</div>' +
    '<p class="note warn" style="margin-top:14px"><strong>The gate.</strong> ' + esc(arch.gate) +
    ' This sentence belongs on the sales page, above the price — not in the refund email.</p>');

  h += card('The four versions', 'One product, four buyers, four different amounts of your time',
    '<div class="grid g4">' + tiers.map(t =>
      '<div class="stat"><div class="lbl">' + esc(t.label) + '</div><div class="val">' + usd(t.price) + '</div>' +
      '<div class="sub">' + esc(t.blurb) + '</div>' +
      '<ul class="tiny" style="margin:10px 0 0; padding-left:18px">' + t.includes.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul></div>').join('') +
    '</div>' +
    '<div style="margin-top:14px">' + table(
      ['Tier', {label:'Price', num:true}].concat(D.platforms.map(p => ({label:PLATFORMS[p].label + ' net', num:true}))),
      tiers.map(t => ({ cells:[esc(t.label), {num:true, html:usd(t.price)}].concat(
        D.platforms.map(p => ({ num:true, html: usd(netPerSale(t.price, p)) }))) }))) + '</div>' +
    '<p class="tiny muted" style="margin-top:8px">Net of platform commission and the fixed per-transaction fee, before tax, before refunds (' +
    pct(ASSUMPTIONS.refundRate * 100, 0) + ' assumed) and before whatever your payment processor does to a cross-border card.</p>');

  h += card('Phase 6 · What is actually in it', o.type.label + ' — ' + outline.count + ' ' + outline.unit,
    outline.sections.map(s =>
      '<h4>' + esc(s.h) + '</h4>' + (s.list ? ulEsc(s.list) : '<p>' + esc(s.body) + '</p>')).join('') +
    sub('The spine underneath', 'the same eight movements every product in this studio is built on',
      table(['#','Section','What it does','Worksheet'],
        outline.spine.map(s => ({ cells:[
          String(s.n), '<strong>' + esc(s.title) + '</strong>', esc(s.detail), esc(s.worksheet)
        ]})))) +
    '<p class="note" style="margin-top:14px">Ordered by what breaks first, not by what is easiest to explain. Most products stop after the happy path; sections 5 to 8 are where the refunds are prevented.</p>');

  return h;
}

/* ---------- Phase 5 + 7: build and QA ---------- */
function renderBuild(D){
  if(!D.selected) return noSelection('The production workflow is written for one validated product.');
  if(!D.val.complete) return needsValidation(D);
  const o = D.selected;
  const flow = buildWorkflow(o, D);
  const qa = buildQA(o, D);
  const weeks = round(o.buildHours / Math.max(1, D.s.hours), 1);

  let h = card('Phase 5 · The production workflow', hrs(o.buildHours) + ' — about ' + weeks + ' week' + (weeks === 1 ? '' : 's') + ' at ' + D.s.hours + ' h/week',
    '<p class="lede">Three passes, in this order, and never two at once. Editing while drafting is the most reliable way to spend forty hours producing eleven pages.</p>' +
    table(['Pass', {label:'Hours', num:true}, 'Tools', 'What happens', 'Human gate'],
      flow.map(p => ({ cells:[
        '<strong>' + esc(p.label) + '</strong>',
        { num:true, html: hrs(p.hours) },
        esc(p.tool),
        esc(p.does),
        esc(p.gate)
      ]}))) +
    '<p class="note warn" style="margin-top:14px"><strong>The accuracy pass cannot be automated.</strong> ' + esc(o.type.gate) +
    ' A model will happily generate the section that gets you refunded, and it will be well written.</p>');

  h += card('Phase 7 · Quality assurance', qa.avg + '/10 average · ' + (qa.ship ? 'nothing under the bar' : qa.failing.length + ' under 8/10'),
    table(['Category', {label:'Score', num:true}, '', 'If it is under 8'],
      qa.rows.map(r => ({ cells:[
        '<strong>' + esc(r.k) + '</strong>',
        { num:true, html: scorePill(r.score, 8, 6) },
        { html: bar(r.score * 10, r.score >= 8 ? 'good' : r.score >= 6 ? 'warn' : 'bad') },
        r.pass ? '<span class="tiny muted">passes</span>' : esc(r.fix)
      ]}))) +
    (qa.ship
      ? '<p class="note" style="margin-top:14px">Everything at 8 or above. Which usually means the scoring was generous — hand it to someone who is not you and ask them to find the weakest of the seven.</p>'
      : '<p class="note warn" style="margin-top:14px"><strong>' + qa.failing.length + ' categor' + (qa.failing.length === 1 ? 'y is' : 'ies are') +
        ' under the bar.</strong> Fix them during the accuracy pass, not after launch. Post-launch fixes cost the same hours and arrive with a one-star review attached.</p>'));

  h += card('Tooling', 'What does which part',
    table(['Tool','Used for','Where it must not be trusted'], [
      ['Claude / ChatGPT','The draft pass, section by section, one conversation each','Anything factual, priced, dated, legal, or specific to a jurisdiction'],
      ['Canva','Covers, worksheets, the polish pass, every image in the listing','Font licensing — check every typeface is free on the buyer’s tier, not yours'],
      ['Midjourney / Firefly','Cover art and abstract imagery only','Anything that must depict a real product, person, place or logo'],
      ['Notion / Gamma','Structure, delivery, and the duplicable version','Sharing permissions — duplicate into a clean account before you sell it'],
      ['A spreadsheet','Pricing, unit economics, the catalogue tracker','Nothing. This is the tool that will still work in five years']
    ].map(r => ({ cells: r.map(esc) }))));

  return h;
}

/* ---------- Phase 8: the ecosystem ---------- */
function renderEcosystem(D){
  if(!D.selected) return noSelection('The ecosystem is grown from one validated product.');
  if(!D.val.complete) return needsValidation(D);
  const o = D.selected;
  const eco = buildEcosystem(o, D);
  const totalHours = eco.reduce((a, e) => a + (typeof e.effort === 'number' ? e.effort : 0), 0);

  let h = card('Phase 8 · One product becomes nine', o.name,
    '<p class="lede">Every rung below is cut from material you already made for the core product. The whole ladder costs about ' +
    hrs(round(totalHours, 1)) + ' — roughly ' + round(totalHours / Math.max(1, o.buildHours), 1) + '× the core product — and it is the difference between a listing and a business.</p>' +
    table(['Rung','Product',{label:'Price',num:true},'Cut from',{label:'Effort',num:true},'What it is for'],
      eco.map(e => ({ cells:[
        '<span class="pill accent">' + esc(e.role) + '</span>',
        '<strong>' + esc(e.name) + '</strong>',
        { num:true, html: typeof e.price === 'number' ? (e.price ? usd(e.price) : 'free') : esc(String(e.price)) },
        esc(e.from),
        { num:true, html: typeof e.effort === 'number' ? hrs(e.effort) : esc(String(e.effort)) },
        esc(e.job)
      ]}))));

  h += card('The order to build them in', null,
    '<div class="tree-wrap"><div class="tree">' + esc([
      eco[0].name + '   (free)',
      '   │',
      '   ├── ' + eco[1].name + '   ' + usd(eco[1].price),
      '   │        │',
      '   │        └── ' + eco[2].name + '   ' + usd(eco[2].price) + '   ← the validated product',
      '   │                 │',
      '   │                 ├── ' + eco[3].name + '   ' + usd(eco[3].price) + '   (bump)',
      '   │                 ├── ' + eco[4].name + '   ' + usd(eco[4].price) + '   (upsell)',
      '   │                 └── ' + eco[5].name + '   ' + usd(eco[5].price) + '   (downsell)',
      '   │',
      '   ├── ' + eco[6].name + '   ' + eco[6].price + '   ← only once the catalogue is worth joining',
      '   ├── ' + eco[7].name + '   ' + usd(eco[7].price) + '   ← never advertised',
      '   └── ' + eco[8].name + '   ' + usd(eco[8].price) + '   ← only after the name means something'
    ].join('\n')) + '</div></div>' +
    '<p class="note warn" style="margin-top:14px">Two of these rungs will lose you money if built early. A membership with no archive churns out in six weeks, ' +
    'and a certification issued by someone nobody has heard of devalues the thing it certifies. Build rungs 1 to 6 first; they are all offcuts of work you have already done.</p>');

  return h;
}

/* ---------- Phase 9 + 19: the catalogue ---------- */
function renderCatalogue(D){
  if(!D.opps.length) return card('No catalogue yet', null, '<p class="lede">Name a knowledge asset first.</p>');
  const s = D.s;
  const cat = buildCatalogue(D, s.catalogueTarget);
  const scaling = buildScaling(D, cat);
  const proj = buildProjection(D, cat);

  let h = card('Phase 9 · The catalogue plan', s.catalogueTarget + ' products at ' + s.hours + ' h/week',
    '<p class="lede">Chosen for spread, not just for score: at most two of any one product type, and no single family taking more than a third. ' +
    'Ten variations on one asset is a book that got out of hand, not a catalogue.</p>' +
    '<div class="grid g4">' +
      field('Catalogue target', '<input type="number" min="10" max="100" step="5" data-bind="catalogueTarget" value="' + s.catalogueTarget + '">') +
      stat('Total build', hrs(cat.totalHours), 'at ' + s.hours + ' h/week') +
      stat('Time to finish', round(cat.totalHours / Math.max(1, s.hours) / 4.33, 1) + ' months', 'building only, no marketing') +
      stat('Upkeep at the end', round(cat.totalUpkeep, 1) + ' h/mo', round(cat.totalUpkeep / (s.hours * 4.33) * 100, 0) + '% of your month') +
    '</div>' +
    (cat.stallAt
      ? '<p class="note bad" style="margin-top:14px"><strong>Stall point: product ' + cat.stallAt + '.</strong> ' +
        'At that size, keeping the catalogue correct consumes three quarters of your ' + s.hours + ' hours and there is almost nothing left to build with. ' +
        'Either raise the hours, retire products as you go, or pick types with lower upkeep — the Opportunities tab shows upkeep inside the scalability score. ' +
        '(The Product Factory app runs the same arithmetic from the other direction, on products you have already built.)</p>'
      : '<p class="note" style="margin-top:14px">No stall inside ' + s.catalogueTarget + ' products: upkeep stays under three quarters of your week throughout. ' +
        'Push the target higher and watch for where it breaks — every catalogue has that number.</p>'));

  const stageRow = (label, rows, note) => rows.length
    ? sub(label, rows.length + ' products · ' + hrs(round(rows.reduce((a,r) => a + r.hours, 0), 1)) + ' · ' + note,
        table(['#','Day','Product','Type',{label:'Build',num:true},{label:'Price',num:true},{label:'Score',num:true},'Stage'],
          rows.map(r => ({ cells:[
            String(r.n), 'd' + r.day,
            '<strong>' + esc(r.opp.name) + '</strong>',
            FAMILIES[r.opp.type.family].glyph + ' ' + esc(r.opp.type.label),
            { num:true, html: hrs(r.hours) },
            { num:true, html: usd(r.opp.price) },
            { num:true, html: r.opp.score + '' },
            '<span class="pill' + (r.stage === 'infrastructure' ? ' accent' : r.stage === 'compounding' ? ' warn' : ' good') + '">' + r.stage + '</span>'
          ]}))))
    : sub(label, '0 products', '<p class="note warn">Nothing fits this window at ' + s.hours + ' h/week. That is the plan telling you something true.</p>');

  h += card('30 / 90 / 365', 'the same list, cut three ways',
    stageRow('First 30 days', cat.d30, 'infrastructure: cheap, fast, findable') +
    stageRow('First 90 days', cat.d90, 'the compounding stage begins around product 11') +
    stageRow('First year', cat.d365, 'acceleration from product 26'));

  h += card('Catalogue growth dashboard', 'base-case revenue, with the catalogue growing underneath it',
    table(['Month',{label:'Live',num:true},{label:'Assumed visits',num:true},{label:'Pessimistic',num:true},{label:'Base',num:true},{label:'Cumulative (base)',num:true}],
      proj.map(r => ({ cells:[
        'M' + r.m,
        { num:true, html: String(r.live) },
        { num:true, html: r.visits.toLocaleString() },
        { num:true, html: usd(r.low) },
        { num:true, html: usd(r.base) },
        { num:true, html: usd(r.cumBase) }
      ]}))) +
    '<p class="tiny muted" style="margin-top:10px">Order value each month is computed from the mean price of the products actually live that month, run through the four tier multipliers and the buyer mix.</p>' +
    '<p class="note warn"><strong>Read this as arithmetic, not as a forecast.</strong> Every figure rests on four rates this file invented: ' +
    esc(ASSUMPTIONS.convNote) + ' ' + esc(ASSUMPTIONS.shelfNote) + ' A brand new catalogue with no audience earns nothing for the first two months, and this table does not know that about you.</p>');

  h += card('Phase 19 · What each size costs in people', null,
    table(['Catalogue',{label:'Upkeep/week',num:true},{label:'Left to build',num:true},{label:'% upkeep',num:true},'Hire','Delegate','Automate'],
      scaling.map(r => ({ cls: r.viable ? '' : 'is-picked', cells:[
        r.n + ' products',
        { num:true, html: r.upkeepWeekly + ' h' },
        { num:true, html: r.buildWeekly + ' h' },
        { num:true, html: r.pctUpkeep + '%' },
        esc(r.hire), esc(r.delegate), esc(r.automate)
      ]}))) +
    '<p class="tiny muted" style="margin-top:10px">Rows past your capacity are highlighted. Beyond the plan’s length, upkeep is assumed at 1.4 h/month per additional product.</p>');

  return h;
}

<script>
"use strict";
/* ---------- Phase 10 + 11: listings, SEO, visuals ---------- */
function renderListings(D){
  if(!D.selected) return noSelection('Listings are written for one validated product.');
  if(!D.val.complete) return needsValidation(D);
  const o = D.selected;
  const listings = buildListings(o, D);

  const faq = buildFAQ(o, D);

  let h = card('Phase 10 · Marketplace listings', listings.length + ' platform' + (listings.length === 1 ? '' : 's') + ' · every character limit enforced before you see it',
    '<p class="lede">Four buyers, four pages. The Etsy shopper is browsing, the Gumroad buyer arrived from a link, the Selar buyer is on a phone with a local card, and the Creative Market buyer is comparing craft. One description cannot address all four, so there are four.</p>' +
    listings.map(l => detail(l.label, l.titleLen + '/' + l.titleMax + ' title · ' + l.descLen + '/' + l.descMax + ' body · net ' + usd(l.net),

      '<h4>Title <span class="tiny muted">' + l.titleLen + '/' + l.titleMax + '</span></h4>' + copybox(l.title, 'Title') +
      '<h4>Description <span class="tiny muted">' + l.descLen + '/' + l.descMax + '</span></h4>' + copybox(l.desc, 'Description') +
      (l.tagMax ? '<h4>Tags <span class="tiny muted">' + l.tags.length + '/' + l.tagMax + '</span></h4>' + copybox(l.tags.join(', '), 'Tags') : '') +
      '<h4>Search metadata</h4>' +
      '<dl class="kv"><dt>Meta title</dt><dd>' + esc(l.metaTitle) + ' <span class="tiny muted">(' + l.metaTitle.length + '/60)</span></dd>' +

      '<dt>Price</dt><dd>' + usd(l.price) + ' → you keep ' + usd(l.net) + '</dd></dl>')).join(''));

  h += card('Keywords', kw.all.length + ' phrases · ' + kw.primary.length + ' transactional, ' + kw.secondary.length + ' buyer-qualified, ' + kw.longtail.length + ' long-tail',
    '<div class="grid g3">' +

      '<div><h4>Secondary — buyer-qualified</h4><p class="tiny muted">Narrower audience, better fit. Use in tags and subheadings.</p>' + copybox(kw.secondary.join('\n'), 'Secondary keywords') + '</div>' +
      '<div><h4>Long-tail — the honest ones</h4><p class="tiny muted">Awkward to read, exactly how people type. Use verbatim.</p>' + copybox(kw.longtail.join('\n'), 'Long-tail keywords') + '</div>' +
    '</div>' +
    '<p class="note" style="margin-top:14px">Placement: the primary phrase goes in the first six words of the title, the long-tail phrases go into subheadings and image alt text, and the secondary set carries the tags. ' +
    'A title that reads well to you and matches nothing anyone types is the most common mistake on every one of these platforms.</p>');

  h += card('FAQs', 'answered on the sales page, before the objection has to be typed',
    faq.map(f => detail(f.q, null, '<p>' + esc(f.a) + '</p>')).join(''));

  h += card('Phase 11 · Visual assets', 'prompts and specifications — this file draws nothing',
    '<p class="lede">Palette for this product: <strong>' + esc(vis.palette) + '</strong>. Keep it across the whole ecosystem; a ladder that looks like nine different products sells like nine different products.</p>' +
    '<h4>Cover</h4>' +
    '<p class="small"><strong>Canva</strong></p>' + copybox(vis.cover.canva, 'Canva brief') +
    '<p class="small"><strong>Midjourney</strong></p>' + copybox(vis.cover.midjourney, 'Midjourney prompt') +
    '<p class="small"><strong>Firefly</strong></p>' + copybox(vis.cover.firefly, 'Firefly prompt') +
    sub('Mockups', 'six, in the order they should appear on the listing', ulEsc(vis.mockups)) +
    sub('Thumbnails and pins', null, ulEsc(vis.thumbnails) +
      table(['Pin title','Description'], vis.pins.map(p => ({ cells:[esc(p.title), esc(p.desc)] })))) +
    '<div class="note" style="margin-top:14px">' + ulEsc(vis.rules) + '</div>');

  return h;
}

/* ---------- Phase 12 + 13: content and email ---------- */
function renderMarketing(D){
  if(!D.selected) return noSelection('The content plan is written around one validated product.');

  const e = buildEmail(o, D);

  let h = card('Phase 12 · The content engine', '90 days · one long piece a fortnight · three posts a week',
    '<p class="lede">The plan spends nine weeks not selling. That is not modesty — a new listing has no traffic and no reputation, and the only asset available in month one is being useful in public where the buyers already are.</p>' +
    table(['Week','Phase','Long piece','Posts','Email'],
      c.plan.map(w => ({ cells:[
        'W' + w.week, esc(w.phase), esc(w.long),

      ]}))));

  h += card('Phase 13 · The email system', e.sequences.reduce((a, s) => a + s.items.length, 0) + ' emails across ' + e.sequences.length + ' sequences',

    '</div>' +
    e.sequences.map(s => detail(s.name + ' sequence', s.items.length + ' emails',
      '<p class="small muted">' + esc(s.note) + '</p>' +
      table([{label:'Day',num:true},'Subject','What it does'],
        s.items.map(i => ({ cells:[{num:true, html:'d' + i.d}, '<strong>' + esc(i.s) + '</strong>', esc(i.b)] }))))).join(''));

  return h;
}

/* ---------- Phase 14 + 15: funnel and pricing ---------- */
function renderFunnel(D){

  h += card('Revenue arithmetic', 'three columns, and the middle one is not a promise',

    '<div class="grid g3">' +
      '<div class="stat"><div class="lbl">Assumed monthly visits</div><div class="val">' + econ.visits.toLocaleString() + '</div>' +
      '<div class="sub">' + econ.audienceVisits.toLocaleString() + ' from your ' + D.s.audience.toLocaleString() + '-person audience at ' +

      stat('Fixed cost first', usd(econ.monthlyPlatformCost), 'payable every month whether or not anything sells') +

    table(['Scenario',{label:'Conversion',num:true},{label:'Sales/mo',num:true},{label:'Gross',num:true},{label:'Net after fees & refunds',num:true},{label:'Annualised',num:true}],
      econ.scen.map(s => ({ cells:[
        '<strong>' + esc(s.label) + '</strong>',

        { num:true, html: String(s.sales) },
        { num:true, html: usd(s.gross) },
        { num:true, html: usd(s.net) },

    '</strong> if you value your time at ' + usd(15) + '/hour — and in the pessimistic column, ' +
    (econ.scen[0].net > 0 ? Math.ceil(o.buildHours * 15 / econ.scen[0].net) + ' months' : 'never at all') + '.</p>' +
