<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEAR AI Digital Product Venture Studio — rank what to build, then build the catalogue</title>
<meta name="description" content="Offline venture-studio console: turns a list of things you know into ranked product opportunities, a 30-minute validation worksheet you actually have to fill in, a product blueprint, an ecosystem ladder, a year of catalogue plan, marketplace listings, a funnel, pricing, licences, SOPs and a board review — exported as one dossier.">
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f8f8; --panel:#ffffff; --panel-2:#eef2f2; --ink:#14191a; --ink-2:#48545a;
  --ink-3:#68767e; --line:#dde5e5; --line-2:#c3d0d1;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#e2f3f0;
  --good:#0a7d4c; --good-soft:#e3f6ec; --warn:#8a5a00; --warn-soft:#fdf1d6;
  --bad:#b3261e; --bad-soft:#fbe8e7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(16,26,30,.06),0 4px 16px rgba(16,26,30,.05);
}
html[data-theme="dark"]{
  --bg:#0c1112; --panel:#141a1c; --panel-2:#1b2325; --ink:#e8eeee; --ink-2:#adbcbe;
  --ink-3:#7f9095; --line:#242e30; --line-2:#313e41;
  --accent:#5fd3c4; --accent-ink:#06231f; --accent-soft:#12312d;
  --good:#5cd39b; --good-soft:#102b20; --warn:#e5b95c; --warn-soft:#2c2413;
  --bad:#ff8b82; --bad-soft:#301715;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    --bg:#0c1112; --panel:#141a1c; --panel-2:#1b2325; --ink:#e8eeee; --ink-2:#adbcbe;
    --ink-3:#7f9095; --line:#242e30; --line-2:#313e41;
    --accent:#5fd3c4; --accent-ink:#06231f; --accent-soft:#12312d;
    --good:#5cd39b; --good-soft:#102b20; --warn:#e5b95c; --warn-soft:#2c2413;
    --bad:#ff8b82; --bad-soft:#301715;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .5em}
h1{font-size:1.15rem; letter-spacing:-.01em}
h2{font-size:1.35rem; letter-spacing:-.015em; margin-top:0}
h3{font-size:1.05rem}
h4{font-size:.95rem; color:var(--ink-2)}
p,li,dd{margin:0 0 .9em; overflow-wrap:anywhere}
li{margin-bottom:.25em}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono); font-size:.87em}
pre{

}
hr{border:0; border-top:1px solid var(--line); margin:1.6em 0}

/* ---------- layout ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 18px 80px}
header.top{
  position:sticky; top:0; z-index:40; background:var(--panel);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1180px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .mark{
  width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink);

}
.brand .who{font-size:.72rem; color:var(--ink-3); letter-spacing:.09em; text-transform:uppercase}

}

.tab{

}
.tab:hover{color:var(--ink); background:var(--panel-2)}

.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,

.card{

.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.field:last-child{margin-bottom:0}

.bar.warn > span{background:var(--warn)}

#toast{

.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
footer.foot{border-top:1px solid var(--line); margin-top:30px; padding:18px 0; color:var(--ink-3); font-size:.8rem}

<script>
"use strict";
/* ==========================================================================
   CLEAR AI Digital Product Venture Studio
   One offline file. Nothing here talks to a model and nothing leaves the
   device. It takes a list of things you already know, ranks every product
   that could be cut from them, refuses to design anything you have not
   validated by hand, and then writes the blueprint, the ecosystem, a year of
   catalogue, the listings, the funnel, the licences, the SOPs and a board
   review for the one you picked.

   Every string below is composed by a pure function of your inputs, so the
   same inputs always produce the same dossier. The scores are arithmetic on
   numbers you can see, not predictions. The validation numbers are yours to
   go and find: this file has never seen a marketplace.
   ========================================================================== */

/* ---------- tiny DOM + string helpers ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean); }
function wc(s){ return words(s).length; }
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }
function round(n, dp){ const m = Math.pow(10, dp||0); return Math.round(n*m)/m; }
function uniq(a){ return Array.from(new Set(a)); }
function cap(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
function lower1(s){ s = String(s||''); return s.charAt(0).toLowerCase() + s.slice(1); }
function stripDot(s){ return String(s||'').trim().replace(/[.!?]+$/,''); }
function sentence(s){
  s = String(s||'').trim();
  if(!s) return '';
  return cap(s).replace(/\s+/g,' ') + (/[.!?]$/.test(s) ? '' : '.');
}
function titleCase(s){
  const small = new Set(['a','an','and','as','at','but','by','for','in','of','on','or','over','the','to','up','via','with','without']);
  return String(s||'').trim().split(/\s+/).map((w,i) => {
    /* a word carrying a capital of its own — WhatsApp, SEO, iPhone — keeps it */
    if(/[A-Z]/.test(w.slice(1))) return w;
    const lw = w.toLowerCase();
    if(i > 0 && small.has(lw)) return lw;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}
function joinList(arr, conj){
  const a = (arr||[]).filter(Boolean);
  if(!a.length) return '';
  if(a.length === 1) return a[0];
  if(a.length === 2) return a[0] + ' ' + (conj||'and') + ' ' + a[1];
  return a.slice(0,-1).join(', ') + ', ' + (conj||'and') + ' ' + a[a.length-1];
}
function truncate(s, n){
  s = String(s||'').trim();
  if(s.length <= n) return s;
  const cut = s.slice(0, n - 1);
  const sp = cut.lastIndexOf(' ');
  return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[,;:\-\s]+$/,'') + '…';
}
function slug(s){
  return String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,72) || 'untitled';
}
function fileSafe(s){
  return String(s||'').replace(/[^\w\s.-]/g,'').trim().replace(/\s+/g,'_').slice(0,64) || 'Untitled';
}
/* FNV-1a — used only to spread deterministic choices across a list, never for
   randomness. Same string in, same index out, forever. */
function hash(s){
  let h = 0x811c9dc5;
  s = String(s||'');
  for(let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h >>> 0;
}
function pick(seed, arr){ return arr[hash(seed) % arr.length]; }
function rotate(arr, n){
  if(!arr.length) return [];
  const k = ((n % arr.length) + arr.length) % arr.length;
  return arr.slice(k).concat(arr.slice(0, k));
}
function usd(n){
  n = Number(n)||0;
  return '$' + (Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('en-US')
              : (n % 1 ? n.toFixed(2) : String(Math.round(n))));
}
function money(n){ return usd(n); }
function pct(n, dp){ return round(n, dp == null ? 1 : dp) + '%'; }
function hrs(n){ return round(n, n < 10 ? 1 : 0) + ' h'; }

/* Charm pricing: nearest sensible shelf price, never invented to the cent. */
const CHARM = [7,9,12,15,19,24,29,39,49,59,69,79,89,99,119,129,149,179,199,249,299,349,399,449,499,599,699,799,899,999,1200,1500,2000,2500,3000,4000,5000];
function charm(n){
  n = Math.max(0, Number(n)||0);
  if(n <= 0) return 0;
  let best = CHARM[0], bd = Infinity;
  for(const c of CHARM){ const d = Math.abs(Math.log((c||1)/(n||1))); if(d < bd){ bd = d; best = c; } }
  return best;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2100);
}

/* ---------- persistence ---------- */
const STORE_KEY = 'clearai.venture-studio.v1';

function blankAsset(){
  return { id:'', name:'', origin:'profession', years:3, depth:3, proof:2, evidence:'', buyer:'' };
}

const DEFAULTS = {
  v: 1,
  studio: 'MOSH Digital Studios',
  operator: '',
  market: 'ghana',
  fx: 15.5,
  hours: 10,
  audience: 250,
  budget: 40,
  refund: 4,
  platforms: { gumroad:true, selar:true, etsy:false, payhip:false, stan:false, creative:false, shopify:false },
  assets: [
    { id:'a1', name:'closing sales over WhatsApp for small shops', origin:'profession', years:6, depth:4, proof:3,
      evidence:'ran WhatsApp sales for 40+ Accra retailers; kept the scripts and the numbers', buyer:'' },
    { id:'a2', name:'bookkeeping for market traders with no accountant', origin:'industry', years:4, depth:4, proof:2,
      evidence:'built the spreadsheet three of my cousins still use', buyer:'' },
    { id:'a3', name:'shooting product photos with one phone and daylight', origin:'hobby', years:5, depth:3, proof:3,
      evidence:'shot the catalogue for two clothing brands on a Pixel', buyer:'' }
  ],
  selected: '',
  validation: {},

function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(_){ /* private mode: run from defaults */ }
  if(!raw) return repair(JSON.parse(JSON.stringify(DEFAULTS)));
  try { return repair(JSON.parse(raw)); }
  catch(_){ return repair(JSON.parse(JSON.stringify(DEFAULTS))); }
}

function repair(o){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  if(!o || typeof o !== 'object') return d;
  /* a fresh object, so `d` stays pristine and every fallback below is real —
     Object.assign(d, o) would overwrite the defaults it is falling back to */
  const s = Object.assign({}, d, o);
  s.studio   = String(s.studio || d.studio).slice(0, 80);
  s.operator = String(s.operator || '').slice(0, 80);
  s.market   = MARKETS[s.market] ? s.market : d.market;
  s.fx       = clamp(Number(s.fx) || d.fx, 1, 10000);
  s.hours    = clamp(Math.round(Number(s.hours) || d.hours), 1, 80);
  s.audience = clamp(Math.round(Number(s.audience) || 0), 0, 5000000);
  s.budget   = clamp(Math.round(Number(s.budget) || 0), 0, 100000);
  s.refund   = clamp(Number(s.refund) || 0, 0, 40);
  s.catalogueTarget = clamp(Math.round(Number(s.catalogueTarget) || 25), 10, 100);
  s.visibility = ['cold','warm','hot'].includes(s.visibility) ? s.visibility : 'cold';
  s.platforms = Object.assign({}, d.platforms, s.platforms || {});
  for(const k of Object.keys(s.platforms)){
    if(!PLATFORMS[k]) delete s.platforms[k];
    else s.platforms[k] = !!s.platforms[k];
  }
  if(!Object.values(s.platforms).some(Boolean)) s.platforms.gumroad = true;

  const seen = new Set();
  s.assets = (Array.isArray(s.assets) ? s.assets : []).slice(0, 12).map((a, i) => {
    const b = blankAsset();
    a = a && typeof a === 'object' ? a : {};
    b.name    = String(a.name || '').slice(0, 120);
    b.origin  = ORIGINS[a.origin] ? a.origin : 'profession';
    b.years   = clamp(Math.round(Number(a.years) || 0), 0, 50);
    b.depth   = clamp(Math.round(Number(a.depth) || 3), 1, 5);
    b.proof   = clamp(Math.round(Number(a.proof) || 1), 1, 5);
    b.evidence= String(a.evidence || '').slice(0, 300);
    b.buyer   = String(a.buyer || '').slice(0, 80);
    let id = String(a.id || '').replace(/[^a-z0-9]/gi,'').slice(0,12) || ('a' + (i+1));
    while(seen.has(id)) id = id + 'x';
    seen.add(id);
    b.id = id;
    return b;
  }).filter(a => true);
  if(!s.assets.length) s.assets = [Object.assign(blankAsset(), { id:'a1' })];

  s.validation = (s.validation && typeof s.validation === 'object') ? s.validation : {};
  const vClean = {};
  for(const [k, v] of Object.entries(s.validation)){
    if(!v || typeof v !== 'object') continue;
    const row = {};
    for(const c of VALIDATION_CHECKS){
      const val = v[c.id];
      if(val === '' || val == null) continue;
      row[c.id] = clamp(Number(val) || 0, 0, c.max);
    }
    if(typeof v.notes === 'string') row.notes = v.notes.slice(0, 600);
    vClean[String(k).slice(0, 64)] = row;
  }
  s.validation = vClean;
  s.selected = String(s.selected || '').slice(0, 64);
  s.tab = String(s.tab || 'assets').slice(0, 24);
  return s;
}

let S = null;
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
    catch(_){ /* over quota or blocked: the app still works, it just forgets */ }
  }, 200);
}

/* ---------- download + clipboard ---------- */
function download(filename, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function copyText(text, label){
  const done = () => toast((label || 'Copied') + ' — ' + text.length.toLocaleString() + ' characters');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(_){ toast('Copy failed — select the text and copy by hand'); }
  ta.remove();
}

    read(n){
      if(n === 0) return 'Nobody on page one is selling. Listings without sales prove supply, not demand.';
      if(n <= 2) return 'A trickle. Real, but the category may not support a catalogue.';
      if(n <= 5) return 'Money moves here regularly. Good.';
      return 'A proven, hungry shelf — and, therefore, a crowded one. Your angle has to be specific.';

    hint:'Ignore the ones with no sales. A price nobody pays is not a price.',
    why:'This sets your top tier. Pricing above a proven ceiling needs a reason you can write down.',
    score(n){

    why:'Informational intent gets you readers. Transactional intent gets you buyers.',
    score(n){ return clamp(n * 12 + (n > 0 ? 8 : 0), 0, 100); },

const VALIDATION_MINUTES = VALIDATION_CHECKS.reduce((a,c) => a + c.mins, 0);

const DECISIONS = {
  proceed:{ label:'Proceed', pill:'good', note:'Build it. Start the clock on the production workflow.' },
  refine: { label:'Refine',  pill:'warn', note:'The demand is real and the angle is not. Narrow the buyer, then re-run the checks.' },

/* Board of directors — eight seats, each scoring the same dossier from one
   direction and each able to make a demand of it. */
const BOARD = [
  { id:'strategy', label:'Strategy',   glyph:'♟' },
  { id:'finance',  label:'Finance',    glyph:'💷' },
  { id:'marketing',label:'Marketing',  glyph:'📣' },

const QA_CATEGORIES = ['Clarity','Practicality','Originality','Commercial value','Usability','Completeness','Scalability'];

/* Angles used to write listings, posts and emails. Rotated deterministically so
   two products from the same asset never open with the same sentence. */
const ANGLES = [
  { id:'time',    label:'Time saved',        hook:'It took me {years} years to work this out. It takes you {mins} minutes.' },
  { id:'cost',    label:'Cost avoided',      hook:'The version of this that people pay a consultant for costs {consult}.' },

<script>
"use strict";
/* ==========================================================================
   Phase 1 → 3: knowledge assets, the opportunity engine, and validation.

   Everything here is a pure function of the state object. No sampling, no
   randomness: `pick` and `rotate` are seeded on ids so the fourth idea from
   the second asset is the same idea every time you open the file.
   ========================================================================== */

const STOP = new Set(['a','an','the','and','or','for','with','without','of','to','in','on','over','using','use','my','your','their','no','not','at','by','from','into','that','this','it','is','are','as','how','when','while','about','around']);

/* --- pulling a usable phrase out of what the operator typed --- */
/* Casing is kept as typed — WhatsApp, Excel, SEO all matter — except for the
   first letter, which is lowered so the phrase can sit inside a sentence, and
   for words shouted in full capitals, which are almost never acronyms. */
function normCase(s){
  return String(s||'').split(/\s+/).map(w =>
    (w.length > 4 && w === w.toUpperCase() && /[A-Z]/.test(w)) ? w.toLowerCase() : w).join(' ');
}
function assetSubject(a){
  const raw = String(a && a.name || '').trim().replace(/\s+/g,' ');
  if(!raw) return 'the thing you know';
  const cut = raw.split(/\s+for\s+/i)[0].trim();
  return lower1(normCase(stripDot(cut || raw)));
}
function assetAudienceClause(a){
  const raw = String(a && a.name || '');
  const m = raw.split(/\s+for\s+/i);
  return m.length > 1 ? lower1(normCase(stripDot(m.slice(1).join(' for ').trim()))) : '';
}
function assetBuyer(a){
  const explicit = String(a && a.buyer || '').trim();
  if(explicit) return lower1(stripDot(explicit));
  const clause = assetAudienceClause(a);
  if(clause) return clause;
  const byOrigin = {
    profession:'people doing this job without anyone senior to ask',
    industry:'operators inside this trade who were never shown the system',
    skill:'people who need the result once and do not want to learn the craft',
    life:'people going through it now with nobody to compare notes with',
    hobby:'people one year behind you in the same hobby',
    interest:'the small, serious group who already care about this'
  };
  return byOrigin[a && a.origin] || 'people with this exact problem';
}
/* Two shortenings, for two jobs. Keywords want the stopwords gone — nobody
   searches "over" — and product names want the phrase people actually say. */
function shortSubject(a, maxWords){
  const toks = assetSubject(a).split(/\s+/).filter(w => !STOP.has(w.toLowerCase()));
  return toks.slice(0, maxWords || 4).join(' ') || assetSubject(a);
}
function naturalShort(a, maxWords){
  let toks = assetSubject(a).split(/\s+/).slice(0, maxWords || 4);
  while(toks.length > 1 && STOP.has(toks[toks.length - 1].toLowerCase())) toks.pop();
  return toks.join(' ');
}
function subjectTitle(a){ return titleCase(naturalShort(a, 4)); }
function buyerShort(a){
  const b = assetBuyer(a);
  const toks = b.split(/\s+/);
  return toks.length <= 5 ? b : toks.slice(0, 5).join(' ');
}
function assetProblem(a){
  const s = assetSubject(a);
  const b = buyerShort(a);
  return 'Most ' + b + ' do ' + s + ' from memory, differently every time, and cannot hand it to anyone else.';
}
/* What the asset is worth paying for — the four questions from phase 1. */
function assetPayFor(a){
  const s = assetSubject(a);
  return {
    learn:   'How ' + s + ' is actually done, in order, by someone who has done it',
    time:    'The ' + (ORIGINS[a.origin] ? Math.max(1, a.years) : 3) + ' years of wrong turns they now do not take',
    automate:'The repeatable part of ' + s + ' handed over as a file, not as advice',
    simplify:'One decision replacing the twenty small ones they currently make badly'
  };
}
function assetStrength(a){
  /* 0–10: how much weight this asset can carry commercially */
  const o = ORIGINS[a.origin] || ORIGINS.profession;
  const yrs = clamp(Math.log10(1 + a.years) * 4.6, 0, 6);
  return clamp(o.trust * 0.7 + yrs * 0.45 + (a.depth - 3) * 0.55 + (a.proof - 3) * 0.45 + 3.2, 0, 10);
}

/* --- naming. Two patterns per type, chosen by a hash of the pair, so the same
       asset and type always produce the same product name. --- */
const NAME_PATTERNS = {
  ebook:['The {S} Book','{S}: The Practical Book'],
  guide:['The {S} Quick Guide','{S} in One Sitting'],
  manual:['The {S} Manual','{S}: Operating Manual'],
  report:['The {S} Report','State of {S}'],
  playbook:['The {S} Playbook','{S}: Plays That Run'],
  brief:['{S} Briefing','The {S} Brief'],
  notes:['{S} Notes','{S}: The Condensed Notes'],
  notion:['{S} Notion System','The {S} Workspace'],
  excel:['{S} Spreadsheet','The {S} Workbook'],
  sheets:['{S} Sheets System','{S} Tracker'],
  dashboard:['{S} Dashboard','The {S} Control Panel'],
  checklist:['The {S} Checklist','{S}: Nothing Missed'],
  sop:['{S} SOP Library','The {S} Procedures'],
  canva:['{S} Canva Kit','The {S} Template Set'],
  assets:['{S} Asset Pack','The {S} Graphics Pack'],
  deck:['{S} Deck Template','The {S} Presentation Kit'],
  social:['{S} Social Pack','30 Days of {S} Posts'],
  mockup:['{S} Mockup Pack','The {S} Mockups'],
  prompts:['{S} Prompt Pack','{S}: 60 Prompts That Hold Up'],
  workflow:['The {S} Workflow','{S} End to End'],
  agent:['The {S} Agent','{S} Agent Kit'],
  aisystem:['The {S} System','{S}: The Whole Machine'],
  framework:['The {S} Framework','{S}: A Framework You Can Run'],
  course:['The {S} Course','{S}: The Full Course'],
  minicourse:['{S} in Five Lessons','The {S} Mini Course'],
  workshop:['The {S} Workshop','{S}: Live Build'],
  curriculum:['{S} Curriculum','The {S} Teaching Pack'],
  kit:['The {S} Learning Kit','{S} Starter Kit'],
  proposal:['{S} Proposal Template','The {S} Proposal Kit'],
  contract:['{S} Contract Pack','The {S} Agreements'],
  marketing:['The {S} Marketing System','{S}: Demand on Purpose'],
  sales:['The {S} Sales System','{S}: Close It'],
  ops:['{S} Operations System','The {S} Back Office']
};

const PROMISE_BY_FAMILY = {
  info:     '{B} finish it knowing exactly how {s} is done, in the order it is done.',
  prod:     '{B} open it, put their own numbers in, and have {s} running the same day.',
  creative: '{B} ship finished work for {s} without briefing a designer.',
  ai:       '{B} get the same result out of a model twice on {s}, instead of prompting until something looks right.',
  edu:      '{B} can do {s} unsupervised by the last lesson.',
  biz:      '{B} stop rewriting {s} from scratch for every job.'
};

const MECHANISM_BY_FAMILY = {
  info:'the order — everything in it is sequenced by what breaks first, not by what is easiest to explain',
  prod:'the fill-in — the thinking is already done and encoded in the structure; the buyer only supplies facts',
  creative:'the set — one visual system across every size and format, so the work stops looking assembled',
  ai:'the determinism — fixed inputs, fixed outputs, and a stated failure mode for each one',
  edu:'the assessment — every lesson ends with something the learner does, and a way to see it worked',
  biz:'the handover — it is written to be given to someone else and run without its author'
};

/* --- one opportunity: an asset seen through one product type --- */
function makeOpportunity(a, t, s){
  const mk = MARKETS[s.market] || MARKETS.global;
  const org = ORIGINS[a.origin] || ORIGINS.profession;
  const id = a.id + ':' + t.id;

  /* build hours: depth in the subject shortens the first draft, nothing else does */
  const buildHours = round(t.hours * (1.32 - 0.09 * a.depth), 1);

  /* price band, moved by purchasing power, depth and proof */
  const mid = Math.sqrt(t.lo * t.hi);
  const priceRaw = mid * mk.power * (1 + (a.depth - 3) * 0.09) * (1 + (a.proof - 3) * 0.05);
  const price = charm(priceRaw);

  /* the six ranking criteria, 0–10 each */
  const specificity = clamp((wc(assetSubject(a)) - 2) * 0.5, 0, 2);
  const demand = clamp(t.demand + (org.breadth - 3.5) * 0.5 + (assetAudienceClause(a) ? 0.4 : -0.4), 0, 10);

  const vph = price / Math.max(1, buildHours);
  const feeDrag = averageFeePct(s) / 100 * 3;
  const profit = clamp((vph < 0.5 ? 2 : vph < 1 ? 4 : vph < 2 ? 6 : vph < 4 ? 8 : 9.5) + (t.margin - 6) * 0.35 - feeDrag, 0, 10);

  const weeks = buildHours / Math.max(1, s.hours);
  const ease = clamp(t.ease + (a.depth - 3) * 0.6 - (weeks > 3 ? 1.5 : weeks > 1.5 ? 0.7 : 0), 0, 10);
  const scale = clamp(t.scale - t.upkeep * 0.55, 0, 10);
  const compet = clamp(10 - (t.crowd + mk.crowd), 0, 10);
  const seo = clamp(t.seo + mk.seo + specificity, 0, 10);

  const score = round(
    (demand * 0.24 + profit * 0.20 + ease * 0.14 + scale * 0.14 + compet * 0.16 + seo * 0.12) * 10, 1);

  const pat = pick(id, NAME_PATTERNS[t.id] || ['The {S} ' + t.label]);
  const name = pat.replace('{S}', subjectTitle(a));
  const promise = (PROMISE_BY_FAMILY[t.family] || '{B} get {s} done.')
    .replace('{B}', cap(buyerShort(a)))
    .replace('{s}', assetSubject(a));

  return {
    id, assetId:a.id, typeId:t.id, asset:a, type:t,
    name, promise,
    price, buildHours, upkeep:t.upkeep,
    scores:{ demand, profit, ease, scale, compet, seo },
    score,
    perHour: round(score / Math.max(1, buildHours), 2),
    strength: round(assetStrength(a), 1)
  };
}

function averageFeePct(s){
  const on = Object.keys(s.platforms).filter(k => s.platforms[k] && PLATFORMS[k]);
  if(!on.length) return 10;
  return round(on.reduce((acc,k) => acc + PLATFORMS[k].pct, 0) / on.length, 2);
}
function activePlatforms(s){
  return Object.keys(PLATFORMS).filter(k => s.platforms[k]);
}
function netPerSale(price, key){
  const p = PLATFORMS[key];
  if(!p) return price;
  return round(price * (1 - p.pct / 100) - p.fixed, 2);
}

/* Every asset crossed with every type, ranked. 33 types is small enough that
   the honest thing is to score all of them rather than guess which to show. */
function allOpportunities(s){
  const out = [];
  for(const a of s.assets){
    if(!String(a.name || '').trim()) continue;
    for(const t of TYPES) out.push(makeOpportunity(a, t, s));
  }
  out.sort((x, y) => y.score - x.score || x.buildHours - y.buildHours || x.id.localeCompare(y.id));
  return out;
}

/* ---------------------------------------------------------------------------
   Phase 3: the thirty-minute validation.
   ------------------------------------------------------------------------- */
function validationFor(s, oppId){
  const raw = (s.validation && s.validation[oppId]) || {};
  const rows = VALIDATION_CHECKS.map(c => {
    const has = raw[c.id] != null && raw[c.id] !== '';
    const n = has ? clamp(Number(raw[c.id]) || 0, 0, c.max) : null;
    return { check:c, answered:has, value:n, score: has ? clamp(round(c.score(n), 0), 0, 100) : 0 };
  });
  const answered = rows.filter(r => r.answered).length;
  const totalWeight = VALIDATION_CHECKS.reduce((a,c) => a + c.weight, 0);
  const score = round(rows.reduce((a,r) => a + r.score * r.check.weight, 0) / totalWeight, 0);

  let decision = 'unknown';
  if(answered === VALIDATION_CHECKS.length){
    const get = id => (rows.find(r => r.check.id === id) || {}).value || 0;
    const noEvidence = get('mkt') === 0 && get('threads') === 0 && get('comm') === 0;
    const noMoney = get('proven') === 0 && get('ceiling') === 0;
    if(noEvidence) decision = 'reject';
    else if(noMoney && score < 62) decision = 'reject';
    else if(score >= 72) decision = 'proceed';
    else if(score >= 55) decision = 'refine';
    else if(score >= 38) decision = 'pivot';
    else decision = 'reject';
  }
  return { rows, answered, score, decision, notes:String(raw.notes || ''), complete: answered === VALIDATION_CHECKS.length };
}

/* ---------------------------------------------------------------------------
   The one derived object every render reads from.
   ------------------------------------------------------------------------- */
function derive(){
  const s = S;
  const opps = allOpportunities(s);
  const byId = Object.fromEntries(opps.map(o => [o.id, o]));
  let selected = byId[s.selected] || null;
  if(!selected && opps.length) selected = null; /* nothing is selected until the operator selects it */
  const val = selected ? validationFor(s, selected.id) : null;
  return {
    s, opps, byId, selected, val,
    market: MARKETS[s.market] || MARKETS.global,
    platforms: activePlatforms(s),
    feePct: averageFeePct(s),
    assets: s.assets.filter(a => String(a.name || '').trim())
  };
}
let D = null;

<script>
"use strict";
/* ==========================================================================
   Phase 4 → 8: architecture, the build, quality assurance, and the ecosystem
   one validated product turns into.
   ========================================================================== */

/* The spine. Eight movements that hold for any procedural subject, ordered by
   what breaks first rather than by what is easiest to write. Every outline in
   the app is this spine dressed for its product type — which is a claim worth
   being suspicious of, so it is stated here rather than hidden in a template. */
const SPINE = [
  { k:'diagnose', t:'What actually goes wrong',        d:'The three failures that account for most of the damage, named plainly and in the order they usually arrive.' },
  { k:'decide',   t:'The one decision everything follows from', d:'Get this wrong and the remaining steps cannot save it. A decision table, not a discussion.' },
  { k:'setup',    t:'Setting up before you start',     d:'What has to exist first: accounts, numbers, files, permissions. Fifteen minutes that save a week.' },
  { k:'core',     t:'The sequence, step by step',      d:'The middle of the work, in the order it is actually done, with the timing each step really takes.' },
  { k:'breaks',   t:'The three places it breaks',      d:'Where competent people still fail, why, and what the early warning looks like.' },
  { k:'repair',   t:'What to do when it breaks',       d:'Recovery, not prevention: the thing has already gone wrong and you need it working today.' },
  { k:'handover', t:'Handing it to someone else',      d:'Turning the work into something a second person can run without you standing behind them.' },
  { k:'keep',     t:'Keeping it working after month one', d:'The upkeep nobody budgets for, on a schedule, with what to check and how often.' }
];

const TIER_SPEC = [
  { id:'beginner',   label:'Beginner',   mult:0.45, blurb:'the smallest complete version — one outcome, nothing optional' },
  { id:'pro',        label:'Professional',mult:1.00, blurb:'the product proper; this is the one the sales page is written about' },
  { id:'premium',    label:'Premium',    mult:2.40, blurb:'everything in Professional plus the parts that need your time or your judgement' },
  { id:'enterprise', label:'Enterprise', mult:6.50, blurb:'a licence to deploy it across a team, with the paperwork that makes that legal' }
];

function tierPrice(base, mult, market){
  return charm(base * mult);
}

function buildTiers(o, D){
  const t = o.type;
  const unit = t.unit;
  const n = unitCount(o);
  return TIER_SPEC.map((spec, i) => {
    const price = tierPrice(o.price, spec.mult, D.market);
    const includes = [];
    if(i === 0){
      includes.push('The core ' + unit.replace(/s$/,'') + ' set, cut to the ' + Math.max(3, Math.round(n * 0.35)) + ' that carry most of the result');
      includes.push('Quick start: first useful output inside ' + firstUseMinutes(o) + ' minutes');
      includes.push('Delivered as ' + t.deliver.split(' + ')[0]);
    } else if(i === 1){
      includes.push('All ' + n + ' ' + unit + ', complete');
      includes.push('Delivered as ' + t.deliver);
      includes.push('The eight-part structure in full, including the failure and repair sections');
      includes.push('Worksheets and the fill-in versions of every artefact');
      includes.push('Updates for the life of the product, with a dated change log inside the file');
    } else if(i === 2){
      includes.push('Everything in Professional');
      includes.push('The ' + (t.family === 'edu' ? 'assessment pack and marking guide' : 'audit checklist and scoring sheet'));
      includes.push('Two worked examples carried end to end with real numbers');
      includes.push('A 45-minute recorded walkthrough of the hardest section');
      includes.push('Commercial licence: use it in client work');
    } else {
      includes.push('Everything in Premium');
      includes.push('Team licence for up to 25 named users');
      includes.push('Editable source files, so the buyer can put their own name on the inside pages');
      includes.push('Onboarding call and a training deck for rolling it out internally');
      includes.push('Invoiced, with a purchase order accepted');
    }
    return { id:spec.id, label:spec.label, blurb:spec.blurb, price, includes,
             net: D.platforms.map(p => ({ p, net: netPerSale(price, p) })) };
  });
}

function unitCount(o){
  const t = o.type;
  const base = { chapters:8, steps:12, procedures:14, findings:9, plays:10, sections:7, topics:16,
    databases:5, sheets:7, tabs:8, views:6, items:40, designs:24, assets:60, slides:32, posts:30,
    mockups:12, prompts:60, stages:6, tools:5, modules:6, lessons:5, segments:4, units:8,
    components:6, clauses:14, functions:7 }[t.unit] || 10;
  return Math.round(base * (1 + (o.asset.depth - 3) * 0.08));
}
function firstUseMinutes(o){
  return clamp(Math.round(o.type.hours * 0.55), 5, 45);
}

/* ---------------------------------------------------------------------------
   Phase 4: the architecture.
   ------------------------------------------------------------------------- */
function buildArchitecture(o, D){
  const a = o.asset;
  const subject = assetSubject(a);
  const buyer = assetBuyer(a);
  const yrs = Math.max(1, a.years);
  return {
    name: o.name,
    promise: o.promise,
    audience: cap(buyer),
    notFor: 'Anyone who wants ' + subject + ' explained in general. This names one buyer and refuses the rest.',
    problem: assetProblem(a),
    outcome: cap(buyerShort(a)) + ' can produce ' + o.type.unit.replace(/s$/,'') + '-level work on ' + subject + ' on demand, without you and without improvising.',
    mechanism: MECHANISM_BY_FAMILY[o.type.family],
    transformation: {
      from: 'Doing ' + subject + ' from memory, differently every time, with the quality depending on the day.',
      to:   'Doing ' + subject + ' the same way every time, in a form that can be checked, taught and handed over.'
    },
    proof: String(a.evidence || '').trim() || ('(No evidence recorded for this asset — write one line of it before you publish, or the sales page has nothing true in it.)'),
    credibility: yrs + ' years' + (a.proof >= 4 ? ', with receipts' : a.proof >= 3 ? ', with some evidence kept' : ' — and almost nothing kept to show for it'),
    gate: o.type.gate
  };
}

/* ---------------------------------------------------------------------------
   Phase 6: the type-specific structure. Every product type gets the shape its
   buyers already recognise; the spine underneath is the same.
   ------------------------------------------------------------------------- */
function buildOutline(o, D){
  const t = o.type, a = o.asset;

  const S4 = subjectTitle(a);
  const n = unitCount(o);
  const spine = SPINE.map((sp, i) => ({
    n: i + 1,

  }));

  const out = { kind:t.family, unit:t.unit, count:n, spine, sections:[] };

  if(t.family === 'info'){

      { h:'Title',      body:o.name },

      { h:'Examples',   list: promptCategories(o).slice(0, 4).map(c => c.label + ': a full input and the output it produced, pasted verbatim, model and date noted') },
      { h:'Implementation guide', list: [

  } else if(t.family === 'creative'){

          'Open the link, click Use template, rename the copy',

        ] },

}

/* ---------------------------------------------------------------------------
   Phase 5: the production workflow. Draft pass, accuracy pass, polish pass —
   with the human gates marked, because two of these cannot be automated.
   ------------------------------------------------------------------------- */
function buildWorkflow(o, D){
  const t = o.type;
  const H = o.buildHours;
  const passes = [
    { id:'draft', label:'Draft pass', share:0.45, tool:t.family === 'creative' ? 'Canva or Firefly for layout, a model for the copy' : 'Claude or ChatGPT, one section per conversation',
      does:'Get every section to exist badly. Nothing is edited, nothing is designed, nothing is checked.',
      gate:'None. Speed is the only thing that matters in this pass; judgement here is wasted.' },
    { id:'accuracy', label:'Accuracy pass', share:0.33, tool:'You, a highlighter, and the source material',
      does:'Every claim, figure, price and procedure checked against something real. Anything unverifiable is cut or labelled.',
      gate:t.gate },
    { id:'polish', label:'Polish pass', share:0.22, tool:t.family === 'creative' ? 'Canva' : t.family === 'edu' ? 'Gamma or Canva for slides, then the recorder' : 'Canva or a typesetting pass',
      does:'Consistency of naming, one visual system, working links, a change log, and the file names the buyer will see.',
      gate:'Open every file the way the buyer will: a fresh account, a phone, no fonts installed.' }
  ];
  return passes.map(p => Object.assign({}, p, { hours: round(H * p.share, 1) }));
}

/* ---------------------------------------------------------------------------
   Phase 7: quality assurance. Seven categories, and anything under 8/10 comes
   back with the specific thing to fix rather than a note to try harder.
   ------------------------------------------------------------------------- */
function buildQA(o, D){
  const t = o.type, a = o.asset;
  const val = D.val && D.val.complete ? D.val : null;
  const buyerNamed = !!(String(a.buyer||'').trim() || assetAudienceClause(a));
  const hasProof = String(a.evidence || '').trim().length > 15;
  const ceiling = val ? (val.rows.find(r => r.check.id === 'ceiling') || {}).value || 0 : 0;

  const rows = [
    { k:'Clarity', score: clamp(6 + (buyerNamed ? 2 : 0) + (wc(o.promise) <= 26 ? 1 : -1) + (a.depth - 3) * 0.4, 0, 10),
      fix:'Name the buyer in the product’s first sentence and cut the promise to one clause. A promise longer than twenty-six words is two promises.' },
    { k:'Practicality', score: clamp(t.ease * 0.5 + 3.5 + (t.family === 'prod' || t.family === 'biz' ? 1.5 : 0) + (a.depth - 3) * 0.5, 0, 10),
      fix:'Add the fill-in version of every artefact. A product that only explains is a product the buyer has to do the work twice for.' },
    { k:'Originality', score: clamp(10 - t.crowd + (hasProof ? 1.5 : 0) + (a.proof - 3) * 0.6 + clamp((wc(assetSubject(a)) - 2) * 0.4, 0, 1.6), 0, 10),
      fix:'Narrow the buyer until the title stops describing forty other products. Specificity is the only originality available on a crowded shelf.' },
    { k:'Commercial value', score: clamp((o.price >= 29 ? 7 : o.price >= 15 ? 5.5 : 4) + (ceiling >= 60 ? 2 : ceiling >= 20 ? 1 : 0) + (t.margin - 6) * 0.4, 0, 10),
      fix:'Either raise what is inside the Premium tier until it justifies the price, or drop the price and win on volume. The middle is where digital products die.' },
    { k:'Usability', score: clamp(7 + (firstUseMinutes(o) <= 20 ? 1.5 : firstUseMinutes(o) <= 35 ? 0.5 : -1) + (t.deliver.split(' + ').length >= 2 ? 1 : 0), 0, 10),
      fix:'Cut time-to-first-output to under twenty minutes. Put the quick start at the front and everything else behind it.' },
    { k:'Completeness', score: clamp(5.5 + (a.depth - 3) * 0.9 + (hasProof ? 1 : 0) + (t.family === 'info' ? 0.5 : 1), 0, 10),
      fix:'The eight-part spine has a repair section and a handover section for a reason; most products stop after the happy path and get refunded on the unhappy one.' },
    { k:'Scalability', score: clamp(t.scale - t.upkeep * 0.7 + 0.5, 0, 10),
      fix:'Upkeep is ' + t.upkeep + ' h per month per live product. Either date the product on its cover and sell it as a snapshot, or price the maintenance into the tier.' }
  ].map(r => Object.assign(r, { score: round(r.score, 1), pass: round(r.score,1) >= 8 }));

  const failing = rows.filter(r => !r.pass);
  return { rows, failing, avg: round(rows.reduce((s,r) => s + r.score, 0) / rows.length, 1), ship: failing.length === 0 };
}

/* ---------------------------------------------------------------------------
   Phase 8: the ecosystem. One validated product, the eight things it becomes.
   ------------------------------------------------------------------------- */
function buildEcosystem(o, D){

      effort:round(o.buildHours * 0.12, 1) + ' /mo',
      job:'Recurring revenue, but only once there are enough products that a member has a reason to stay past month three.' },
    { role:'Consulting',   name:S4 + ' — done with you',           price:charm(base * 8),
      from:'The core product, delivered to one buyer, live',

      job:'Does not scale and should not be hidden. It is the highest-margin hour in the studio and the best research you will ever be paid for.' },
    { role:'Certification',name:'Certified ' + S4 + ' Practitioner',price:charm(base * 12),
      from:'The course plus an assessment and a register of who passed',

<script>
"use strict";
/* ==========================================================================
   Phase 9, 15 and 19: the catalogue, the money it might make, and what
   scaling it actually costs.

   Read the assumptions block before you read any number below it. Nothing here
   is a forecast. It is arithmetic on figures you supplied and four rates this
   file made up, all four of which are printed next to their own outputs.
   ========================================================================== */

const ASSUMPTIONS = {
  reach:   { cold:0.02, warm:0.06, hot:0.12 },
  reachNote:'Share of your existing audience who see any given launch. Cold list: 2%. Warm: 6%. Hot: 12%.',
  /* Monthly organic visits a single live listing pulls on each platform, once
     it has been up long enough to rank. Made up. Replace with your own the
     moment you have thirty days of real data. */
  shelfTraffic:{ etsy:25, gumroad:4, payhip:1, selar:6, stan:0, creative:15, shopify:0 },
  shelfNote:'Monthly visits per live listing from the platform’s own traffic. A brand-new listing gets none of this for the first 60–90 days.',
  conv:    { low:0.010, base:0.025, high:0.050 },
  convNote:'Visitor-to-buyer conversion. 1% is a listing that works. 2.5% is a good listing to a warm visitor. 5% happens on a page you sent your own list to.',
  mix:     { beginner:0.45, pro:0.40, premium:0.13, enterprise:0.02 },
  mixNote:'Which tier buyers choose. Most take the cheapest complete thing; the ladder exists for the few who do not.',
  refundRate:0.03,
  refundNote:'Refunds as a share of gross. Digital goods run 2–5% with a clear sales page and 10%+ without one.'
};

/* --- catalogue selection: diverse on purpose, because ten ebooks from one
       asset is not a catalogue, it is a book that got out of hand --- */
function buildCatalogue(D, target){
  const s = D.s;
  const opps = D.opps;
  const perAsset = {}, perType = {}, perFamily = {};
  const chosen = [];
  const capAsset = Math.max(2, Math.ceil(target / Math.max(1, D.assets.length)) + 1);

  for(const o of opps){
    if(chosen.length >= target) break;
    const na = perAsset[o.assetId] || 0, nt = perType[o.typeId] || 0, nf = perFamily[o.type.family] || 0;
    if(na >= capAsset) continue;
    if(nt >= 2) continue;
    if(nf >= Math.ceil(target * 0.35)) continue;
    perAsset[o.assetId] = na + 1; perType[o.typeId] = nt + 1; perFamily[o.type.family] = nf + 1;
    chosen.push(o);
  }
  /* If the constraints starved the list, top it up in rank order. */
  for(const o of opps){
    if(chosen.length >= target) break;
    if(!chosen.includes(o)) chosen.push(o);
  }

  /* Order the chosen set for building: infrastructure first — the cheap, fast,
     high-SEO products that give the later ones something to sell into. */
  const staged = chosen.slice().sort((a, b) => {
    const sa = stageWeight(a, chosen.indexOf(a)), sb = stageWeight(b, chosen.indexOf(b));
    return sb - sa || a.buildHours - b.buildHours;
  });

  const weekly = Math.max(1, s.hours);
  let cumH = 0, liveUpkeep = 0;
  const rows = staged.map((o, i) => {
    cumH += o.buildHours;
    const weeksIn = cumH / weekly;
    liveUpkeep += o.upkeep;
    const upkeepWeekly = liveUpkeep / 4.33;
    return {
      n: i + 1, opp:o,
      stage: i < 10 ? 'infrastructure' : i < 25 ? 'compounding' : 'acceleration',
      hours:o.buildHours, cumHours:round(cumH, 1),
      week: Math.ceil(weeksIn), day: Math.ceil(weeksIn * 7),
      upkeepWeekly: round(upkeepWeekly, 2),
      freeWeekly: round(weekly - upkeepWeekly, 2),
      stalled: upkeepWeekly >= weekly * 0.75
    };
  });

  const stall = rows.find(r => r.stalled);
  return {
    rows,
    weekly,
    d30: rows.filter(r => r.day <= 30),
    d90: rows.filter(r => r.day <= 90),
    d365: rows.filter(r => r.day <= 365),
    stallAt: stall ? stall.n : null,
    totalHours: round(cumH, 1),
    totalUpkeep: round(liveUpkeep, 1)
  };
}
function stageWeight(o, idx){
  /* cheap + findable + scalable first; the expensive premium things later */
  return o.scores.seo * 1.3 + o.scores.scale * 1.0 + o.scores.ease * 1.2 + o.score * 0.05 - o.buildHours * 0.06;
}

/* --- the money. Three columns, and the middle one is not a promise. --- */
function buildEconomics(D, liveProducts, basePrice){
  const s = D.s;
  const opp = D.selected || D.opps[0] || null;
  /* Average order value comes from a base price and the four tier multipliers.
     With a product selected that base is its price; for a whole-catalogue
     projection it is the mean price of the products actually live that month,
     which is a different and more honest number. */
  const base = basePrice != null ? basePrice : (opp ? opp.price : 39);
  const tiers = TIER_SPEC.map(sp => ({ id:sp.id, label:sp.label, price: charm(base * sp.mult) }));
  const aov = round(tiers.reduce((a, t) => a + t.price * (ASSUMPTIONS.mix[t.id] || 0), 0), 2);

  const reach = ASSUMPTIONS.reach[s.visibility] || ASSUMPTIONS.reach.cold;
  const audienceVisits = Math.round(s.audience * reach);
  const shelfVisits = D.platforms.reduce((a, p) => a + (ASSUMPTIONS.shelfTraffic[p] || 0), 0) * Math.max(1, liveProducts || 1);
  const visits = audienceVisits + shelfVisits;

  const fee = D.feePct / 100;
  const monthlyPlatformCost = D.platforms.reduce((a, p) => a + (PLATFORMS[p].monthly || 0), 0);

  const scen = ['low','base','high'].map(k => {
    const c = ASSUMPTIONS.conv[k];
    const sales = visits * c;
    const gross = sales * aov;
    const net = gross * (1 - ASSUMPTIONS.refundRate) * (1 - fee) - monthlyPlatformCost;
    return {
      key:k,
      label: k === 'low' ? 'Pessimistic' : k === 'base' ? 'Base' : 'Optimistic',
      conv:c,
      sales: round(sales, 1),
      gross: round(gross, 0),
      net: round(net, 0),
      year: round(net * 12, 0)
    };
  });

  return { tiers, aov, base, visits, audienceVisits, shelfVisits, fee:D.feePct, monthlyPlatformCost, scen, liveProducts: liveProducts || 1 };
}

/* Twelve months, with the catalogue growing underneath it. */
function buildProjection(D, cat){
  const rows = [];
  for(let m = 1; m <= 12; m++){
    const day = m * 30.4;
    const liveRows = cat.rows.filter(r => r.day <= day);
    const live = Math.max(1, liveRows.length);
    const meanPrice = liveRows.length
      ? liveRows.reduce((a, r) => a + r.opp.price, 0) / liveRows.length
      : (cat.rows.length ? cat.rows[0].opp.price : null);
    const e = buildEconomics(D, live, meanPrice);
    const b = e.scen.find(x => x.key === 'base');
    const l = e.scen.find(x => x.key === 'low');
    rows.push({ m, live, visits:e.visits, low:l.net, base:b.net, cumBase: 0 });
  }
  let acc = 0;
  for(const r of rows){ acc += r.base; r.cumBase = round(acc, 0); }
  return rows;
}

/* --- Phase 19: scaling. What each catalogue size costs in people. --- */
function buildScaling(D, cat){
  const weekly = Math.max(1, D.s.hours);
  const marks = [1, 10, 25, 50, 100];
  return marks.map(n => {
    const rows = cat.rows.slice(0, Math.min(n, cat.rows.length));
    const upkeepMonthly = rows.reduce((a, r) => a + r.opp.upkeep, 0) +
      (n > cat.rows.length ? (n - cat.rows.length) * 1.4 : 0);
    const upkeepWeekly = upkeepMonthly / 4.33;
    const buildWeekly = Math.max(0, weekly - upkeepWeekly);
    const heads = upkeepWeekly / weekly;
    return {
      n,
      upkeepWeekly: round(upkeepWeekly, 1),
      buildWeekly: round(buildWeekly, 1),
      pctUpkeep: round(upkeepWeekly / weekly * 100, 0),
      hire: n <= 10 ? 'Nobody. At this size a hire is a way of avoiding the work.'
          : n <= 25 ? 'A virtual assistant, 5 h/week: listings, support replies, review requests.'
          : n <= 50 ? 'VA at 10 h/week plus a designer on retainer for covers and mockups.'
          : 'VA full-time, a designer, and an editor who owns the accuracy pass.',
      delegate: n <= 10 ? 'Nothing. You are still learning what the SOPs should say.'
          : n <= 25 ? 'Listing creation and customer support, against the SOPs in the Operations tab.'
          : n <= 50 ? 'Everything except the accuracy pass and pricing.'
          : 'Everything except pricing, positioning and what gets built next.',
      automate: n <= 10 ? 'Delivery and the receipt email. Nothing else is worth wiring yet.'
          : n <= 25 ? 'Review requests, the welcome sequence, and the weekly revenue pull into one sheet.'
          : n <= 50 ? 'Refund handling, licence issuance, and update notifications to past buyers.'
          : 'A quarterly audit that flags every product whose upkeep is overdue.',
      viable: buildWeekly >= 2
    };
  });
}

/* --- Phase 18: recurring revenue. --- */
function buildRecurring(D, cat){
  const opp = D.selected;
  const base = opp ? opp.price : 39;
  const price = charm(base * 0.35);
  const catSize = cat.rows.length;
  const tiers = [
    { label:'Prompt club',    price:charm(base * 0.22), gives:'Twelve new prompts a month, re-run against a current model and dated', churn:0.14,
      viable: catSize >= 5, why:'Cheap to run, fastest to churn. It needs new material every single month or it is a subscription to nothing.' },
    { label:'Template club',  price:charm(base * 0.35), gives:'Two new templates a month plus every past one in the archive', churn:0.09,
      viable: catSize >= 12, why:'The archive is the product. Below a dozen templates there is nothing to join for.' },
    { label:'Research club',  price:charm(base * 0.9),  gives:'One dated brief a month on what actually changed in the field', churn:0.07,
      viable: catSize >= 8, why:'Highest price, highest work. Only credible if you are genuinely in the field every week.' },
    { label:'Learning room',  price:charm(base * 0.5),  gives:'Access to every course, a monthly session, and the answered-questions archive', churn:0.08,
      viable: catSize >= 15, why:'Members stay for other members. Below a certain size the room is silent and people leave.' }
  ];
  return tiers.map(t => {
    const mrrAt = n => round(t.price * n, 0);
    return Object.assign(t, {
      at50: mrrAt(50), at200: mrrAt(200),
      halfLife: round(Math.log(0.5) / Math.log(1 - t.churn), 1),
      ltv: round(t.price / t.churn, 0)
    });
  });
}

<script>
"use strict";
/* ==========================================================================
   Phase 10 → 14 and 16 → 17: listings, keywords, images, content, email,
   the funnel, the licences and the SOPs.

   Every character limit below is enforced at generation time, not flagged
   afterwards, because a listing that has to be trimmed in the marketplace text

   ========================================================================== */

const INTENT_MODS = ['template','system','kit','checklist','guide','pdf','download','pack','for beginners','examples','worksheet','tracker','2026','free alternative'];
const BUYER_MODS  = ['for small business','for freelancers','for consultants','for agencies','for teachers','for students','for startups','for solo operators'];

function keywordSets(o, D){
  const a = o.asset;
  const subject = assetSubject(a);
  const short = shortSubject(a, 3);
  const buyer = buyerShort(a);
  const place = D.market.label;
  const toks = uniq(subject.split(/\s+/).filter(w => !STOP.has(w) && w.length > 2));
  const core = [short, subject, toks.slice(0, 2).join(' ')].filter(Boolean);

  const primary = uniq(rotate(INTENT_MODS, hash(o.id) % INTENT_MODS.length)
    .flatMap(m => core.map(c => (c + ' ' + m).trim()))).slice(0, 24);
  const secondary = uniq(rotate(BUYER_MODS, hash(o.id + 'b') % BUYER_MODS.length)
    .flatMap(m => [short + ' ' + m, o.type.label.toLowerCase() + ' ' + m])
    .concat(toks.map(t => t + ' ' + o.type.label.toLowerCase()))).slice(0, 24);
  const longtail = uniq([
    'how to do ' + subject + ' without hiring anyone',
    'best ' + o.type.label.toLowerCase() + ' for ' + buyer,
    subject + ' ' + o.type.label.toLowerCase() + ' ' + place.toLowerCase(),
    'what to charge for ' + subject,
    subject + ' checklist pdf download',
    'ready made ' + short + ' ' + o.type.label.toLowerCase(),
    short + ' template that actually works',
    'why ' + subject + ' keeps going wrong',
    subject + ' step by step for beginners',
    o.type.label.toLowerCase() + ' to hand ' + subject + ' to an assistant',
    short + ' ' + o.type.label.toLowerCase() + ' with worked example',
    'is a ' + short + ' ' + o.type.label.toLowerCase() + ' worth it'
  ]).slice(0, 14);

  return {
    primary, secondary, longtail,
    all: uniq(primary.concat(secondary, longtail)),
    intentSplit: {
      transactional: primary.length,
      commercial: secondary.length,
      informational: longtail.filter(k => /^how|^why|^what|^is /.test(k)).length
    }
  };
}

/* --- Phase 12: content marketing. --- */
function buildContent(o, D){
  const a = o.asset;

  ];

  const diagram = [
    '                    ┌──────────────────────────────┐',

    '                    └───────────────┬──────────────┘',

    '                    ┌───────────▼──────────────────┐',
    '                    │  Membership · ' + pad(usd(charm(base*0.35)) + '/mo', 14) + '│',
    '                    └───────────────┬──────────────┘',

  ].join('\n');

  return { stages, diagram, tiers };
}
function pad(s, n){ s = String(s); return s.length >= n ? s.slice(0, n) : s + ' '.repeat(n - s.length); }

/* --- Phase 16: licences. Plain English, because a licence nobody reads is a
       licence nobody honours. --- */
function buildLicences(o, D){
  const name = o.name;
  const studio = D.s.studio;
  const yr = new Date().getFullYear();
  const head = t => t + '\n' + '='.repeat(t.length) + '\n\nProduct: ' + name + '\nLicensor: ' + studio + '\nVersion: 1.0 (' + yr + ')\n';

/* --- Phase 17: SOPs. --- */
function buildSOPs(o, D){

  return [

      steps:[

        'Accuracy pass: ' + round(o.buildHours * 0.33, 1) + ' h. Check every claim against something real. Cut what you cannot check.',
        'Human gate: ' + t.gate,
        'Polish pass: ' + round(o.buildHours * 0.22, 1) + ' h. One visual system, working links, change log, buyer-facing file names.',
        'Open every file the way a buyer will: new account, phone, no fonts installed.',
        'Score it on the seven QA categories. Anything under 8 goes back.'
      ], automate:'None of it. This is the SOP that must stay human longest.' },

      ], automate:'Buffer or Make for scheduling only. Never automate the replies.' },
    { id:'support', label:'Customer support SOP', owner:'VA from product 11', freq:'Daily, 15 minutes', minutes:15,
      steps:[
        'Answer everything within one working day. Speed matters more than polish.',
        'Refunds: issue immediately, no questions, then record the stated reason in one line.',
        'A question asked three times becomes an FAQ entry and a line in the product.',

      ], automate:'Canned replies for delivery and refunds. Nothing else — a templated answer to a real question reads as one.' },
    { id:'reviews', label:'Review collection SOP', owner:'Automated', freq:'Triggered, day 10 and 24', minutes:5,
      steps:[
        'Day 10 after purchase: one line, asking for a review, linking straight to the box.',
        'Day 24: offer the workbook free in exchange for an honest review, explicitly including critical ones.',
        'Reply to every review, including the bad ones, in public, without defending.',
        'A one-star review with a fair complaint becomes a product update within a fortnight.'
      ], automate:'Fully. This is the highest-return automation in the studio.' },
    { id:'update', label:'Product update SOP', owner:'You', freq:'Quarterly per product', minutes: Math.round(t.upkeep * 60 * 3),
      steps:[
        'Re-check everything dated: prices, platform fees, model names, screenshots, syllabi.',
        'Run the type gate again: ' + t.gate,
        'Bump the version, write the change log entry, and email past buyers with what changed.',
        'If a product has had no sale in 90 days and needs upkeep, retire it rather than maintain it.'
